<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Einheitlicher Standort</title>
<link rel="apple-touch-icon" href="RSGI.png">
<link rel="icon" type="image/png" href="RSGI.png">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ist-blue-deep: #0B3D6E;
    --ist-blue: #1B5FA8;
    --ist-blue-mid: #2E77C9;
    --ist-azure: #E7F1FA;
    --ist-azure-mid: #CFE3F5;
    --ist-ink: #1F2A33;
    --ist-text: #3C4750;
    --ist-line: #D6E2ED;
    --ist-gold: #C9A227;
    --ist-white: #FFFFFF;
    --ist-background: #bfbfbf;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--ist-background);
    color: var(--ist-text);
    font-family: "Titillium Web", "Segoe UI", Arial, sans-serif;
    line-height: 1.5;
  }

  a { color: inherit; }
  img { max-width: 100%; display: block; }
  /* ---------- Top institutional strip ---------- */
  .top-strip {
    background: var(--ist-blue-deep);
    color: rgba(255,255,255,0.85);
    font-size: 0.8rem;
    padding: 0.4rem clamp(1rem, 4vw, 3rem);
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 0.01em;
  }

  .top-strip a {
    text-decoration: none;
    color: rgba(255,255,255,0.85);
    margin-left: 1.25rem;
  }
  .top-strip a:hover { text-decoration: underline; }

  /* ---------- Main header band ---------- */
  header.main-band {
    background: linear-gradient(180deg, var(--ist-blue-mid) 0%, var(--ist-blue) 100%);
    color: #fff;
    padding: 1.1rem clamp(1rem, 4vw, 3rem);
  }

  .band-inner {
    max-width: 1240px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 1rem;
    justify-content: space-between;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    text-decoration: none;
    color: #fff;
  }

  .brand-seal {
    width: 76px;
    height: 76px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .brand-seal img {
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 16px rgba(255,255,255,0.75)) drop-shadow(0 0 28px rgba(255,255,255,0.5));
  }

  .brand-seal svg { width: 30px; height: 30px; }

  .brand-text-group { display: flex; flex-direction: column; line-height: 1.15; }

  .brand-eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.72);
    font-weight: 400;
  }

  .brand-title {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

/* ---------- Flag stripe ---------- */
  .flag-stripe {
    display: flex;
    height: 8px;
  }
  .flag-stripe span { flex: 1 1 0; }
  .flag-stripe .stripe-1 { background: #005910; }
  .flag-stripe .stripe-2 { background: #000000; }
  .flag-stripe .stripe-3 { background: #005910; }

  /* ---------- Nav bar ---------- */
  nav.main-nav {
    background: var(--ist-white);
    border-bottom: 3px solid var(--ist-blue);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 10px rgba(11,61,110,0.08);
  }

  .nav-inner {
    max-width: 1240px;
    margin: 0 auto;
    display: flex;
    gap: 0.25rem;
    padding: 0 clamp(1rem, 4vw, 3rem);
    flex-wrap: wrap;
  }

  .nav-inner a {
    display: inline-block;
    padding: 0.95rem 1.1rem;
    font-size: 0.92rem;
    font-weight: 600;
    text-decoration: none;
    color: var(--ist-blue-deep);
    border-bottom: 3px solid transparent;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .nav-inner a:hover {
    background: var(--ist-azure);
    border-bottom-color: var(--ist-blue-mid);
  }
</style>
</head>
<body>

  <div class="top-strip">
    <span>Zentraler Exekutivrat der Union</span>
    <div>
      <a href="#">Deutscher</a>
      <a href="#">Italiano</a>
      <a href="#">English</a>
    </div>
  </div>

  <header class="main-band">
    <div class="band-inner">
      <a href="#" class="brand">
        <span class="brand-seal">
          <img src="USSEunion.png" alt="LogoReichStaseGruppeIndustrie">
        </span>
        <span class="brand-text-group">
          <span class="brand-eyebrow">ReichStaseGruppeIndustrie</span>
          <span class="brand-title">帝國工業集團</span>
        </span>
      </a>
    </div>
  </header>

  <div class="flag-stripe" aria-hidden="true">
    <span class="stripe-1"></span>
    <span class="stripe-2"></span>
    <span class="stripe-3"></span>
  </div>
