<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EWS - Ricerca</title>
<style>
/* =========================================================
   EWS Ricerca - stile unico (home e risultati abbinati)
   ========================================================= */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
  --glass:rgba(255,255,255,.26);
  --glass-hi:rgba(255,255,255,.36);
  --ring:inset 0 0 0 1px rgba(255,255,255,.3);
  --blue:#007aff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:#fff;font:14px/1.45 var(--font);
  background:
    radial-gradient(60% 55% at 12% 12%,#8fb4ff 0%,transparent 62%),
    radial-gradient(55% 50% at 88% 8%,#c9a0ff 0%,transparent 60%),
    radial-gradient(60% 55% at 80% 95%,#ff9fc6 0%,transparent 62%),
    radial-gradient(50% 45% at 10% 95%,#6fd6d0 0%,transparent 60%),
    #4a5bb5;
  background-attachment:fixed;
}
button{font-family:inherit}

/* ---------- barra superiore ---------- */
#top{
  position:sticky;top:0;z-index:5;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"logo form gear";
  align-items:center;gap:18px;padding:12px clamp(14px,3vw,28px);
  background:rgba(70,80,170,.36);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,.22);
}
#logo{grid-area:logo;color:#fff;text-decoration:none;font:700 26px/1 var(--font);letter-spacing:-.6px;text-shadow:0 1px 10px rgba(30,30,100,.3)}
#f{grid-area:form;width:100%;max-width:640px;margin:0}

/* barra di ricerca */
.sb{position:relative}
.sb .lens{position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-9px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;pointer-events:none}
#q{
  width:100%;height:42px;padding:0 42px 0 42px;border:0;border-radius:13px;outline:0;
  font:16px var(--font);color:#fff;background:var(--glass);box-shadow:var(--ring);
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  -webkit-appearance:none;appearance:none;transition:background .15s,box-shadow .15s;
}
#q::placeholder{color:rgba(255,255,255,.8)}
#q:hover{background:var(--glass-hi)}
#q:focus{background:var(--glass-hi);box-shadow:0 6px 24px rgba(20,20,80,.3),inset 0 0 0 2px rgba(255,255,255,.75)}
#clr{position:absolute;right:9px;top:50%;width:22px;height:22px;margin-top:-11px;border:0;border-radius:50%;padding:0;
  background:rgba(255,255,255,.4);color:#fff;font:16px/22px var(--font);text-align:center;cursor:pointer;display:none}
#clr:hover{background:rgba(255,255,255,.6)}
.sb.has #clr{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#hint{display:none;margin:8px 4px 0;font-size:13px;color:#fff;text-shadow:0 1px 6px rgba(30,30,100,.35)}
#hint.on{display:block}

/* ingranaggio */
#gear{grid-area:gear;width:40px;height:40px;padding:0;border:0;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;background:var(--glass);box-shadow:var(--ring);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:background .15s}
#gear svg{width:21px;height:21px;fill:#fff}
#gear:hover,#gear[aria-expanded=true]{background:var(--glass-hi)}

/* pannello impostazioni */
#cfg{
  display:none;position:fixed;z-index:20;top:62px;right:clamp(14px,3vw,28px);width:350px;max-width:calc(100vw - 20px);
  padding:16px 18px 18px;color:#1d1d1f;border-radius:16px;
  background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  box-shadow:0 14px 44px rgba(20,20,80,.35),0 0 0 1px rgba(0,0,0,.06);
}
#cfg.open{display:block}
#cfg h2{margin:0 0 4px;font:700 16px var(--font)}
#cfg h3{margin:14px 0 8px;font:600 12px var(--font);letter-spacing:.5px;text-transform:uppercase;color:#6e6e73}
#cfg .opts{display:flex;flex-wrap:wrap;gap:7px}
#cfg .opt{font:13px var(--font);color:#1d1d1f;cursor:pointer;padding:6px 13px;border-radius:999px;border:0;background:#ececf0}
#cfg .opt:hover{background:#e0e0e6}
#cfg .opt.on{background:var(--blue);color:#fff;font-weight:600}
#cfg .opt small{opacity:.7;font-weight:400}
#cfg .hint{margin:0;color:#6e6e73;font-size:13px}

/* ---------- risultati ---------- */
#main{max-width:900px;margin:0 auto;padding:14px clamp(14px,3vw,28px) 30px}
#bar{margin:2px 4px 12px;font-size:13px;color:#fff;text-shadow:0 1px 6px rgba(30,30,100,.35);min-height:18px}
#bar b{font-weight:600}
#load{display:none;margin:0 4px 12px;font-size:14px;color:#fff}
#res{
  color:#222;padding:10px 26px 12px;border-radius:18px;
  background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 12px 40px rgba(20,20,80,.25),0 0 0 1px rgba(255,255,255,.5);
}
#out{display:block}
.r{margin:16px 0 22px;overflow:hidden}
.r .t{margin:0;font-size:18px;font-weight:normal;line-height:1.25;word-break:break-word}
.r .t a{color:#1a0dab;text-decoration:none}
.r .t a:hover{text-decoration:underline}
.r .t a:visited{color:#681da8}
.r .u{margin:2px 0;color:#0b7a3b;font-size:13px;word-break:break-all}
.r .u i{font-style:normal;color:#70757a}
.r .d{color:#3c4043;font-size:14px;max-width:640px}
.r .d b{color:#000}
.r .p{margin-top:2px;color:#70757a;font-size:13px}
.r .th{float:left;width:92px;height:68px;margin:3px 14px 0 0;border:1px solid #ddd;border-radius:8px;background:#f6f6f8;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.r .th img{max-width:100%;max-height:100%;display:block}
.empty{padding:16px 0 10px;font-size:15px;line-height:1.6;color:#222}
.empty ul{margin:8px 0 0 20px;padding:0;font-size:14px;color:#444}
.empty.err{color:#c5221f}
#pager{display:none;margin:0 -6px;padding:10px 0 4px;border-top:1px solid #e6e6ea;font-size:14px;color:#222}
#pager a,#pager span{display:inline-block;margin:0 4px;padding:4px 10px;border-radius:8px;text-decoration:none;color:var(--blue);cursor:pointer}
#pager a:hover{background:#eef4ff}
#pager .cur{background:var(--blue);color:#fff;font-weight:600;cursor:default}
#foot{padding:6px 16px 24px;text-align:center;font-size:12px;color:rgba(255,255,255,.85)}

/* ---------- pagina iniziale ---------- */
#safari{display:none}
body.home #top{
  position:static;display:block;padding:max(14vh,56px) 20px 0;
  background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;
}
body.home #logo{display:none}
body.home #f{max-width:560px;margin:0 auto}
body.home #q{height:48px;font-size:17px;box-shadow:0 8px 30px rgba(20,20,80,.22),var(--ring)}
body.home #hint{max-width:560px;margin:8px auto 0}
body.home #main,body.home #foot{display:none}
body.home #safari{display:block;max-width:680px;margin:46px auto 0;padding:0 20px 90px}
body.home #gear{position:fixed;right:18px;bottom:18px;width:42px;height:42px;z-index:6}
body.home #cfg{top:auto;bottom:70px;right:18px}

#safari h2{margin:0 0 14px;font-size:20px;font-weight:700;letter-spacing:-.2px;text-shadow:0 1px 8px rgba(30,30,100,.25)}
#fav{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:20px 8px;margin-bottom:38px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;border:0;background:none;color:#fff;font:inherit;cursor:pointer}
.tile .ic{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 6px 16px rgba(20,20,80,.28),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .15s,box-shadow .15s}
.tile:hover .ic{transform:translateY(-2px) scale(1.04)}
.tile:active .ic{transform:scale(.94)}
.tile .lb{font-size:12px;text-shadow:0 1px 6px rgba(30,30,100,.35)}
.tile.on .ic{box-shadow:0 0 0 3px #fff,0 6px 18px rgba(20,20,80,.35)}
.tile.on .lb{font-weight:700}
#rec{display:flex;flex-wrap:wrap;gap:8px}
#rec button{font:14px var(--font);color:#fff;cursor:pointer;padding:8px 14px;border:0;border-radius:999px;
  background:rgba(255,255,255,.22);box-shadow:var(--ring);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#rec button:hover{background:rgba(255,255,255,.34)}

/* ---------- telefono: tutto in colonna ---------- */
@media (max-width:700px){
  #top{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"logo gear" "form form";gap:10px 12px;padding:10px 14px 12px}
  #logo{font-size:23px}
  #f{max-width:none}
  #res{padding:6px 16px 10px;border-radius:16px}
  .r .th{float:none;width:100%;height:150px;margin:0 0 8px}
  #cfg{left:10px;right:10px;width:auto;max-width:none;top:56px}
  body.home #top{display:block;padding:max(10vh,40px) 16px 0}
  body.home #safari{margin-top:34px;padding:0 16px 90px}
  body.home #cfg{left:10px;right:10px;top:auto;bottom:70px}
  #fav{grid-template-columns:repeat(4,1fr);gap:18px 6px}
}
@media (prefers-reduced-motion:reduce){.tile .ic{transition:none}}
</style>
</head>
<body class="home">

<header id="top">
  <a id="logo" href="./" aria-label="EWS - pagina iniziale">EWS</a>
  <form id="f" role="search" autocomplete="off">
    <div class="sb" id="sb">
      <svg class="lens" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>
      <input type="text" id="q" name="q" placeholder="Cerca in EWS" aria-label="Cerca"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" maxlength="120" autofocus>
      <button type="button" id="clr" aria-label="Cancella">&times;</button>
    </div>
    <input type="submit" class="sr" value="Cerca" tabindex="-1">
    <div id="hint">Scrivi almeno 2 caratteri per cercare.</div>
  </form>
  <button id="gear" type="button" aria-label="Impostazioni di ricerca" aria-expanded="false" aria-controls="cfg" title="Impostazioni di ricerca">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
  </button>
</header>

<div id="cfg" role="dialog" aria-label="Impostazioni di ricerca">
  <h2>Impostazioni di ricerca</h2>
  <h3>Dove</h3>
  <div class="opts" id="rp"></div>
  <h3>Tipo</h3>
  <div class="opts" id="rt"></div>
</div>

<section id="safari" aria-label="Pagina iniziale">
  <h2>Preferiti</h2>
  <div id="fav"></div>
  <div id="recwrap" style="display:none"><h2>Ricerche recenti</h2><div id="rec"></div></div>
</section>

<main id="main">
  <div id="bar"></div>
  <div id="load">Ricerca in corso...</div>
  <div id="res">
    <div id="out"></div>
    <div id="pager"></div>
  </div>
</main>
<footer id="foot">&copy; 2026 EWS</footer>

<script>
(function(){
"use strict";

var API = "/api/data?cerca=1";          // api/data.js
var PER = 10;                           // risultati per pagina
var KEY = new URLSearchParams(location.search).get("k") || "";

/* stato */
var repo = "all", pref = "", data = [], typeF = "tutti", page = 1, ultima = "", timer = null, seq = 0;

/* elementi */
function $(id){ return document.getElementById(id); }
var q = $("q"), sb = $("sb"), clr = $("clr"), hint = $("hint"), bar = $("bar"), load = $("load"),
    out = $("out"), pager = $("pager"), cfg = $("cfg"), gear = $("gear"), rp = $("rp"), rt = $("rt");

/* tipi di risultato */
var TIPI = { tutti:"Tutti", pagina:"Pagine", img:"Immagini", documento:"Documenti", dato:"Dati",
             atto:"Atti", progetto:"Progetti", wiki:"Wiki", elezione:"Elezioni", altro:"Altro" };
var ORDINE = ["pagina","wiki","atto","progetto","elezione","documento","img","dato","altro"];

/* i file di codice e di stile non compaiono mai (doppia sicurezza: la regola vera e' in api/data.js) */
var CODICE = /\.(m?js|cjs|jsx|tsx?|css|scss|sass|less|map)(\?.*)?(#.*)?$/i;

/* preferiti della home: [etichetta, dove, tipo preferito, icona, sfondo] */
var PREF = [
  ["Tutto",    "all",  "",         "🔍",       "linear-gradient(160deg,#9aa7ff,#5a64e0)"],
  ["Pagine",   "EWS",  "",         "🌐",       "linear-gradient(160deg,#5ac8fa,#007aff)"],
  ["Immagini", "IMG",  "",         "🖼️", "linear-gradient(160deg,#ffb36b,#ff5e7a)"],
  ["Atti",     "DATA", "atto",     "⚖️",       "linear-gradient(160deg,#8e8cff,#5856d6)"],
  ["Progetti", "DATA", "progetto", "📌",       "linear-gradient(160deg,#ffd75e,#ff9f0a)"],
  ["Wiki",     "DATA", "wiki",     "📚",       "linear-gradient(160deg,#6be58a,#2fb457)"],
  ["Elezioni", "DATA", "elezione", "🗳️", "linear-gradient(160deg,#ff8a80,#ff3b30)"]
];

/* ---------- utilita' ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function rx(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function nomeTipo(t){ return TIPI[t] || t; }
function paroleCercate(s){ return String(s).toLowerCase().split(/\s+/).filter(function(t){ return t.length > 1; }); }

/* grassetto sulle parole cercate */
function hl(text, parole){
  text = String(text);
  if (!parole.length) return esc(text);
  var re = new RegExp("(" + parole.map(rx).join("|") + ")", "gi");
  return text.split(re).map(function(p, i){ return i % 2 ? "<b>" + esc(p) + "</b>" : esc(p); }).join("");
}
/* indirizzo da mostrare: senza https:// e decodificato */
function vediUrl(u){
  var s = String(u).replace(/^https?:\/\//, "");
  try { s = decodeURIComponent(s); } catch(e){}
  return s;
}

/* ---------- ricerche recenti (salvate nel browser) ---------- */
function leggiRecenti(){ try { return JSON.parse(localStorage.getItem("ews_recenti") || "[]"); } catch(e){ return []; } }
function salvaRecente(t){
  try {
    var l = leggiRecenti().filter(function(x){ return x.toLowerCase() !== t.toLowerCase(); });
    l.unshift(t);
    localStorage.setItem("ews_recenti", JSON.stringify(l.slice(0, 8)));
  } catch(e){}
}

/* ---------- home ---------- */
function renderHome(){
  $("fav").innerHTML = PREF.map(function(p, i){
    var on = p[1] === repo && p[2] === pref;
    return '<button type="button" class="tile' + (on ? " on" : "") + '" data-i="' + i + '">' +
           '<span class="ic" style="background:' + p[4] + '">' + p[3] + '</span><span class="lb">' + esc(p[0]) + '</span></button>';
  }).join("");
  var rec = leggiRecenti();
  $("recwrap").style.display = rec.length ? "block" : "none";
  $("rec").innerHTML = rec.map(function(t){ return '<button type="button" data-q="' + esc(t) + '">' + esc(t) + "</button>"; }).join("");
}
function vaiHome(){
  seq++; data = []; ultima = ""; clearTimeout(timer);
  document.body.className = "home";
  load.style.display = "none"; bar.textContent = ""; out.innerHTML = ""; pager.style.display = "none";
  aggiornaUrl("");
  renderCfg(); renderHome();
}

/* ---------- impostazioni (ingranaggio) ---------- */
function opts(list, cur, attr){
  return list.map(function(x){
    return '<button type="button" class="opt' + (cur === x[0] ? " on" : "") + '" data-' + attr + '="' + esc(x[0]) + '">' + x[1] + "</button>";
  }).join("");
}
function renderCfg(){
  rp.innerHTML = opts([["all","Tutto"],["EWS","Pagine del sito"],["IMG","Immagini"],["DATA","Atti e dati"]], repo, "r");
  if (data.length){
    var cont = {};
    data.forEach(function(d){ cont[d.type] = (cont[d.type] || 0) + 1; });
    var tipi = ORDINE.filter(function(t){ return cont[t]; })
               .concat(Object.keys(cont).filter(function(t){ return ORDINE.indexOf(t) < 0; }));
    var lista = [["tutti", "Tutti <small>(" + data.length + ")</small>"]]
      .concat(tipi.map(function(t){ return [t, esc(nomeTipo(t)) + " <small>(" + cont[t] + ")</small>"]; }));
    rt.innerHTML = opts(lista, typeF, "t");
  } else {
    rt.innerHTML = '<p class="hint">Fai una ricerca per filtrare per tipo di risultato.</p>';
  }
}
function apriCfg(on){
  cfg.classList.toggle("open", on);
  gear.setAttribute("aria-expanded", on ? "true" : "false");
}
gear.addEventListener("click", function(e){ e.stopPropagation(); apriCfg(!cfg.classList.contains("open")); });
cfg.addEventListener("click", function(e){
  e.stopPropagation();
  var b = e.target.closest("button"); if (!b) return;
  var r = b.getAttribute("data-r"), t = b.getAttribute("data-t");
  if (r !== null){
    repo = r; pref = "";
    if (q.value.trim().length > 1) search(); else { renderCfg(); renderHome(); }
  }
  if (t !== null){
    typeF = t; pref = t === "tutti" ? "" : t; page = 1;
    show(); renderCfg();
  }
});
document.addEventListener("click", function(){ apriCfg(false); });

/* ---------- risultati ---------- */
function show(){
  var list = data.filter(function(d){ return typeF === "tutti" || d.type === typeF; });
  var parole = paroleCercate(ultima);
  var filtro = [];
  if (repo !== "all") filtro.push(repo);
  if (typeF !== "tutti") filtro.push(nomeTipo(typeF));

  if (!list.length){
    bar.textContent = "";
    out.innerHTML = '<div class="empty"><b>Nessun risultato per “' + esc(ultima) + '”.</b>' +
      "<ul><li>Controlla che le parole siano scritte correttamente.</li>" +
      "<li>Prova con parole diverse o più generiche.</li>" +
      "<li>Controlla le impostazioni (ingranaggio): potresti aver filtrato troppo.</li></ul></div>";
    pager.style.display = "none";
    return;
  }

  bar.innerHTML = "<b>Circa " + list.length + (list.length === 1 ? " risultato" : " risultati") + "</b>" +
                  (filtro.length ? " · filtro: " + esc(filtro.join(", ")) : "");

  var pagine = Math.ceil(list.length / PER);
  if (page > pagine) page = pagine;
  out.innerHTML = list.slice((page - 1) * PER, page * PER).map(function(d){
    var th = (d.type === "img" && d.raw)
      ? '<a class="th" href="' + esc(d.url) + '" target="_blank" rel="noopener" tabindex="-1">' +
        '<img loading="lazy" src="' + esc(d.raw) + '" alt="" onerror="this.parentNode.style.display=\'none\'"></a>' : "";
    return '<div class="r">' + th +
      '<h3 class="t"><a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + hl(d.name, parole) + "</a></h3>" +
      '<div class="u">' + esc(vediUrl(d.url)) + " <i>· " + esc(nomeTipo(d.type)) + "</i></div>" +
      (d.snippet ? '<div class="d">' + hl(String(d.snippet).slice(0, 220), parole) + "</div>" : "") +
      (d.path ? '<div class="p">' + hl(d.path, parole) + "</div>" : "") +
      "</div>";
  }).join("");

  if (pagine > 1){
    var h = "";
    if (page > 1) h += '<a data-p="' + (page - 1) + '">‹ Precedente</a>';
    for (var i = 1; i <= pagine; i++) h += i === page ? '<span class="cur">' + i + "</span>" : '<a data-p="' + i + '">' + i + "</a>";
    if (page < pagine) h += '<a data-p="' + (page + 1) + '">Successiva ›</a>';
    pager.innerHTML = h; pager.style.display = "block";
  } else pager.style.display = "none";
}
pager.addEventListener("click", function(e){
  var p = e.target.getAttribute && e.target.getAttribute("data-p"); if (!p) return;
  page = +p; show(); window.scrollTo(0, 0);
});

/* ---------- indirizzo della pagina: ?q=... si puo' condividere e ricaricare ---------- */
function aggiornaUrl(term){
  try {
    var u = new URL(location.href);
    if (term) u.searchParams.set("q", term); else u.searchParams.delete("q");
    history.replaceState(null, "", u);
  } catch(e){}
}

/* ---------- ricerca ---------- */
function search(){
  var term = q.value.trim().replace(/\s+/g, " ");
  hint.classList.remove("on");
  if (!term){ vaiHome(); return; }
  if (term.length < 2){ hint.classList.add("on"); return; }

  ultima = term;
  var mio = ++seq;
  document.body.className = "";
  aggiornaUrl(term);
  load.style.display = "block"; bar.textContent = ""; out.innerHTML = ""; pager.style.display = "none";

  fetch(API + "&q=" + encodeURIComponent(term) + "&repo=" + encodeURIComponent(repo) + "&k=" + encodeURIComponent(KEY))
    .then(function(r){
      return r.json().catch(function(){ throw new Error("Risposta non valida dal server (" + r.status + ")"); });
    })
    .then(function(j){
      if (mio !== seq) return;                         // risposta vecchia: ignorata
      load.style.display = "none";
      if (j.error){ out.innerHTML = '<div class="empty err">' + esc(j.error) + "</div>"; renderCfg(); return; }
      data = (j.results || []).filter(function(d){ return !CODICE.test(d.path || "") && !CODICE.test(d.name || ""); });
      page = 1;
      typeF = (pref && data.some(function(d){ return d.type === pref; })) ? pref : "tutti";
      if (data.length) salvaRecente(term);
      renderCfg(); show();
      if (j.errors && j.errors.length) bar.innerHTML += " · alcune fonti non hanno risposto";
    })
    .catch(function(err){
      if (mio !== seq) return;
      load.style.display = "none";
      out.innerHTML = '<div class="empty err">Errore di rete: ' + esc(err.message || "riprova tra poco") + ".</div>";
    });
}

/* ---------- barra di ricerca ---------- */
function aggiornaBarra(){ sb.classList.toggle("has", q.value.length > 0); }
q.addEventListener("input", function(){
  aggiornaBarra(); hint.classList.remove("on");
  clearTimeout(timer);
  timer = setTimeout(search, 500);                     // cerca mentre scrivi
});
$("f").addEventListener("submit", function(e){ e.preventDefault(); clearTimeout(timer); search(); });
clr.addEventListener("click", function(){ q.value = ""; aggiornaBarra(); clearTimeout(timer); vaiHome(); q.focus(); });
$("logo").addEventListener("click", function(e){ e.preventDefault(); q.value = ""; aggiornaBarra(); vaiHome(); q.focus(); });
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") apriCfg(false);
  else if (e.key === "/" && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); q.select(); }
});

/* ---------- home: preferiti e recenti ---------- */
$("safari").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-i")){
    var p = PREF[+b.getAttribute("data-i")];
    repo = p[1]; pref = p[2];
    if (q.value.trim().length > 1) search(); else { renderCfg(); renderHome(); q.focus(); }
  } else if (b.hasAttribute("data-q")){
    q.value = b.getAttribute("data-q"); aggiornaBarra(); search();
  }
});

/* ---------- avvio ---------- */
renderCfg(); renderHome();
var q0 = (new URLSearchParams(location.search).get("q") || "").trim();
if (q0.length > 1){ q.value = q0; aggiornaBarra(); search(); }
})();
</script>
