<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTF News – Articolo</title>
<link rel="apple-touch-icon" href="RTFnews-slim.png">
<link rel="icon" type="image/jpeg" href="RTFnews-slim.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --rf-red: #c83b2f;
    --rf-blue: #173b73;
    --rf-gold: #d6a536;
    --rf-ink: #08090b;
    --rf-panel: #121417;
    --rf-paper: #f3efe6;
    --rf-muted: rgba(243,239,230,0.68);
    --rf-line: rgba(243,239,230,0.12);
  }
  body {
    background: var(--rf-ink);
    color: var(--rf-paper);
    font-family: "Barlow", sans-serif;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
  
  /* Navbar */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2rem;
    background: rgba(8,9,11,0.95);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(214,165,54,0.18);
  }
  .nav-brand {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    text-decoration: none;
    color: white;
  }
  .brand-mark {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(214,165,54,0.55);
    background: linear-gradient(135deg, var(--rf-blue) 0 50%, var(--rf-red) 50% 100%);
  }
  .brand-mark span {
    font-family: "Bebas Neue", sans-serif;
    font-size: 1.35rem;
  }
  .brand-text {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .back-link {
    color: var(--rf-gold);
    text-decoration: none;
    font-family: "Barlow Condensed", sans-serif;
    letter-spacing: 0.1em;
  }
  
  /* Articolo */
  .article-header { margin-bottom: 2rem; border-bottom: 1px solid var(--rf-line); padding-bottom: 1rem; }
  .category-badge {
    display: inline-block;
    background: var(--rf-red);
    padding: 0.25rem 0.7rem;
    font-family: "Barlow Condensed", sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    margin-bottom: 1rem;
  }
  .verified-badge {
    display: inline-block;
    background: #2a7f3e;
    padding: 0.2rem 0.5rem;
    font-size: 0.7rem;
    margin-left: 0.5rem;
  }
  h1 { font-family: "Bebas Neue", sans-serif; font-size: clamp(2rem, 5vw, 3.5rem); margin: 0.5rem 0; }
  .article-meta { color: var(--rf-muted); font-size: 0.9rem; margin: 1rem 0; display: flex; gap: 1.5rem; flex-wrap: wrap; }
  
  /* Carosello */
  .carousel-section {
    margin: 3rem 0 2rem 0;
    border-top: 1px solid var(--rf-line);
    padding-top: 2rem;
  }
  .carousel-title {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 1.3rem;
    letter-spacing: 0.1em;
    margin-bottom: 1rem;
    color: var(--rf-gold);
  }
  .carousel {
    position: relative;
    background: var(--rf-panel);
    border-radius: 8px;
    overflow: hidden;
  }
  .carousel-inner {
    position: relative;
    min-height: 400px;
  }
  .carousel-slide {
    display: none;
    text-align: center;
  }
  .carousel-slide.active { display: block; }
  .carousel-slide img {
    max-width: 100%;
    max-height: 500px;
    object-fit: contain;
  }
  .carousel-caption {
    padding: 1rem;
    background: rgba(0,0,0,0.7);
    margin-top: -4px;
  }
  .carousel-controls {
    position: absolute;
    top: 50%;
    width: 100%;
    display: flex;
    justify-content: space-between;
    transform: translateY(-50%);
    padding: 0 1rem;
  }
  .carousel-btn {
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    padding: 0.8rem 1.2rem;
    cursor: pointer;
    font-size: 1.2rem;
    border-radius: 50%;
    transition: background 0.2s;
  }
  .carousel-btn:hover { background: rgba(0,0,0,0.9); }
  .carousel-dots {
    text-align: center;
    padding: 1rem;
  }
  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    background: #666;
    border-radius: 50%;
    margin: 0 5px;
    cursor: pointer;
  }
  .dot.active { background: var(--rf-gold); }
  
  /* Contenuto articolo (solo testo) */
  .article-content {
    font-size: 1.1rem;
    line-height: 1.7;
    margin: 2rem 0;
  }
  .article-content p { margin: 1rem 0; white-space: pre-wrap; }
  
  /* Fonti */
  .sources-section {
    background: var(--rf-panel);
    padding: 1.5rem;
    border-left: 3px solid var(--rf-gold);
    margin-top: 2rem;
  }
  .sources-section h3 { color: var(--rf-gold); margin-bottom: 0.5rem; }
  .sources-section ul { margin-left: 1.5rem; }
  
  /* Like/dislike */
  .like-section {
    display: flex;
    gap: 1rem;
    margin: 2rem 0;
    padding-top: 1rem;
    border-top: 1px solid var(--rf-line);
  }
  .like-btn, .dislike-btn {
    background: none;
    border: 1px solid rgba(243,239,230,0.2);
    padding: 0.5rem 1.2rem;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--rf-paper);
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border-radius: 4px;
  }
  .like-btn:hover { background: rgba(214,165,54,0.2); border-color: var(--rf-gold); }
  .dislike-btn:hover { background: rgba(200,59,47,0.2); border-color: var(--rf-red); }
  .like-btn.active-like { background: rgba(214,165,54,0.3); border-color: var(--rf-gold); color: var(--rf-gold); }
  .dislike-btn.active-dislike { background: rgba(200,59,47,0.3); border-color: var(--rf-red); color: #ff8a7a; }
  
  footer {
    text-align: center;
    padding: 2rem;
    border-top: 1px solid var(--rf-line);
    margin-top: 3rem;
  }
  
  .loading { text-align: center; padding: 3rem; }
  .error { text-align: center; padding: 3rem; color: var(--rf-red); }
  .toast-msg {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--rf-gold);
    color: #08090b;
    padding: 0.6rem 1.2rem;
    border-radius: 30px;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: bold;
    z-index: 200;
    display: none;
  }
  
  @media (max-width: 768px) {
    .container { padding: 1rem; }
    .carousel-controls { padding: 0 0.5rem; }
    .carousel-btn { padding: 0.5rem 0.8rem; font-size: 1rem; }
  }
</style>
</head>
<body>
<nav>
  <a href="newsletter.html" class="nav-brand">
    <span class="brand-mark"><span>RF</span></span>
    <span class="brand-text">Rete Forlivese</span>
  </a>
  <a href="newsletter.html" class="back-link">← Torna alla home</a>
</nav>

<div class="container" id="articleContainer">
  <div class="loading">⏳ Caricamento articolo...</div>
</div>
<div id="voteToast" class="toast-msg">👍 Voto registrato</div>

<footer>
  <p>Rete Forlivese - Informazione partecipata e antifascista</p>
</footer>

<script>
  const BIN_ID = "69f3d0a936566621a80f357f";
  const API_KEY = "$2a$10$JWsV3hKpO6l.WAB//Gdnw.WMMlUmclCw5mT1gTzHJVsdef/p0swoO";
  const STORAGE_VOTES_KEY = "RF_article_votes_page";
  
  let currentArticle = null;
  let localUserChoices = {};  // solo per memorizzare la scelta dell'utente (null, 'like', 'dislike')
  
  function getArticleIdFromURL() {
    const params = new URLSearchParams(window.location.search);
    return parseInt(params.get('id'));
  }
  
  function loadLocalChoices() {
    const stored = localStorage.getItem(STORAGE_VOTES_KEY);
    if (stored) {
      try { localUserChoices = JSON.parse(stored); } catch(e) { localUserChoices = {}; }
    }
  }
  
  function saveLocalChoices() {
    localStorage.setItem(STORAGE_VOTES_KEY, JSON.stringify(localUserChoices));
  }
  
  function getUserChoice(articleId) {
    return localUserChoices[articleId] || null;
  }
  
  function setUserChoice(articleId, choice) {
    if (choice === null) delete localUserChoices[articleId];
    else localUserChoices[articleId] = choice;
    saveLocalChoices();
  }
  
  function showToast(message, isError = false) {
    const toast = document.getElementById('voteToast');
    toast.textContent = message;
    toast.style.backgroundColor = isError ? '#c83b2f' : '#d6a536';
    toast.style.color = '#08090b';
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2500);
  }
  
  // Aggiorna il JSONBin con il voto (delta basato su previousChoice e newChoice)
  async function applyVoteToServer(articleId, previousChoice, newChoice) {
    // Calcola delta
    let deltaLikes = 0;
    let deltaDislikes = 0;
    
    if (previousChoice === newChoice) {
      // Stesso bottone premuto due volte → rimuovi voto
      if (previousChoice === 'like') deltaLikes = -1;
      else if (previousChoice === 'dislike') deltaDislikes = -1;
      newChoice = null;   // dopo rimozione
    } else {
      // Cambio o nuovo voto
      if (previousChoice === 'like') deltaLikes = -1;
      if (previousChoice === 'dislike') deltaDislikes = -1;
      if (newChoice === 'like') deltaLikes += 1;
      if (newChoice === 'dislike') deltaDislikes += 1;
    }
    
    if (deltaLikes === 0 && deltaDislikes === 0) {
      return { likes: currentArticle.likes, dislikes: currentArticle.dislikes, newChoice: previousChoice };
    }
    
    // Recupera dati attuali dal server (per evitare conflitti)
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    if (!res.ok) throw new Error('Impossibile leggere i dati');
    const data = await res.json();
    const articles = data.record.articles || [];
    const articleIndex = articles.findIndex(a => a.id === articleId);
    if (articleIndex === -1) throw new Error('Articolo non trovato nel database');
    
    const article = articles[articleIndex];
    // Assicura che likes/dislikes esistano
    if (typeof article.likes !== 'number') article.likes = 0;
    if (typeof article.dislikes !== 'number') article.dislikes = 0;
    
    article.likes += deltaLikes;
    article.dislikes += deltaDislikes;
    if (article.likes < 0) article.likes = 0;
    if (article.dislikes < 0) article.dislikes = 0;
    
    // Salva nel bin
    const updatedRecord = { ...data.record, articles };
    const putRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': API_KEY
      },
      body: JSON.stringify(updatedRecord)
    });
    if (!putRes.ok) throw new Error('Salvataggio fallito');
    
    return { likes: article.likes, dislikes: article.dislikes, newChoice };
  }
  
  async function voteArticle(articleId, clickedType) {
    if (!currentArticle || currentArticle.id !== articleId) return;
    
    const previousChoice = getUserChoice(articleId);
    let newChoice = clickedType;
    if (previousChoice === clickedType) newChoice = null;  // toggle off
    // Caso in cui clicca un bottone diverso → newChoice già = clickedType
    
    // UI immediata: disabilita bottoni durante l'operazione
    const likeBtn = document.getElementById('likeBtn');
    const dislikeBtn = document.getElementById('dislikeBtn');
    const originalLikeHtml = likeBtn?.innerHTML;
    const originalDislikeHtml = dislikeBtn?.innerHTML;
    if (likeBtn) likeBtn.disabled = true;
    if (dislikeBtn) dislikeBtn.disabled = true;
    
    try {
      const result = await applyVoteToServer(articleId, previousChoice, newChoice);
      // Aggiorna l'articolo corrente con i nuovi conteggi
      currentArticle.likes = result.likes;
      currentArticle.dislikes = result.dislikes;
      // Salva la scelta utente locale (result.newChoice è il nuovo stato)
      setUserChoice(articleId, result.newChoice);
      
      // Aggiorna UI contatori e stili
      const likeSpan = document.getElementById('likeCount');
      const dislikeSpan = document.getElementById('dislikeCount');
      if (likeSpan) likeSpan.textContent = result.likes;
      if (dislikeSpan) dislikeSpan.textContent = result.dislikes;
      
      if (likeBtn) {
        likeBtn.classList.toggle('active-like', result.newChoice === 'like');
        likeBtn.disabled = false;
        likeBtn.innerHTML = originalLikeHtml; // ripristina
      }
      if (dislikeBtn) {
        dislikeBtn.classList.toggle('active-dislike', result.newChoice === 'dislike');
        dislikeBtn.disabled = false;
        dislikeBtn.innerHTML = originalDislikeHtml;
      }
      showToast(result.newChoice ? (result.newChoice === 'like' ? '👍 Like registrato!' : '👎 Dislike registrato!') : '✖️ Voto rimosso');
    } catch (err) {
      console.error(err);
      showToast('❌ Errore nel salvataggio del voto. Riprova.', true);
      if (likeBtn) likeBtn.disabled = false;
      if (dislikeBtn) dislikeBtn.disabled = false;
    }
  }
  
  async function loadArticle() {
    const articleId = getArticleIdFromURL();
    if (!articleId) {
      document.getElementById('articleContainer').innerHTML = '<div class="error">❌ Articolo non specificato</div>';
      return;
    }
    
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 'X-Master-Key': API_KEY }
      });
      if (!res.ok) throw new Error('Errore caricamento');
      const data = await res.json();
      const articles = data.record.articles || [];
      const article = articles.find(a => a.id === articleId);
      
      if (!article) {
        document.getElementById('articleContainer').innerHTML = '<div class="error">❌ Articolo non trovato</div>';
        return;
      }
      // Normalizza likes/dislikes
      if (typeof article.likes !== 'number') article.likes = 0;
      if (typeof article.dislikes !== 'number') article.dislikes = 0;
      
      currentArticle = article;
      renderArticle(article);
    } catch(e) {
      document.getElementById('articleContainer').innerHTML = `<div class="error">❌ Errore: ${e.message}</div>`;
    }
  }
  
  function formatContent(text) {
    if (!text) return '<p>Contenuto non disponibile.</p>';
    const paragraphs = text.split(/\n\s*\n/);
    return paragraphs.map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`).join('');
  }
  
  function initCarousel(images) {
    if (!images || images.length === 0) return;
    
    let currentIndex = 0;
    const inner = document.getElementById('carouselInner');
    const dotsContainer = document.getElementById('carouselDots');
    
    inner.innerHTML = '';
    dotsContainer.innerHTML = '';
    
    images.forEach((img, idx) => {
      const slide = document.createElement('div');
      slide.className = 'carousel-slide';
      if (idx === 0) slide.classList.add('active');
      slide.innerHTML = `
        <img src="${escapeHtml(img.url)}" alt="${escapeHtml(img.caption || 'Immagine')}" onerror="this.src='https://placehold.co/800x400/333/white?text=Immagine+non+disponibile'">
        <div class="carousel-caption">
          <p>${escapeHtml(img.caption || '')}</p>
          <small>${escapeHtml(img.credit || '')}</small>
        </div>
      `;
      inner.appendChild(slide);
      
      const dot = document.createElement('span');
      dot.className = 'dot';
      if (idx === 0) dot.classList.add('active');
      dot.addEventListener('click', () => showSlide(idx));
      dotsContainer.appendChild(dot);
    });
    
    function showSlide(index) {
      const slides = document.querySelectorAll('.carousel-slide');
      const dots = document.querySelectorAll('.dot');
      if (index < 0) index = slides.length - 1;
      if (index >= slides.length) index = 0;
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
      });
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
      currentIndex = index;
    }
    
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    if (prevBtn) prevBtn.addEventListener('click', () => showSlide(currentIndex - 1));
    if (nextBtn) nextBtn.addEventListener('click', () => showSlide(currentIndex + 1));
  }
  
  function renderArticle(article) {
    const container = document.getElementById('articleContainer');
    const verifiedBadge = article.verified ? '<span class="verified-badge">✅ Verificato RF</span>' : '';
    const userChoice = getUserChoice(article.id);
    
    let carouselHtml = '';
    if (article.images && article.images.length > 0) {
      carouselHtml = `
        <div class="carousel-section">
          <div class="carousel-title">📷 GALLERY FOTOGRAFICA</div>
          <div class="carousel" id="articleCarousel">
            <div class="carousel-inner" id="carouselInner"></div>
            <div class="carousel-controls">
              <button class="carousel-btn" id="prevBtn">◀</button>
              <button class="carousel-btn" id="nextBtn">▶</button>
            </div>
            <div class="carousel-dots" id="carouselDots"></div>
          </div>
        </div>
      `;
    }
    
    let sourcesHtml = '';
    if (article.sources && article.sources.length > 0) {
      sourcesHtml = `
        <div class="sources-section">
          <h3>📚 Fonti e approfondimenti</h3>
          <ul>
            ${article.sources.map(s => `<li>${escapeHtml(s)}</li>`).join('')}
          </ul>
        </div>
      `;
    }
    
    container.innerHTML = `
      <div class="article-header">
        <span class="category-badge">${escapeHtml(article.category || 'ATTUALITÀ')}</span>${verifiedBadge}
        <h1>${escapeHtml(article.title)}</h1>
        <div class="article-meta">
          <span>📅 ${escapeHtml(article.date || 'Data non specificata')}</span>
          <span>✍️ ${escapeHtml(article.author || 'Redazione')}</span>
        </div>
      </div>
      <div class="article-content">
        ${formatContent(article.fullContent || article.excerpt || 'Contenuto non disponibile.')}
      </div>
      <div class="like-section">
        <button class="like-btn ${userChoice === 'like' ? 'active-like' : ''}" id="likeBtn">
          👍 <span id="likeCount">${article.likes}</span>
        </button>
        <button class="dislike-btn ${userChoice === 'dislike' ? 'active-dislike' : ''}" id="dislikeBtn">
          👎 <span id="dislikeCount">${article.dislikes}</span>
        </button>
      </div>
      ${carouselHtml}
      ${sourcesHtml}
    `;
    
    if (article.images && article.images.length > 0) {
      initCarousel(article.images);
    }
    
    const likeBtn = document.getElementById('likeBtn');
    const dislikeBtn = document.getElementById('dislikeBtn');
    if (likeBtn) {
      likeBtn.addEventListener('click', () => voteArticle(article.id, 'like'));
    }
    if (dislikeBtn) {
      dislikeBtn.addEventListener('click', () => voteArticle(article.id, 'dislike'));
    }
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  loadLocalChoices();
  loadArticle();
</script>
</body>
</html>
