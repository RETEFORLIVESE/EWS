<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RF News – Articolo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --rf-red: #c83b2f;
    --rf-blue: #173b73;
    --rf-gold: #d6a536;
    --rf-ink: #08090b;
    --rf-panel: #121417;
    --rf-paper: #f3efe6;
    --rf-muted: rgba(243,239,230,0.68);
    --rf-line: rgba(243,239,230,0.12);
  }
  body {
    background: var(--rf-ink);
    color: var(--rf-paper);
    font-family: "Barlow", sans-serif;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
  
  /* Navbar */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2rem;
    background: rgba(8,9,11,0.95);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(214,165,54,0.18);
  }
  .nav-brand {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    text-decoration: none;
    color: white;
  }
  .brand-mark {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(214,165,54,0.55);
    background: linear-gradient(135deg, var(--rf-blue) 0 50%, var(--rf-red) 50% 100%);
  }
  .back-link {
    color: var(--rf-gold);
    text-decoration: none;
    font-family: "Barlow Condensed", sans-serif;
    letter-spacing: 0.1em;
  }
  
  /* Articolo */
  .article-header { margin-bottom: 2rem; border-bottom: 1px solid var(--rf-line); padding-bottom: 1rem; }
  .category-badge {
    display: inline-block;
    background: var(--rf-red);
    padding: 0.25rem 0.7rem;
    font-family: "Barlow Condensed", sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    margin-bottom: 1rem;
  }
  .verified-badge {
    display: inline-block;
    background: #2a7f3e;
    padding: 0.2rem 0.5rem;
    font-size: 0.7rem;
    margin-left: 0.5rem;
  }
  h1 { font-family: "Bebas Neue", sans-serif; font-size: clamp(2rem, 5vw, 3.5rem); margin: 0.5rem 0; }
  .article-meta { color: var(--rf-muted); font-size: 0.9rem; margin: 1rem 0; display: flex; gap: 1.5rem; flex-wrap: wrap; }
  
  /* Carosello */
  .carousel {
    position: relative;
    margin: 2rem 0;
    background: var(--rf-panel);
    border-radius: 8px;
    overflow: hidden;
  }
  .carousel-inner {
    position: relative;
    min-height: 400px;
  }
  .carousel-slide {
    display: none;
    text-align: center;
  }
  .carousel-slide.active { display: block; }
  .carousel-slide img {
    max-width: 100%;
    max-height: 500px;
    object-fit: contain;
  }
  .carousel-caption {
    padding: 1rem;
    background: rgba(0,0,0,0.7);
    margin-top: -4px;
  }
  .carousel-controls {
    position: absolute;
    top: 50%;
    width: 100%;
    display: flex;
    justify-content: space-between;
    transform: translateY(-50%);
    padding: 0 1rem;
  }
  .carousel-btn {
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    padding: 0.8rem 1.2rem;
    cursor: pointer;
    font-size: 1.2rem;
    border-radius: 50%;
  }
  .carousel-dots {
    text-align: center;
    padding: 1rem;
  }
  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    background: #666;
    border-radius: 50%;
    margin: 0 5px;
    cursor: pointer;
  }
  .dot.active { background: var(--rf-gold); }
  
  /* Contenuto */
  .article-content {
    font-size: 1.1rem;
    line-height: 1.7;
    margin: 2rem 0;
  }
  .article-content p { margin: 1rem 0; }
  
  /* Fonti */
  .sources-section {
    background: var(--rf-panel);
    padding: 1.5rem;
    border-left: 3px solid var(--rf-gold);
    margin-top: 2rem;
  }
  .sources-section h3 { color: var(--rf-gold); margin-bottom: 0.5rem; }
  .sources-section ul { margin-left: 1.5rem; }
  
  footer {
    text-align: center;
    padding: 2rem;
    border-top: 1px solid var(--rf-line);
    margin-top: 3rem;
  }
  
  .loading { text-align: center; padding: 3rem; }
  .error { text-align: center; padding: 3rem; color: var(--rf-red); }
</style>
</head>
<body>
<nav>
  <a href="newsletter.html" class="nav-brand">
    <span class="brand-mark"><span>RF</span></span>
    <span class="brand-text">Rete Forlivese</span>
  </a>
  <a href="newsletter.html" class="back-link">← Torna alla home</a>
</nav>

<div class="container" id="articleContainer">
  <div class="loading">⏳ Caricamento articolo...</div>
</div>

<footer>
  <p>Rete Forlivese - Informazione partecipata e antifascista</p>
</footer>

<script>
  const BIN_ID = "69f3d0a936566621a80f357f";
  const API_KEY = "$2a$10$JWsV3hKpO6l.WAB//Gdnw.WMMlUmclCw5mT1gTzHJVsdef/p0swoO";
  
  function getArticleIdFromURL() {
    const params = new URLSearchParams(window.location.search);
    return parseInt(params.get('id'));
  }
  
  async function loadArticle() {
    const articleId = getArticleIdFromURL();
    if (!articleId) {
      document.getElementById('articleContainer').innerHTML = '<div class="error">❌ Articolo non specificato</div>';
      return;
    }
    
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 'X-Master-Key': API_KEY }
      });
      if (!res.ok) throw new Error('Errore caricamento');
      const data = await res.json();
      const articles = data.record.articles || [];
      const article = articles.find(a => a.id === articleId);
      
      if (!article) {
        document.getElementById('articleContainer').innerHTML = '<div class="error">❌ Articolo non trovato</div>';
        return;
      }
      
      renderArticle(article);
    } catch(e) {
      document.getElementById('articleContainer').innerHTML = `<div class="error">❌ Errore: ${e.message}</div>`;
    }
  }
  
  function renderArticle(article) {
    const container = document.getElementById('articleContainer');
    const verifiedBadge = article.verified ? '<span class="verified-badge">✅ Verificato RF</span>' : '';
    
    // Carosello HTML
    let carouselHtml = '';
    if (article.images && article.images.length > 0) {
      carouselHtml = `
        <div class="carousel" id="articleCarousel">
          <div class="carousel-inner" id="carouselInner"></div>
          <div class="carousel-controls">
            <button class="carousel-btn" id="prevBtn">◀</button>
            <button class="carousel-btn" id="nextBtn">▶</button>
          </div>
          <div class="carousel-dots" id="carouselDots"></div>
        </div>
      `;
    }
    
    // Fonti HTML
    let sourcesHtml = '';
    if (article.sources && article.sources.length > 0) {
      sourcesHtml = `
        <div class="sources-section">
          <h3>📚 Fonti e approfondimenti</h3>
          <ul>
            ${article.sources.map(s => `<li>${escapeHtml(s)}</li>`).join('')}
          </ul>
        </div>
      `;
    }
    
    container.innerHTML = `
      <div class="article-header">
        <span class="category-badge">${escapeHtml(article.category || 'ATTUALITÀ')}</span>${verifiedBadge}
        <h1>${escapeHtml(article.title)}</h1>
        <div class="article-meta">
          <span>📅 ${escapeHtml(article.date || 'Data non specificata')}</span>
          <span>✍️ ${escapeHtml(article.author || 'Redazione')}</span>
        </div>
      </div>
      ${carouselHtml}
      <div class="article-content">
        ${formatContent(article.fullContent || 'Contenuto non disponibile.')}
      </div>
      ${sourcesHtml}
    `;
    
    // Inizializza carosello se ci sono immagini
    if (article.images && article.images.length > 0) {
      initCarousel(article.images);
    }
  }
  
  function formatContent(text) {
    // Converti \n in <p> e <br>
    const paragraphs = text.split(/\n\s*\n/);
    return paragraphs.map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`).join('');
  }
  
  function initCarousel(images) {
    let currentIndex = 0;
    const inner = document.getElementById('carouselInner');
    const dotsContainer = document.getElementById('carouselDots');
    
    inner.innerHTML = '';
    dotsContainer.innerHTML = '';
    
    images.forEach((img, idx) => {
      const slide = document.createElement('div');
      slide.className = 'carousel-slide';
      if (idx === 0) slide.classList.add('active');
      slide.innerHTML = `
        <img src="${escapeHtml(img.url)}" alt="${escapeHtml(img.caption || 'Immagine')}" onerror="this.src='https://placehold.co/800x400/333/white?text=Immagine+non+disponibile'">
        <div class="carousel-caption">
          <p>${escapeHtml(img.caption || '')}</p>
          <small>${escapeHtml(img.credit || '')}</small>
        </div>
      `;
      inner.appendChild(slide);
      
      const dot = document.createElement('span');
      dot.className = 'dot';
      if (idx === 0) dot.classList.add('active');
      dot.addEventListener('click', () => showSlide(idx));
      dotsContainer.appendChild(dot);
    });
    
    function showSlide(index) {
      const slides = document.querySelectorAll('.carousel-slide');
      const dots = document.querySelectorAll('.dot');
      if (index < 0) index = slides.length - 1;
      if (index >= slides.length) index = 0;
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
      });
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
      currentIndex = index;
    }
    
    document.getElementById('prevBtn')?.addEventListener('click', () => showSlide(currentIndex - 1));
    document.getElementById('nextBtn')?.addEventListener('click', () => showSlide(currentIndex + 1));
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  loadArticle();
</script>
</body>
</html>
