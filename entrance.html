<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresso nell’Unione </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6;--surface:#fff;--ink:#101a33;--muted:#566079;--line:#dde2ec;--rail:#cfd6e3;--navy:#0f1f45;
  --done:#0e8a5f;--prog:#e09a00;--wait:#6f7fa0;--stop:#d03a3a;--onl:#fff;
  --head:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:Barlow,system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1226;--surface:#131d38;--ink:#e8ecf5;--muted:#a1abc2;--line:#26324f;--rail:#33415f;--navy:#070d1d;
  --done:#3fc7a0;--prog:#f0b429;--wait:#8e9bb7;--stop:#ef6b6b;--onl:#08111f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1226;--surface:#131d38;--ink:#e8ecf5;--muted:#a1abc2;--line:#26324f;--rail:#33415f;--navy:#070d1d;--done:#3fc7a0;--prog:#f0b429;--wait:#8e9bb7;--stop:#ef6b6b;--onl:#08111f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
.s-done{--c:var(--done);--on:var(--onl)}.s-prog{--c:var(--prog);--on:#1a1200}
.s-wait{--c:var(--wait);--on:var(--onl)}.s-stop{--c:var(--stop);--on:var(--onl)}.s-all{--c:var(--ink)}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}

/* testata */
.hero{background:var(--navy);color:#eaf0ff}
.hero::after{content:"";display:block;height:8px;background:linear-gradient(90deg,var(--done) 0 25%,var(--prog) 25% 50%,var(--wait) 50% 75%,var(--stop) 75%)}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;padding:14px 0;font-size:14px}
.bar nav{display:flex;gap:20px;flex-wrap:wrap}
.bar a{color:inherit;text-decoration:none;opacity:.8}.bar a:hover,.bar a:focus-visible{opacity:1;text-decoration:underline}
.fz{margin:34px 0 4px;font:600 22px/1.2 var(--head);color:#9fb4e8}
h1{margin:0;font:800 clamp(54px,10vw,112px)/.9 var(--head);letter-spacing:-.005em}
.lead{max-width:56ch;margin:18px 0 38px;color:#c3cfee;font-size:17px}

/* tabellone */
main{padding:34px 0 40px}
.bhead{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between;margin-bottom:8px}
h2{margin:0;font:800 34px/1 var(--head)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;font:500 15px var(--body);padding:7px 14px 7px 11px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;cursor:pointer}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.chip b{font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--c)}
button:focus-visible,.av:focus-within{outline:3px solid var(--prog);outline-offset:3px}
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 26px 20px}
.row,.hdr{display:grid;grid-template-columns:270px 1fr;column-gap:24px;align-items:center}
.hdr{padding-top:10px}
.hdr .trk{height:84px}
.stn{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:84px;text-align:center}
.stn b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font:600 15px var(--head)}
@media (prefers-color-scheme:dark){.stn b{background:var(--rail)}}
.stn .lbl{font-weight:600;font-size:14px;line-height:1.1}
.stn small{font-size:12px;color:var(--muted)}
.row{padding:20px 0 14px;border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:18px}
.av{position:relative;flex:none;width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--c);color:var(--on);display:grid;place-items:center;font:800 19px var(--head);cursor:pointer;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av input{position:absolute;inset:0;opacity:0;cursor:pointer}
h3{margin:0;font:800 23px/1.05 var(--head)}
.meta{display:flex;gap:10px;margin:4px 0 0;font-size:14px;color:var(--muted)}
.meta b{color:var(--c);font-weight:600}
.s-prog .meta b{color:var(--ink)}
.trk{position:relative;height:48px;margin:0 36px}
.line{position:absolute;left:0;right:0;top:50%;height:10px;transform:translateY(-50%);border-radius:5px;background:var(--rail)}
.fill{width:0;height:100%;border-radius:5px;background:var(--c);transition:width 1.3s cubic-bezier(.2,.7,.2,1)}
.s-wait .fill{background:repeating-linear-gradient(90deg,var(--c) 0 9px,transparent 9px 15px)}
.nd{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);background:var(--surface);border:4px solid var(--rail);z-index:1}
.nd.fin{width:30px;height:30px;border-width:5px}
.nd.on{background:var(--c);border-color:var(--c)}
.mk{position:absolute;top:50%;left:0;z-index:2;width:42px;height:42px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;background:var(--c);color:var(--on);border:3px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.25);font:800 16px var(--head);transition:left 1.3s cubic-bezier(.2,.7,.2,1)}
.row.go .fill{width:var(--w)}.row.go .mk{left:var(--w)}
.idle .mk{background:var(--surface);color:var(--muted);border-color:var(--rail)}
.s-stop .mk::after{content:"";position:absolute;left:calc(100% + 10px);top:-8px;width:6px;height:58px;border-radius:3px;background:var(--c)}
.note{grid-column:2;margin:0;padding:0 36px;font-size:14.5px;color:var(--muted)}
.note b{color:var(--ink);font-weight:600}
.empty{padding:26px 0 8px;color:var(--muted)}
.phases{list-style:none;margin:6px 0 0;padding:16px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:8px 20px;font-size:14px}
.phases li{display:flex;align-items:center;gap:10px}
.phases b{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font:600 14px var(--head)}
@media (prefers-color-scheme:dark){.phases b{background:var(--rail)}}
.cap{margin:12px 0 0;font-size:13px;color:var(--muted)}
footer{padding:0 0 44px;font-size:13px;color:var(--muted)}
@media (max-width:760px){
  .board{padding:4px 16px 16px}
  .row,.hdr{grid-template-columns:1fr;row-gap:6px}
  .hdr>div:first-child{display:none}
  .hdr .trk{height:56px}.stn .lbl{display:none}
  .note{grid-column:1;padding:0 22px}.trk{margin:0 22px}
  .phases{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){.fill,.mk{transition:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="bar">
      <span>Zentraler Exekutivrat der Union</span>
      <nav>
        <a href="https://ews-rose.vercel.app/">Portale unitario</a>
        <a href="https://ews-rose.vercel.app/archive.html">Archivio</a>
      </nav>
    </div>
    <p class="fz" id="fz"></p>
    <h1>Allargamento<br>dell’Unione</h1>
    <p class="lead">Sei fermate separano ogni parte candidata dall’adesione piena. Qui si vede a che punto della linea si trova ciascuna. Aggiornato al <span id="agg"></span>.</p>
  </div>
</header>

<main class="wrap">
  <section class="board" aria-labelledby="bt">
    <div class="bhead" style="margin-top:22px">
      <h2 id="bt">Linea d’ingresso</h2>
      <div class="filters" id="filters"></div>
    </div>
    <div class="hdr" id="hdr"></div>
    <div id="rows"></div>
    <ol class="phases" id="phases"></ol>
    <p class="cap"></p>
  </section>
</main>

<footer class="wrap">
</footer>

<script>
/* ======= DATI MODIFICABILI ======= */
const FAZIONE = "USSE";          // ← cambia qui
const AGGIORNATO = "2 novembre 2026";
const FASI = ["Domanda presentata","Esame preliminare","Verifica costituzionale","Voto in Congresso","Ratifica","Adesione completa"];
const BREVI = ["Domanda","Esame","Verifica","Voto","Ratifica","Adesione"];
// fase = fasi completate (0–6); stato: ammesso | corso | attesa | sospeso
// img (facoltativo) = immagine del candidato, es. img:"loghi/partito-a.png" (percorso o URL se la pagina è ospitata sul tuo Vercel)
const CANDIDATI = [
  {nome:"LanMaoGuo", fase:6, stato:"ammesso", nota:"Adesione formalizzata.",img:"https://raw.githubusercontent.com/RETEFORLIVESE/IMG/HEAD/CBALL/STATES/USSE/LANMAOGUO.png"},
  {nome:"BundestagHessex", fase:6, stato:"ammesso",   nota:"Adesione formalizzata.",img:"https://raw.githubusercontent.com/RETEFORLIVESE/IMG/HEAD/CBALL/STATES/USSE/BundestagHessex.png"},
  {nome:"Elike", fase:3, stato:"corso",   nota:"Voto in Congresso calendarizzato.",img:"https://raw.githubusercontent.com/RETEFORLIVESE/IMG/HEAD/CBALL/STATES/Elike.png"},
  {nome:"Yvrean", fase:2, stato:"corso",   nota:"Verifica costituzionale in svolgimento.",img:"https://raw.githubusercontent.com/RETEFORLIVESE/IMG/refs/heads/main/CBALL/STATES/YVREAN/YVREAN.ico"},
  {nome:"Braza", fase:1, stato:"attesa",  nota:"Esame preliminare non ancora avviato.",img:"https://raw.githubusercontent.com/RETEFORLIVESE/EWS/refs/heads/main/BHSH.png"},
  {nome:"Pasike", fase:2, stato:"sospeso", nota:"Procedura sospesa su richiesta del congresso.",img:"https://raw.githubusercontent.com/RETEFORLIVESE/IMG/refs/heads/main/CBALL/STATES/Pasike.png"}
];
/* ================================= */

const LB = {ammesso:"Ammesso",corso:"In corso",attesa:"In attesa",sospeso:"Sospeso"};
const PL = {ammesso:"Ammessi",corso:"In corso",attesa:"In attesa",sospeso:"Sospesi"};
const CL = {ammesso:"s-done",corso:"s-prog",attesa:"s-wait",sospeso:"s-stop",tutti:"s-all"};
const GL = {ammesso:"✓",corso:"▶",attesa:"…",sospeso:"II"};
const N = FASI.length;
const $ = id => document.getElementById(id);
const pct = c => Math.round(c.fase/N*100);
const pos = c => c.fase<1 ? 0 : (c.fase-1)/(N-1)*100;
const ini = n => n.split(/\s+/).map(w=>w[0]).slice(-2).join("").toUpperCase();
const av = (c,i) => `<label class="av" title="Clicca per cambiare immagine">${c.img?`<img src="${c.img}" alt="">`:`<span>${ini(c.nome)}</span>`}<input type="file" accept="image/*" data-i="${i}" aria-label="Cambia immagine di ${c.nome}"></label>`;

// immagini scelte nel browser
const CH = "cand-img";
function salvaImg(){try{const m={};CANDIDATI.forEach(c=>{if((c.img||"").startsWith("data:"))m[c.nome]=c.img});localStorage.setItem(CH,JSON.stringify(m));}catch(e){}}
try{const m=JSON.parse(localStorage.getItem(CH)||"{}");CANDIDATI.forEach(c=>{if(!c.img&&m[c.nome])c.img=m[c.nome]});}catch(e){}

$("fz").textContent = FAZIONE;
$("agg").textContent = AGGIORNATO;
document.title = "Ingresso nell’Unione – " + FAZIONE;

// intestazione con le fermate
$("hdr").innerHTML = `<div></div><div class="trk">${BREVI.map((b,k)=>`<div class="stn" style="left:${k/(N-1)*100}%"><b>${k+1}</b><span class="lbl">${b}</span><small title="Candidati che hanno superato questa fermata">${CANDIDATI.filter(c=>c.fase>k).length}</small></div>`).join("")}</div>`;
$("phases").innerHTML = FASI.map((f,k)=>`<li><b>${k+1}</b>${f}</li>`).join("");

// filtri
let filtro = "tutti", primo = true;
function chips(){
  const v = [["tutti","Tutte",CANDIDATI.length], ...Object.keys(LB).map(s=>[s,PL[s],CANDIDATI.filter(c=>c.stato===s).length])];
  $("filters").innerHTML = v.map(([k,l,n])=>`<button type="button" class="chip ${CL[k]}" data-k="${k}" aria-pressed="${k===filtro}"><i class="dot"></i>${l} <b>${n}</b></button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filtro=b.dataset.k;chips();righe();});
}

// righe
function righe(){
  const el = $("rows");
  el.innerHTML = CANDIDATI.filter(c=>filtro==="tutti"||c.stato===filtro).map(c=>{
    const i = CANDIDATI.indexOf(c);
    const prossima = c.fase===0 ? "Non avviata" : c.fase===N ? "Percorso concluso" : "Prossima fermata: "+FASI[c.fase];
    return `<article class="row ${CL[c.stato]}${c.fase===0?" idle":""}" role="group" aria-label="${c.nome}: ${c.fase} fasi su ${N}, ${LB[c.stato]}">
      <div class="who">${av(c,i)}<div><h3>${c.nome}</h3><p class="meta"><b>${LB[c.stato]}</b><span>${pct(c)}%</span></p></div></div>
      <div class="trk" style="--w:${pos(c)}%"><div class="line"><div class="fill"></div></div>${FASI.map((_,k)=>`<i class="nd${k<c.fase?" on":""}${k===N-1?" fin":""}" style="left:${k/(N-1)*100}%"></i>`).join("")}<span class="mk" aria-hidden="true">${c.fase===0?"–":GL[c.stato]}</span></div>
      <p class="note"><b>${prossima}.</b> ${c.nota}</p>
    </article>`;
  }).join("") || `<p class="empty">Nessuna candidatura in questo stato.</p>`;
  const vai = () => el.querySelectorAll(".row").forEach(r=>r.classList.add("go"));
  if(primo){ primo=false; requestAnimationFrame(()=>requestAnimationFrame(vai)); } else vai();
}

// cambio immagine
$("rows").addEventListener("change",e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const c = CANDIDATI[e.target.dataset.i], r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const k = document.createElement("canvas"), s = 96; k.width = k.height = s;
    const q = Math.max(s/im.width, s/im.height);
    k.getContext("2d").drawImage(im,(s-im.width*q)/2,(s-im.height*q)/2,im.width*q,im.height*q);
    c.img = k.toDataURL("image/jpeg",.85); salvaImg(); righe();
  }; im.src = r.result; };
  r.readAsDataURL(f);
});

chips(); righe();
</script>
</body>
</html>
