<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#043a96"><title>Estji ID · Pannello staff</title>
<style>
:root{--bg:#eaf0fb;--p:#fff;--ink:#0a1f44;--mute:#566684;--blue:#043a96;--blue2:#0a56d6;--line:#d3dcee;--ok:#0b7a4b;--bad:#b3261e;--gold:#b8921f;--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#050d20;--p:#0d1b3b;--ink:#e8eefc;--mute:#9aaccf;--blue:#6b97ff;--blue2:#8fb0ff;--line:#22365f;--ok:#4cd08f;--bad:#ff8a80;--gold:#e0b84a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#032a6e,#043a96 55%,#0a56d6);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 18px;border-bottom:3px solid var(--gold)}
header div{max-width:880px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:1.2rem}header a{color:#fff;font-size:.9rem}
main{max-width:880px;margin:0 auto;padding:16px 14px 48px}
.p{background:var(--p);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:1.05rem}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
button{padding:9px 14px;border:1px solid transparent;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer;min-height:40px}
@media(prefers-color-scheme:dark){button:not(.alt){color:#04112b}}
button:hover{background:var(--blue2)}button:disabled{opacity:.5;cursor:not-allowed}
button.alt{background:transparent;color:var(--blue);border-color:var(--blue)}button.alt:hover{background:color-mix(in srgb,var(--blue) 12%,transparent)}
button.bad{background:var(--bad);color:#fff}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tabs,.bar,.acts{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:12px}.bar{margin-bottom:12px}.bar input{flex:2 1 200px}.bar select{flex:1 1 140px}
.mute{color:var(--mute);font-size:.85rem}.m{margin:10px 0;padding:9px 12px;border-left:4px solid var(--blue);background:var(--bg);border-radius:6px;font-size:.9rem}.m.ok{border-color:var(--ok)}.m.bad{border-color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}.row b{font-size:1rem}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.75rem;font-weight:700;border:1px solid var(--line);margin-left:4px}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.st{color:var(--gold);border-color:var(--gold)}
.det{margin:6px 0 12px;padding:12px;border:1px solid var(--blue);border-radius:10px;background:var(--bg)}
.det h3{margin:14px 0 6px;font-size:.9rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px}.kv small{display:block;color:var(--mute);font-size:.75rem}.kv b{overflow-wrap:anywhere;font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.cards .p{margin:0;text-align:center}.cards b{display:block;font-size:1.6rem}
.mono{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--p);border:1px dashed var(--blue);padding:8px 10px;border-radius:8px;display:inline-block;user-select:all}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
[hidden]{display:none!important}
</style></head><body>
<header><div><h1>Estji ID · Pannello staff</h1><a href="id.html">← Torna a Estji ID</a></div></header>
<main id="app"><div class="p">Caricamento…</div></main>
<script>
var tok=null;try{tok=localStorage.getItem("estji_id_tok")}catch(e){}
var $=function(s,r){return(r||document).querySelector(s)},esc=function(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var S={tab:"id",q:"",filtro:"tutti",pag:0,lista:null,aperto:null,det:null,stat:null,reg:null,msg:null,temp:null};
function api(b){return fetch("/api/idx",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify(b)}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok){var e=new Error(d.error||"Errore "+r.status);e.status=r.status;throw e}return d})})}
function dt(t){var d=new Date(t),z=function(n){return("0"+n).slice(-2)};return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes())}
function msg(){return S.msg?'<div class="m '+S.msg[0]+'">'+esc(S.msg[1])+'</div>':""}
function negato(m){$("#app").innerHTML='<div class="p"><h2>Accesso non consentito</h2><p>'+esc(m)+'</p><p><a href="id.html">Accedi a Estji ID</a> con un account dello staff e riapri questa pagina.</p></div>'}
function fail(e){if(e.status===401||e.status===403)return negato(e.message);S.msg=["bad",e.message];draw()}
function azione(b,ok){S.msg=null;return api(b).then(function(d){if(ok)S.msg=["ok",ok(d)];return d}).catch(function(e){if(e.status===401)return negato(e.message);S.msg=["bad",e.message]})}

function carica(){return api({azione:"staff-lista",q:S.q,filtro:S.filtro,pagina:S.pag}).then(function(d){S.lista=d;draw()}).catch(fail)}
function apri(id){if(S.aperto===id){S.aperto=null;S.det=null;return draw()}S.aperto=id;S.det=null;S.temp=null;S.msg=null;draw();
  api({azione:"staff-dettaglio",id:id}).then(function(d){S.det=d.identita;draw()}).catch(fail)}
function rinfresca(){var id=S.aperto;return Promise.all([carica(),id?api({azione:"staff-dettaglio",id:id}).then(function(d){S.det=d.identita}):0]).then(draw).catch(fail)}

function tag(x){return(x.verificato?'<span class="tag ok">verificata</span>':'<span class="tag">da verificare</span>')+(x.sospeso?'<span class="tag bad">sospesa</span>':'')+(x.staff?'<span class="tag st">staff</span>':'')+(x.discordVerificato?'<span class="tag ok">Discord ✓</span>':'')}
function dettaglio(x){
  if(!x)return'<div class="det"><span class="mute">Caricamento…</span></div>';
  var D=[["id","Carta d\'Identità","emissioneId"],["fisc","Tessera fiscale","emissioneFisc"],["elet","Tessera elettorale","emissioneElet"]];
  var h='<div class="det"><div class="kv">'+[["Estji ID",x.id],["CUP",x.cup||"—"],["Nome in gioco",x.nick],["UUID",x.uuid||"—"],["Discord",(x.discord||"—")+(x.discordVerificato?" ✓":" (non verificato)")],["Discord ID",x.discordId||"—"],["Residenza",x.residenzaNome+(x.indirizzo?" · "+x.indirizzo:"")],["Delegazione",x.delegazione||"—"],["Iscritto",x.iscritto||"—"],["2FA",x.tf?"attiva":"no"]].map(function(k){return'<div><small>'+k[0]+'</small><b>'+esc(k[1])+'</b></div>'}).join("")+'</div>';
  if(x.sospeso)h+='<div class="m bad">Sospesa: '+esc(x.sospesoMotivo||"nessun motivo indicato")+'</div>';
  h+='<h3>Verifica e stato</h3><div class="acts"><button data-a="verifica" data-v="'+(x.verificato?0:1)+'">'+(x.verificato?"Rimuovi verifica":"Verifica identità")+'</button></div>';
  h+='<div class="acts" style="margin-top:8px"><input id="mot" placeholder="Motivo (per la sospensione)" maxlength="120" value="'+esc(x.sospesoMotivo||"")+'" style="flex:1 1 200px;width:auto"><button class="'+(x.sospeso?"alt":"bad")+'" data-a="sospendi" data-v="'+(x.sospeso?0:1)+'">'+(x.sospeso?"Riattiva":"Sospendi")+'</button></div>';
  h+='<h3>Ruoli e cariche</h3><div class="acts"><input id="ruo" value="'+esc((x.ruoli||[]).join(", "))+'" placeholder="es. Redattore Wiki, Delegato" style="flex:1 1 220px;width:auto"><button data-a="ruoli">Salva ruoli</button></div><p class="mute">Separati da virgola. "Staff" e "Generale" li assegna solo un super-amministratore.</p>';
  h+='<h3>Documenti</h3>'+D.map(function(d){var rev=x.revocati&&x.revocati[d[2]];return'<div class="row" style="cursor:default"><span><b>'+d[1]+'</b>'+(rev?' <span class="tag bad">revocato</span>':'')+'<br><span class="mute">emesso il '+esc(x[d[2]]||x.iscritto||"—")+'</span></span><span class="acts"><button class="alt" data-a="doc" data-d="'+d[0]+'" data-o="'+(rev?"ripristina":"revoca")+'">'+(rev?"Ripristina":"Revoca")+'</button><button class="alt" data-a="doc" data-d="'+d[0]+'" data-o="rinnova">Rinnova</button></span></div>'}).join("");
  h+='<h3>Sicurezza</h3><p class="mute">Sessioni attive: '+(x.sessioni.length?x.sessioni.map(function(s){return esc(s.etichetta)+" ("+esc(s.ip)+", "+dt(s.creata)+")"}).join("; "):"nessuna")+'</p><div class="acts"><button class="alt" data-a="sessioni">Chiudi tutte le sessioni</button><button class="alt" data-a="reset">Reimposta password</button></div>';
  if(S.temp)h+='<div class="m ok">Password temporanea (mostrata una sola volta, comunicala all\'utente e fagliela cambiare):<br><span class="mono">'+esc(S.temp)+'</span></div>';
  return h+'</div>'}
function vistaId(){
  var L=S.lista,h='<div class="bar"><input id="q" type="search" placeholder="Cerca nome, ID, Discord, CUP, residenza…" value="'+esc(S.q)+'"><select id="f">'+[["tutti","Tutte"],["non-verificati","Da verificare"],["sospesi","Sospese"],["staff","Staff"],["senza-discord","Senza Discord verificato"]].map(function(o){return'<option value="'+o[0]+'"'+(S.filtro===o[0]?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select></div>'+msg();
  if(!L)return h+'<div class="p">Caricamento…</div>';
  h+='<div class="p"><p class="mute" style="margin-top:0">'+L.totale+' identità</p>'+(L.righe.length?L.righe.map(function(x){return'<div><div class="row" data-open="'+esc(x.id)+'"><span><b>'+esc(x.nick)+'</b>'+tag(x)+'<br><span class="mute">'+esc(x.id)+' · '+esc(x.residenzaNome)+(x.ruoli.length?' · '+esc(x.ruoli.join(", ")):'')+'</span></span><span class="mute">'+(S.aperto===x.id?"▲":"▼")+'</span></div>'+(S.aperto===x.id?dettaglio(S.det):"")+'</div>'}).join(""):'<p class="mute">Nessun risultato.</p>');
  var np=Math.ceil(L.totale/L.perPagina);
  if(np>1)h+='<div class="acts" style="margin-top:10px"><button class="alt" data-pg="-1"'+(S.pag<=0?" disabled":"")+'>← Prec.</button><span class="mute" style="align-self:center">Pagina '+(S.pag+1)+' di '+np+'</span><button class="alt" data-pg="1"'+(S.pag>=np-1?" disabled":"")+'>Succ. →</button></div>';
  return h+'</div>'}
function vistaStat(){var s=S.stat;if(!s)return'<div class="p">Caricamento…</div>';
  return'<div class="cards">'+[["Identità",s.totale],["Verificate",s.verificate||s.verificati],["Da verificare",s.nonVerificati],["Sospese",s.sospesi],["Staff",s.staff],["Discord ✓",s.discordVerificato],["Con 2FA",s.conTf],["Nuove (7 g)",s.nuovi7g]].map(function(c){return'<div class="p"><b>'+c[1]+'</b><span class="mute">'+c[0]+'</span></div>'}).join("")+'</div><div class="p" style="margin-top:12px"><h2>Residenze più frequenti</h2><table>'+s.perResidenza.map(function(r){return'<tr><td>'+esc(r[0])+'</td><td><b>'+r[1]+'</b></td></tr>'}).join("")+'</table></div>'}
function vistaReg(){var r=S.reg;if(!r)return'<div class="p">Caricamento…</div>';
  return'<div class="p"><h2>Registro delle azioni staff</h2>'+(r.length?'<table><tr><th>Quando</th><th>Chi</th><th>Azione</th><th>Su</th><th>Dettaglio</th></tr>'+r.map(function(v){return'<tr><td>'+dt(v.t)+'</td><td>'+esc(v.da)+'</td><td>'+esc(String(v.azione).replace("staff-",""))+'</td><td>'+esc(v.id)+'</td><td>'+esc(v.dettaglio)+'</td></tr>'}).join("")+'</table>':'<p class="mute">Ancora nessuna azione registrata.</p>')+'<p class="mute">Ultime 100 azioni. Ogni modifica compare anche nei commit di ide.json.</p></div>'}
function draw(){
  var h='<div class="tabs">'+[["id","Identità"],["stat","Statistiche"],["reg","Registro"]].map(function(t){return'<button class="'+(S.tab===t[0]?"":"alt")+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</div>';
  h+=S.tab==="id"?vistaId():S.tab==="stat"?msg()+vistaStat():msg()+vistaReg();
  var fq=document.activeElement&&document.activeElement.id==="q",pos=fq?document.activeElement.selectionStart:0;
  $("#app").innerHTML=h;if(fq){var q=$("#q");q.focus();q.setSelectionRange(pos,pos)}}
function tab(t){S.tab=t;S.msg=null;draw();
  if(t==="stat")api({azione:"staff-statistiche"}).then(function(d){S.stat=d;draw()}).catch(fail);
  if(t==="reg")api({azione:"staff-registro"}).then(function(d){S.reg=d.voci;draw()}).catch(fail)}

var tm=null;
document.addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;S.pag=0;clearTimeout(tm);tm=setTimeout(carica,300)}});
document.addEventListener("change",function(e){if(e.target.id==="f"){S.filtro=e.target.value;S.pag=0;carica()}});
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab],[data-open],[data-pg],[data-a]");if(!t)return;
  if(t.dataset.tab)return tab(t.dataset.tab);
  if(t.dataset.open)return apri(t.dataset.open);
  if(t.dataset.pg){S.pag+=+t.dataset.pg;S.aperto=null;S.det=null;return carica()}
  var a=t.dataset.a,id=S.aperto,x=S.det;if(!id||!x)return;var go=function(b,ok){return azione(Object.assign({id:id},b),ok).then(rinfresca)};
  if(a==="verifica")go({azione:"staff-verifica",valore:t.dataset.v==="1"},function(){return t.dataset.v==="1"?"Identità verificata.":"Verifica rimossa."});
  else if(a==="sospendi"){var sosp=t.dataset.v==="1";if(sosp&&!confirm("Sospendere "+x.nick+"? Verrà disconnesso e non potrà più accedere."))return;
    go({azione:"staff-sospendi",valore:sosp,motivo:$("#mot").value},function(){return sosp?"Identità sospesa.":"Identità riattivata."})}
  else if(a==="ruoli")go({azione:"staff-ruoli",ruoli:$("#ruo").value.split(",").map(function(r){return r.trim()}).filter(Boolean)},function(){return"Ruoli aggiornati."});
  else if(a==="doc"){var o=t.dataset.o;if(o==="revoca"&&!confirm("Revocare il documento? L\'utente non potrà rinnovarlo."))return;
    go({azione:"staff-documento",documento:t.dataset.d,op:o},function(){return"Documento: "+o+" eseguito."})}
  else if(a==="sessioni"){if(!confirm("Chiudere tutte le sessioni di "+x.nick+"?"))return;go({azione:"staff-revoca-sessioni"},function(d){return d.chiuse+" sessioni chiuse."})}
  else if(a==="reset"){if(!confirm("Reimpostare la password di "+x.nick+"? Le sue sessioni verranno chiuse."))return;
    azione({azione:"staff-reset-password",id:id},function(){return"Password reimpostata."}).then(function(d){if(d&&d.password)S.temp=d.password;rinfresca()})}
});
if(!tok)negato("Non hai effettuato l\'accesso.");else carica();
</script></body></html>
