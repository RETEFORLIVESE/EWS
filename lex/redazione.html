<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redazione atti — Fazione</title>
  <meta name="description" content="Area di redazione per creare e modificare gli atti normativi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="apple-touch-icon" href="NormAktiv.png">
  <link rel="icon" type="image/png" href="NormAktiv.png">

  <style>
    /* ---- UI di login (integrazione con lo stile del sito) ---- */
    .login-wrap {
      max-width: 420px;
      margin: 60px auto 80px;
      padding: 2rem 2rem 1.6rem;
      background: #12141a;
      border: 1px solid #2a2e38;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .login-wrap h2 {
      margin: 0 0 0.3rem;
      font-family: var(--font-chrome, "Titillium Web", sans-serif);
      letter-spacing: 0.04em;
      font-size: 1.35rem;
    }
    .login-wrap p.sottotitolo {
      margin: 0 0 1.2rem;
      color: var(--inchiostro-tenue, #9aa0ac);
      font-size: 0.85rem;
    }
    .login-wrap label {
      display: block;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--inchiostro-tenue, #9aa0ac);
      margin-bottom: 0.25rem;
    }
    .login-wrap input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      margin-bottom: 0.9rem;
      background: #1b1e26;
      border: 1px solid #2f3440;
      color: #eee;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .login-wrap input:focus {
      outline: none;
      border-color: #c83b2f;
      box-shadow: 0 0 0 2px rgba(200,59,47,0.2);
    }
    .login-wrap button {
      width: 100%;
      padding: 0.75rem;
      background: #c83b2f;
      border: none;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .login-wrap button:hover:not(:disabled) { opacity: 0.92; }
    .login-wrap button:active:not(:disabled) { transform: translateY(1px); }
    .login-wrap button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .login-error {
      color: #ff8a7a;
      font-size: 0.85rem;
      min-height: 1.2em;
      margin: 0.6rem 0 0;
      text-align: center;
    }

    /* ---- Barra di stato quando l'admin è loggato ---- */
    .admin-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin: 1.2rem 0 0.5rem;
      padding: 0.7rem 1rem;
      background: rgba(200,59,47,0.08);
      border-left: 3px solid #c83b2f;
      border-radius: 4px;
      font-size: 0.88rem;
      color: var(--inchiostro-tenue, #9aa0ac);
    }
    .admin-topbar strong { color: #eee; }
    .admin-topbar button {
      background: transparent;
      border: 1px solid #444;
      color: #ccc;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      transition: all 0.15s ease;
    }
    .admin-topbar button:hover {
      border-color: #c83b2f;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="testata-root"></div>

  <main class="container">

    <!-- ============================================================
         AREA DI LOGIN (visibile solo se non autenticato)
         ============================================================ -->
    <div id="login-area" style="display:none;">
      <div class="login-wrap">
        <h2>🔐 Accesso redazione</h2>
        <p class="sottotitolo">Inserisci le credenziali per modificare gli atti.</p>

        <label for="adminUsername">Nome utente</label>
        <input type="text" id="adminUsername" placeholder="es. redazione"
               autocomplete="username" autocapitalize="off" spellcheck="false" />

        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="••••••••"
               autocomplete="current-password" />

        <button id="loginBtn" type="button">Accedi</button>

        <p class="login-error" id="loginError"></p>
      </div>
    </div>

    <!-- ============================================================
         AREA REDAZIONE (visibile solo se autenticato)
         ============================================================ -->
    <div id="admin-content" style="display:none;">
      <div class="admin-topbar">
        <span>👤 Connesso come <strong id="adminUsernameLabel">—</strong></span>
        <button id="logoutBtn" type="button">Esci</button>
      </div>
      <div id="redazione-root"></div>
    </div>

  </main>

  <div id="footer-root"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/redazione.js"></script>
</body>
</html>
