<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redazione atti — Fazione</title>
  <meta name="description" content="Area di redazione per creare e modificare gli atti normativi, salvataggio diretto su database online." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="apple-touch-icon" href="NormAktiv.png">
  <link rel="icon" type="image/png" href="NormAktiv.png">
  <style>
/* ==== (stesso CSS inlinato di index.html, con in più la regola per input[type="password"] già inclusa sopra) ==== */
:root{--blu-900:#0b1f38;--blu-800:#0b3d6e;--blu-700:#12508c;--blu-600:#1b5fa8;--blu-accento:#2e77c9;--verde:#008c45;--bianco:#f6f7f2;--rosso:#cd212a;--carta:#f5f9fd;--carta-scura:#e7f1fa;--carta-scura-mid:#cfe3f5;--inchiostro:#1f2a33;--inchiostro-tenue:#4b5866;--bordo:#d6e2ed;--oro:#c9a227;--radius:4px;--ombra:0 2px 10px rgba(11,61,110,.08);--ombra-hover:0 10px 28px rgba(11,61,110,.12);--font-chrome:"Titillium Web","Segoe UI",sans-serif;--font-testo:"Source Serif 4","PT Serif",Georgia,serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--carta);color:var(--inchiostro);font-family:var(--font-testo);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--blu-700);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}img,svg{max-width:100%}
.container{width:100%;max-width:1180px;margin:0 auto;padding:0 24px}
.striscia-top{background:var(--blu-900);color:rgba(255,255,255,.82);font-family:var(--font-chrome);font-size:.78rem;letter-spacing:.01em;padding:6px 0}
.striscia-top .container{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.striscia-top a{color:rgba(255,255,255,.82);margin-left:18px}.striscia-top a:hover{color:#fff}
.testata{background:linear-gradient(180deg,var(--blu-700) 0%,var(--blu-800) 100%);color:#eef3f8;padding:24px 0 28px}
.testata__riga{display:flex;align-items:center;gap:20px}
.testata__emblema{flex:none;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 28%,var(--blu-accento),var(--blu-800) 72%);border:2px solid rgba(238,243,248,.35);display:flex;align-items:center;justify-content:center;font-family:var(--font-chrome);font-weight:700;font-size:1.25rem;letter-spacing:.02em;box-shadow:inset 0 0 0 2px rgba(7,28,51,.35),0 0 8px rgba(255,255,255,.55),0 0 22px rgba(46,119,201,.55)}
.testata__testi{min-width:0}
.testata__eyebrow{font-family:var(--font-chrome);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#a9c2db;margin:0 0 4px}
.testata__nome{font-family:var(--font-chrome);font-weight:700;font-size:1.55rem;margin:0;color:#fff;letter-spacing:.01em}
.testata__motto{font-family:var(--font-testo);font-style:italic;color:#c3d4e3;margin:4px 0 0;font-size:.95rem}
.fascia-tricolore{height:7px;display:flex}.fascia-tricolore span{flex:1 1 0}.fascia-tricolore .verde{background:var(--verde)}.fascia-tricolore .bianco{background:var(--bianco)}.fascia-tricolore .rosso{background:var(--rosso)}
.nav-principale{background:#fff;border-bottom:3px solid var(--blu-700);position:sticky;top:0;z-index:100;box-shadow:0 2px 10px rgba(11,61,110,.08)}
.nav-principale ul{list-style:none;display:flex;flex-wrap:wrap;gap:2px;margin:0;padding:0}
.nav-principale a{display:block;font-family:var(--font-chrome);font-size:.92rem;font-weight:600;color:var(--blu-800);text-decoration:none;padding:15px 18px;border-bottom:3px solid transparent;transition:background-color .15s ease,border-color .15s ease}
.nav-principale a:hover{background:var(--carta-scura);border-bottom-color:var(--blu-accento)}
.nav-principale a.attiva{border-bottom-color:var(--oro);color:var(--blu-900)}
main{padding:40px 0 64px}
footer{background:var(--blu-900);color:#b9c8d6;padding:34px 0 22px;margin-top:40px;border-top:3px solid var(--oro)}
footer .fascia-tricolore{margin-bottom:0}
.footer__contenuto{padding-top:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--font-chrome);font-size:.82rem}
.footer__contenuto a{color:#d7e3ee}
.breadcrumb{font-family:var(--font-chrome);font-size:.8rem;color:var(--inchiostro-tenue);margin:18px 0 22px}.breadcrumb a{color:var(--blu-700)}
.badge-categoria{display:inline-block;font-family:var(--font-chrome);font-size:.68rem;font-weight:700;letter-spacing:.03em;color:var(--blu-800);background:var(--carta-scura-mid);border-radius:999px;padding:3px 10px}
.redazione-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0 32px}
.redazione-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:1px solid var(--bordo);border-radius:var(--radius);box-shadow:var(--ombra);padding:20px;cursor:pointer;font-family:var(--font-chrome);transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease}
.redazione-card:hover{border-color:var(--blu-accento);box-shadow:var(--ombra-hover);transform:translateY(-2px)}
.redazione-card__numero{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--blu-700);color:#fff;font-weight:700;font-size:.85rem}
.redazione-card__titolo{font-weight:700;color:var(--inchiostro);font-size:1.05rem}
.redazione-card__desc{color:var(--inchiostro-tenue);font-size:.85rem;font-family:var(--font-testo)}
.redazione-riquadro{background:var(--carta-scura);border-left:4px solid var(--oro);border-radius:var(--radius);padding:16px 20px;margin:20px 0;font-size:.92rem}
.redazione-riquadro code{background:rgba(11,61,110,.08);padding:1px 5px;border-radius:3px}
.redazione-riga{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border:1px solid var(--bordo);border-radius:var(--radius);padding:14px 18px;margin-bottom:10px}
.redazione-riga__titolo{font-weight:600;margin:4px 0 2px}
.redazione-riga__meta{font-family:var(--font-chrome);font-size:.8rem;color:var(--inchiostro-tenue);margin:0}
.redazione-riga__azioni{display:flex;gap:8px;flex-shrink:0}
.redazione-form{max-width:760px}
.redazione-campo{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.redazione-campo label{font-family:var(--font-chrome);font-size:.8rem;font-weight:600;color:var(--inchiostro-tenue);text-transform:uppercase;letter-spacing:.02em}
.redazione-riga-campi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.redazione-form input[type="text"],.redazione-form input[type="password"],.redazione-form select,.redazione-form textarea{font-family:var(--font-testo);font-size:.95rem;padding:9px 12px;border:1px solid var(--bordo);border-radius:var(--radius);background:#fff;color:var(--inchiostro);width:100%}
.redazione-form textarea{resize:vertical}
.redazione-form input:focus,.redazione-form select:focus,.redazione-form textarea:focus{outline:none;border-color:var(--blu-accento);box-shadow:0 0 0 3px rgba(46,119,201,.18)}
.redazione-articolo{border:1px solid var(--bordo);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;background:var(--carta);display:flex;flex-direction:column;gap:8px}
.redazione-articolo__intestazione{display:flex;align-items:center;gap:8px;font-family:var(--font-chrome);font-size:.8rem;font-weight:700;text-transform:uppercase;color:var(--inchiostro-tenue)}
.redazione-messaggio{background:#e3f3e6;color:#1c7a34;border-radius:var(--radius);padding:10px 14px;font-family:var(--font-chrome);font-size:.85rem}
.redazione-azioni-form{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid var(--bordo)}
.redazione-btn{font-family:var(--font-chrome);font-weight:600;font-size:.85rem;border:none;border-radius:var(--radius);padding:10px 18px;cursor:pointer;transition:opacity .15s ease}
.redazione-btn:hover{opacity:.88}
.redazione-btn--primario{background:var(--blu-700);color:#fff}
.redazione-btn--secondario{background:var(--carta-scura);color:var(--inchiostro);border:1px solid var(--bordo)}
.redazione-btn--pericolo{background:#fdeceb;color:var(--rosso);border:1px solid rgba(205,33,42,.25)}
.redazione-btn--piccolo{padding:6px 12px;font-size:.78rem}
@media(max-width:720px){.redazione-menu{grid-template-columns:1fr}.redazione-riga{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>

  <div id="testata-root"></div>

  <main class="container" id="redazione-root"></main>

  <div id="footer-root"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SITE_CONFIG = {
  nomeFazione: "Fazione di Eldoria",
  siglaFazione: "F.E.",
  emblema: "FE",
  motto: "Unità, Territorio, Ordine",
  annoFondazione: "2024",
  discord: "",
  sitoServer: "",
};
</script>

<script>
/* ============================================================
   LAYOUT
   ============================================================ */
function renderTestata(paginaAttiva) {
  const el = document.getElementById("testata-root");
  if (!el) return;
  el.innerHTML = `
    <div class="striscia-top">
      <div class="container">
        <span>${SITE_CONFIG.nomeFazione} &middot; Raccolta ufficiale degli atti normativi</span>
        <span>
          <a href="redazione.html">Area redazione</a>${SITE_CONFIG.discord ? `<a href="${SITE_CONFIG.discord}" target="_blank" rel="noopener">Discord</a>` : ""}
        </span>
      </div>
    </div>
    <header class="testata">
      <div class="container testata__riga">
        <div class="testata__emblema" aria-hidden="true">${SITE_CONFIG.emblema}</div>
        <div class="testata__testi">
          <p class="testata__eyebrow">Raccolta ufficiale degli atti normativi</p>
          <h2 class="testata__nome">${SITE_CONFIG.nomeFazione}</h2>
          <p class="testata__motto">${SITE_CONFIG.motto}</p>
        </div>
      </div>
    </header>
    <div class="fascia-tricolore" role="presentation">
      <span class="verde"></span><span class="bianco"></span><span class="rosso"></span>
    </div>
    <nav class="nav-principale" aria-label="Navigazione principale">
      <div class="container">
        <ul>
          <li><a href="index.html" class="${paginaAttiva === "home" ? "attiva" : ""}">Home</a></li>
          <li><a href="index.html?categoria=Statuto%20Costituzionale" class="${paginaAttiva === "statuto" ? "attiva" : ""}">Statuto</a></li>
          <li><a href="index.html?categoria=Regolamento" class="${paginaAttiva === "regolamenti" ? "attiva" : ""}">Regolamenti</a></li>
          <li><a href="index.html?categoria=Codice" class="${paginaAttiva === "codici" ? "attiva" : ""}">Codici</a></li>
          <li><a href="redazione.html" class="${paginaAttiva === "redazione" ? "attiva" : ""}">Redazione</a></li>
        </ul>
      </div>
    </nav>
  `;
}

function renderFooter() {
  const el = document.getElementById("footer-root");
  if (!el) return;
  const linkExtra = [];
  if (SITE_CONFIG.discord) linkExtra.push(`<a href="${SITE_CONFIG.discord}" target="_blank" rel="noopener">Discord</a>`);
  if (SITE_CONFIG.sitoServer) linkExtra.push(`<a href="${SITE_CONFIG.sitoServer}" target="_blank" rel="noopener">Sito del server</a>`);
  el.innerHTML = `
    <div class="fascia-tricolore" role="presentation">
      <span class="verde"></span><span class="bianco"></span><span class="rosso"></span>
    </div>
    <footer>
      <div class="container footer__contenuto">
        <span>&copy; ${SITE_CONFIG.annoFondazione}&ndash;${new Date().getFullYear()} ${SITE_CONFIG.nomeFazione}. Raccolta amministrata a fini interni, senza valore legale reale.</span>
        <span>${linkExtra.join(" &middot; ")}</span>
      </div>
    </footer>
  `;
}
</script>

<script>
/* ============================================================
   REDAZIONE (ex redazione.js) — login + salvataggio su JSONBin
   Endpoint attesi:
     POST /api/login  -> { success:true, token:{ binId, apiKey } }
     GET  https://api.jsonbin.io/v3/b/{binId}/latest
     PUT  https://api.jsonbin.io/v3/b/{binId}   body: { articles:[...] }
   ============================================================ */
(function () {
  const state = {
    binId: "",
    apiKey: "",
    user: "",
    atti: [],
    vista: "login",
    idInModifica: null,
    articoliCorrenti: [],
  };

  /* ---------- API ---------- */
  async function apiLogin(username, password) {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || 'Credenziali errate');
    state.binId = data.token.binId;
    state.apiKey = data.token.apiKey;
    state.user = username;
  }

  async function apiCaricaAtti() {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${state.binId}/latest`, {
      headers: { 'X-Master-Key': state.apiKey }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.atti = (data.record && data.record.articles) || [];
  }

  async function apiSalvaAtti() {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${state.binId}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': state.apiKey
      },
      body: JSON.stringify({ articles: state.atti })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
  }

  /* ---------- Utility ---------- */
  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function slugify(testo) {
    return (testo || "").toString().toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
  }
  function idUnivoco(base, idDaEscludere) {
    let candidato = base || "atto";
    let n = 2;
    while (state.atti.some(a => a.id === candidato && a.id !== idDaEscludere)) {
      candidato = `${base}-${n}`; n++;
    }
    return candidato;
  }
  function categorieDisponibili() {
    const set = new Set(state.atti.map(a => a.categoria).filter(Boolean));
    ["Statuto Costituzionale", "Regolamento", "Codice", "Editto", "Decreto"].forEach(c => set.add(c));
    return Array.from(set);
  }
  function showMsg(msg) {
    const el = document.getElementById("redazione-messaggio");
    if (el) { el.textContent = msg; el.style.display = msg ? "block" : "none"; }
  }

  /* ---------- Render ---------- */
  function renderLogin() {
    return `
      <p class="breadcrumb"><a href="index.html">Home</a> &rsaquo; Redazione</p>
      <h1>Area di redazione</h1>
      <div class="redazione-riquadro" style="max-width:500px;">
        <h3 style="margin-top:0;">&#128274; Accesso riservato</h3>
        <form id="login-form" class="redazione-form" novalidate>
          <div class="redazione-campo">
            <label for="login-user">Nome utente</label>
            <input type="text" id="login-user" required autocomplete="username">
          </div>
          <div class="redazione-campo">
            <label for="login-pass">Password</label>
            <input type="password" id="login-pass" required autocomplete="current-password">
          </div>
          <p id="login-error" style="color:var(--rosso); display:none;"></p>
          <div class="redazione-azioni-form">
            <button type="submit" class="redazione-btn redazione-btn--primario">Accedi</button>
          </div>
        </form>
      </div>
    `;
  }

  function renderMenu() {
    const n = state.atti.length;
    return `
      <p class="breadcrumb"><a href="index.html">Home</a> &rsaquo; Redazione</p>
      <h1 style="margin-bottom:4px;">Redazione degli atti</h1>
      <p style="color:var(--inchiostro-tenue); max-width:60ch; margin-top:0;">
        Crea o modifica gli atti compilando un semplice modulo. Le modifiche vengono salvate direttamente nel database online.
      </p>
      <p style="font-family:var(--font-chrome); font-size:0.85rem; color:var(--inchiostro-tenue);">
        Accesso come <strong>${escapeHtml(state.user)}</strong> &middot; ${n} atti in archivio
      </p>

      <div class="redazione-menu">
        <button type="button" class="redazione-card" data-azione="nuovo">
          <span class="redazione-card__numero">1</span>
          <span class="redazione-card__titolo">Crea nuovo atto</span>
          <span class="redazione-card__desc">Apri un modulo vuoto per scrivere un atto da zero.</span>
        </button>
        <button type="button" class="redazione-card" data-azione="carica">
          <span class="redazione-card__numero">2</span>
          <span class="redazione-card__titolo">Carica atto esistente</span>
          <span class="redazione-card__desc">Scegli un atto gi&agrave; presente e modificane il contenuto.</span>
        </button>
        <button type="button" class="redazione-card" data-azione="logout">
          <span class="redazione-card__numero">3</span>
          <span class="redazione-card__titolo">Esci</span>
          <span class="redazione-card__desc">Termina la sessione di redazione.</span>
        </button>
      </div>
    `;
  }

  function renderCarica() {
    const lavoro = [...state.atti].sort((a, b) => (a.titolo || "").localeCompare(b.titolo || ""));
    const righe = lavoro.map(a => `
      <div class="redazione-riga" data-id="${escapeHtml(a.id)}">
        <div>
          <span class="badge-categoria">${escapeHtml(a.categoria)}</span>
          <p class="redazione-riga__titolo">${escapeHtml(a.titolo)}</p>
          <p class="redazione-riga__meta">n. ${escapeHtml(a.numero)}/${escapeHtml(a.anno)} &middot; ${(a.articoli || []).length} articoli</p>
        </div>
        <div class="redazione-riga__azioni">
          <button type="button" class="redazione-btn redazione-btn--piccolo" data-modifica="${escapeHtml(a.id)}">Modifica</button>
          <button type="button" class="redazione-btn redazione-btn--piccolo redazione-btn--pericolo" data-elimina="${escapeHtml(a.id)}">Elimina</button>
        </div>
      </div>`).join("");

    return `
      <p class="breadcrumb"><a href="index.html">Home</a> &rsaquo; <a href="redazione.html">Redazione</a> &rsaquo; Carica atto esistente</p>
      <h1>Carica atto esistente</h1>
      <input type="text" id="redazione-filtro" placeholder="Filtra per titolo o categoria&hellip;" style="width:100%; max-width:420px; padding:10px 14px; border:1px solid var(--bordo); border-radius:var(--radius); font-family:var(--font-chrome); margin-bottom:16px;" />
      <div id="redazione-elenco-carica">${righe || "<p>Nessun atto presente.</p>"}</div>
      <p style="margin-top:20px;"><button type="button" class="redazione-btn redazione-btn--secondario" data-azione="menu">&larr; Torna al menu</button></p>
    `;
  }

  function nuovoArticoloVuoto(numero) {
    return { numero: numero, rubrica: "", testo: "" };
  }

  function renderRigaArticolo(art, indice) {
    return `
      <div class="redazione-articolo" data-indice="${indice}">
        <div class="redazione-articolo__intestazione">
          <span>Articolo</span>
          <input type="text" class="redazione-art-numero" value="${escapeHtml(art.numero)}" style="width:70px;" />
          <button type="button" class="redazione-btn redazione-btn--piccolo redazione-btn--pericolo" data-rimuovi-articolo="${indice}" style="margin-left:auto;">Rimuovi</button>
        </div>
        <input type="text" class="redazione-art-rubrica" placeholder="Rubrica dell'articolo" value="${escapeHtml(art.rubrica)}" />
        <textarea class="redazione-art-testo" placeholder="Testo dell'articolo" rows="4">${escapeHtml(art.testo)}</textarea>
      </div>`;
  }

  function renderEditor(atto) {
    state.idInModifica = atto ? atto.id : null;
    state.articoliCorrenti = atto ? (atto.articoli || []).map(a => ({ ...a })) : [nuovoArticoloVuoto(1)];
    const cat = atto ? atto.categoria : "";
    const opzioniCategoria = categorieDisponibili().map(c =>
      `<option value="${escapeHtml(c)}" ${c === cat ? "selected" : ""}>${escapeHtml(c)}</option>`
    ).join("");

    return `
      <p class="breadcrumb"><a href="index.html">Home</a> &rsaquo; <a href="redazione.html">Redazione</a> &rsaquo; ${atto ? "Modifica atto" : "Nuovo atto"}</p>
      <h1>${atto ? "Modifica atto" : "Nuovo atto"}</h1>
      <p id="redazione-messaggio" class="redazione-messaggio" style="display:none;"></p>

      <form id="redazione-form" class="redazione-form" novalidate>
        <div class="redazione-campo">
          <label for="f-titolo">Titolo</label>
          <input type="text" id="f-titolo" required value="${atto ? escapeHtml(atto.titolo) : ""}" />
        </div>
        <div class="redazione-riga-campi">
          <div class="redazione-campo">
            <label for="f-categoria">Categoria</label>
            <select id="f-categoria">${opzioniCategoria}</select>
          </div>
          <div class="redazione-campo">
            <label for="f-categoria-nuova">Oppure nuova categoria</label>
            <input type="text" id="f-categoria-nuova" placeholder="Lascia vuoto per usare quella scelta sopra" />
          </div>
        </div>
        <div class="redazione-riga-campi">
          <div class="redazione-campo"><label for="f-numero">Numero</label><input type="text" id="f-numero" value="${atto ? escapeHtml(atto.numero) : ""}" /></div>
          <div class="redazione-campo"><label for="f-anno">Anno</label><input type="text" id="f-anno" value="${atto ? escapeHtml(atto.anno) : new Date().getFullYear()}" /></div>
          <div class="redazione-campo"><label for="f-stato">Stato</label>
            <select id="f-stato">
              <option value="vigente" ${!atto || atto.stato === "vigente" ? "selected" : ""}>vigente</option>
              <option value="abrogato" ${atto && atto.stato === "abrogato" ? "selected" : ""}>abrogato</option>
            </select>
          </div>
        </div>
        <div class="redazione-riga-campi">
          <div class="redazione-campo"><label for="f-data">Data di emanazione</label><input type="text" id="f-data" placeholder="es. 12 agosto 2024" value="${atto ? escapeHtml(atto.dataEmanazione) : ""}" /></div>
          <div class="redazione-campo"><label for="f-promulgato">Promulgato da</label><input type="text" id="f-promulgato" value="${atto ? escapeHtml(atto.promulgatoDa) : ""}" /></div>
        </div>
        <div class="redazione-campo">
          <label for="f-sommario">Sommario (mostrato nell'elenco)</label>
          <textarea id="f-sommario" rows="2">${atto ? escapeHtml(atto.sommario) : ""}</textarea>
        </div>
        <div class="redazione-campo">
          <label for="f-id">Identificativo URL (id)</label>
          <input type="text" id="f-id" value="${atto ? escapeHtml(atto.id) : ""}" placeholder="generato automaticamente dal titolo se lasciato vuoto" />
        </div>

        <h3>Articoli</h3>
        <div id="redazione-articoli">
          ${state.articoliCorrenti.map((a, i) => renderRigaArticolo(a, i)).join("")}
        </div>
        <button type="button" class="redazione-btn redazione-btn--secondario" id="redazione-aggiungi-articolo">+ Aggiungi articolo</button>

        <div class="redazione-azioni-form">
          <button type="submit" class="redazione-btn redazione-btn--primario">&#128190; Salva nel database</button>
          <button type="button" class="redazione-btn redazione-btn--secondario" data-azione="menu">Annulla</button>
          ${atto ? `<button type="button" class="redazione-btn redazione-btn--pericolo" id="redazione-elimina-corrente">Elimina questo atto</button>` : ""}
        </div>
      </form>
    `;
  }

  /* ---------- Raccolta dati dal form ---------- */
  function leggiArticoliDalForm() {
    return Array.from(document.querySelectorAll("#redazione-articoli .redazione-articolo")).map(el => ({
      numero: el.querySelector(".redazione-art-numero").value.trim() || "1",
      rubrica: el.querySelector(".redazione-art-rubrica").value.trim(),
      testo: el.querySelector(".redazione-art-testo").value.trim(),
    }));
  }

  function raccogliAtto() {
    const titolo = document.getElementById("f-titolo").value.trim();
    const categoriaNuova = document.getElementById("f-categoria-nuova").value.trim();
    const categoria = categoriaNuova || document.getElementById("f-categoria").value;
    const idCampo = document.getElementById("f-id").value.trim();
    const idBase = slugify(idCampo || titolo);
    const id = idUnivoco(idBase, state.idInModifica);

    return {
      id,
      categoria,
      numero: document.getElementById("f-numero").value.trim(),
      anno: document.getElementById("f-anno").value.trim(),
      titolo,
      dataEmanazione: document.getElementById("f-data").value.trim(),
      promulgatoDa: document.getElementById("f-promulgato").value.trim(),
      stato: document.getElementById("f-stato").value,
      sommario: document.getElementById("f-sommario").value.trim(),
      articoli: leggiArticoliDalForm(),
    };
  }

  /* ---------- Salvataggio / eliminazione ---------- */
  async function salvaAtto(atto) {
    if (state.idInModifica) {
      const idx = state.atti.findIndex(a => a.id === state.idInModifica);
      if (idx !== -1) state.atti[idx] = atto;
      else state.atti.push(atto);
    } else {
      state.atti.push(atto);
    }
    await apiSalvaAtti();
  }

  async function eliminaAtto(id) {
    state.atti = state.atti.filter(a => a.id !== id);
    await apiSalvaAtti();
  }

  /* ---------- Router ---------- */
  function vai(vista, extra) {
    state.vista = vista;
    const root = document.getElementById("redazione-root");
    if (vista === "login") root.innerHTML = renderLogin();
    else if (vista === "menu") root.innerHTML = renderMenu();
    else if (vista === "carica") root.innerHTML = renderCarica();
    else if (vista === "editor") root.innerHTML = renderEditor(extra || null);
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  /* ---------- Eventi ---------- */
  function initEventi() {
    const root = document.getElementById("redazione-root");

    root.addEventListener("submit", async (e) => {
      if (e.target.id === "login-form") {
        e.preventDefault();
        const user = document.getElementById("login-user").value.trim();
        const pass = document.getElementById("login-pass").value;
        const errEl = document.getElementById("login-error");
        errEl.style.display = "none";
        const btn = e.target.querySelector("button[type=submit]");
        btn.disabled = true; btn.textContent = "Accesso\u2026";
        try {
          await apiLogin(user, pass);
          await apiCaricaAtti();
          vai("menu");
        } catch (err) {
          errEl.textContent = err.message || "Errore di accesso";
          errEl.style.display = "block";
        } finally {
          btn.disabled = false; btn.textContent = "Accedi";
        }
        return;
      }
      if (e.target.id === "redazione-form") {
        e.preventDefault();
        const titolo = document.getElementById("f-titolo").value.trim();
        if (!titolo) { alert("Inserisci almeno il titolo dell'atto."); return; }
        const atto = raccogliAtto();
        const btn = e.target.querySelector("button[type=submit]");
        btn.disabled = true; btn.textContent = "Salvataggio\u2026";
        try {
          await salvaAtto(atto);
          showMsg("Atto salvato nel database!");
          setTimeout(() => vai("carica"), 800);
        } catch (err) {
          alert("Errore nel salvataggio: " + err.message);
        } finally {
          btn.disabled = false; btn.textContent = "\uD83D\uDCBE Salva nel database";
        }
        return;
      }
    });

    root.addEventListener("click", async (e) => {
      const btnAzione = e.target.closest("[data-azione]");
      if (btnAzione) {
        const azione = btnAzione.getAttribute("data-azione");
        if (azione === "nuovo") vai("editor", null);
        else if (azione === "carica") vai("carica");
        else if (azione === "menu") vai("menu");
        else if (azione === "logout") {
          state.binId = ""; state.apiKey = ""; state.user = ""; state.atti = [];
          vai("login");
        }
        return;
      }

      const btnModifica = e.target.closest("[data-modifica]");
      if (btnModifica) {
        const id = btnModifica.getAttribute("data-modifica");
        const atto = state.atti.find(a => a.id === id);
        if (atto) vai("editor", atto);
        return;
      }

      const btnElimina = e.target.closest("[data-elimina]");
      if (btnElimina) {
        const id = btnElimina.getAttribute("data-elimina");
        const atto = state.atti.find(a => a.id === id);
        if (atto && confirm(`Eliminare "${atto.titolo}"?`)) {
          try { await eliminaAtto(id); vai("carica"); }
          catch (err) { alert("Errore: " + err.message); }
        }
        return;
      }

      const btnRimuoviArt = e.target.closest("[data-rimuovi-articolo]");
      if (btnRimuoviArt) {
        const righe = document.querySelectorAll("#redazione-articoli .redazione-articolo");
        if (righe.length <= 1) { alert("Deve rimanere almeno un articolo."); return; }
        btnRimuoviArt.closest(".redazione-articolo").remove();
        return;
      }

      if (e.target.id === "redazione-aggiungi-articolo") {
        const contenitore = document.getElementById("redazione-articoli");
        const n = contenitore.querySelectorAll(".redazione-articolo").length + 1;
        contenitore.insertAdjacentHTML("beforeend", renderRigaArticolo(nuovoArticoloVuoto(n), n));
        return;
      }

      if (e.target.id === "redazione-elimina-corrente" && state.idInModifica) {
        const atto = state.atti.find(a => a.id === state.idInModifica);
        if (atto && confirm(`Eliminare "${atto.titolo}"?`)) {
          try { await eliminaAtto(state.idInModifica); vai("menu"); }
          catch (err) { alert("Errore: " + err.message); }
        }
        return;
      }
    });

    root.addEventListener("input", (e) => {
      if (e.target.id === "redazione-filtro") {
        const q = e.target.value.trim().toLowerCase();
        document.querySelectorAll("#redazione-elenco-carica .redazione-riga").forEach(riga => {
          riga.style.display = riga.textContent.toLowerCase().includes(q) ? "" : "none";
        });
      }
    });
  }

  /* ---------- Init ---------- */
  document.addEventListener("DOMContentLoaded", () => {
    renderTestata("redazione");
    renderFooter();
    initEventi();
    vai("login");
  });
})();
</script>
</body>
</html>
