<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raccolta degli Atti Normativi — Fazione</title>
  <meta name="description" content="Raccolta ufficiale degli atti normativi della fazione: statuto, regolamenti, editti e codici." />
  <link rel="apple-touch-icon" href="NormAktiv.png">
  <link rel="icon" type="image/png" href="NormAktiv.png">
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <div id="testata-root"></div>

  <main class="container">
    <section class="hero" style="margin: -1px -24px 0; padding-left: 24px; padding-right: 24px;">
      <div class="container" style="padding: 0;">
        <h1 class="hero__titolo">Raccolta ufficiale degli atti normativi</h1>
        <p class="hero__sottotitolo">
          Consulta lo Statuto, i regolamenti, gli editti e i codici in vigore nella fazione.
          Ricerca per parola chiave o filtra per categoria.
        </p>
        <form id="form-ricerca" class="ricerca" role="search">
          <label for="campo-ricerca" class="sr-only" style="position:absolute; left:-9999px;">Cerca negli atti</label>
          <input id="campo-ricerca" type="text" placeholder="Cerca per titolo, argomento o categoria&hellip;" autocomplete="off" />
          <button type="submit">Cerca</button>
        </form>
        <div class="hero__stat-riga">
          <div class="hero__stat"><b id="stat-totale">0</b><span>ATTI PUBBLICATI</span></div>
          <div class="hero__stat"><b id="stat-vigenti">0</b><span>ATTI VIGENTI</span></div>
          <div class="hero__stat"><b id="stat-categorie">0</b><span>CATEGORIE</span></div>
        </div>
      </div>
    </section>

    <h2 class="sezione-titolo">Elenco degli atti</h2>
    <div id="filtri-root" class="filtri"></div>
    <p id="conteggio-risultati" style="font-family: var(--font-chrome); font-size: 0.85rem; color: var(--inchiostro-tenue); margin: 0 0 16px;"></p>
    <div id="elenco-root" class="elenco-atti"></div>
  </main>

  <div id="footer-root"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
