<!-- ==================== CAROSELLO NOTIZIE ==================== -->
<section class="news-carousel-section">
  <div class="carousel-header">
    <a href="newsletter.html" class="carousel-title-link">
      <h2>📰 Notizie <span class="carousel-arrow">→</span></h2>
    </a>
    <p class="carousel-subtitle">Le ultime dalla Rete Forlivese</p>
  </div>
  
  <div class="carousel-container">
    <button class="carousel-arrow-btn carousel-prev" aria-label="Precedente">❮</button>
    <div class="carousel-track-wrapper">
      <div class="carousel-track" id="carouselTrack">
        <!-- Gli articoli verranno caricati dinamicamente -->
        <div class="carousel-loading">Caricamento notizie...</div>
      </div>
    </div>
    <button class="carousel-arrow-btn carousel-next" aria-label="Successivo">❯</button>
  </div>
  
  <div class="carousel-dots" id="carouselDots"></div>
</section>

<style>
/* ===== CAROSELLO NOTIZIE ===== */
.news-carousel-section {
  max-width: 1280px;
  margin: 2rem auto;
  padding: 0 2rem;
}

.carousel-header {
  margin-bottom: 1.5rem;
  border-left: 4px solid var(--rf-gold, #d6a536);
  padding-left: 1rem;
}

.carousel-title-link {
  text-decoration: none;
  color: inherit;
  display: inline-block;
  transition: opacity 0.2s;
}

.carousel-title-link:hover {
  opacity: 0.8;
}

.carousel-title-link h2 {
  font-family: "Bebas Neue", sans-serif;
  font-size: 2.2rem;
  letter-spacing: 0.05em;
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.carousel-arrow {
  font-size: 1.8rem;
  transition: transform 0.2s;
  display: inline-block;
}

.carousel-title-link:hover .carousel-arrow {
  transform: translateX(5px);
}

.carousel-subtitle {
  color: var(--rf-muted, rgba(243,239,230,0.68));
  font-size: 0.9rem;
  margin-top: 0.25rem;
}

/* Container principale */
.carousel-container {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.carousel-track-wrapper {
  overflow: hidden;
  flex: 1;
  border-radius: 12px;
}

.carousel-track {
  display: flex;
  transition: transform 0.4s ease-in-out;
  gap: 1.5rem;
}

/* Card del carosello */
.carousel-card {
  flex: 0 0 calc(33.333% - 1rem);
  min-width: 0;
  background: var(--rf-panel, #121417);
  border: 1px solid var(--rf-line, rgba(243,239,230,0.12));
  border-radius: 12px;
  overflow: hidden;
  transition: transform 0.3s, border-color 0.2s;
}

.carousel-card:hover {
  transform: translateY(-5px);
  border-color: var(--rf-gold, #d6a536);
}

.carousel-card-img {
  height: 160px;
  background: linear-gradient(135deg, #1e2a3a, #0f1419);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  color: rgba(255,255,255,0.3);
  border-bottom: 1px solid var(--rf-line, rgba(243,239,230,0.12));
}

.carousel-card-content {
  padding: 1rem;
}

.carousel-card-category {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.2rem 0.6rem;
  background: var(--rf-red, #c83b2f);
  color: #fff;
  border-radius: 4px;
  margin-bottom: 0.5rem;
}

.carousel-card-title {
  font-family: "Barlow Condensed", sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1.3;
  margin: 0.5rem 0;
  color: #fff;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.carousel-card-date {
  font-size: 0.7rem;
  color: var(--rf-muted, rgba(243,239,230,0.68));
  margin-bottom: 0.75rem;
}

.carousel-card-excerpt {
  font-size: 0.8rem;
  color: rgba(243,239,230,0.75);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 1rem;
}

.carousel-read-more {
  display: inline-block;
  font-family: "Barlow Condensed", sans-serif;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--rf-gold, #d6a536);
  text-decoration: none;
  border-bottom: 1.5px solid var(--rf-gold, #d6a536);
  transition: opacity 0.2s;
}

.carousel-read-more:hover {
  opacity: 0.7;
}

/* Frecce navigazione */
.carousel-arrow-btn {
  background: rgba(0,0,0,0.5);
  border: 1px solid var(--rf-line, rgba(243,239,230,0.2));
  color: white;
  font-size: 1.5rem;
  padding: 0.5rem 0.8rem;
  cursor: pointer;
  border-radius: 50%;
  transition: all 0.2s;
  backdrop-filter: blur(4px);
}

.carousel-arrow-btn:hover {
  background: var(--rf-gold, #d6a536);
  color: #0a0c10;
  border-color: var(--rf-gold, #d6a536);
}

/* Pulsanti disabilitati */
.carousel-arrow-btn.disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.carousel-arrow-btn.disabled:hover {
  background: rgba(0,0,0,0.5);
  color: white;
}

/* Dots indicatori */
.carousel-dots {
  display: flex;
  justify-content: center;
  gap: 0.6rem;
  margin-top: 1.5rem;
}

.carousel-dot {
  width: 10px;
  height: 10px;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.2s;
}

.carousel-dot.active {
  background: var(--rf-gold, #d6a536);
  transform: scale(1.2);
}

.carousel-loading {
  text-align: center;
  padding: 2rem;
  color: var(--rf-muted, rgba(243,239,230,0.68));
  width: 100%;
}

/* Responsive */
@media (max-width: 900px) {
  .carousel-card { flex: 0 0 calc(50% - 0.75rem); }
}

@media (max-width: 600px) {
  .carousel-card { flex: 0 0 100%; }
  .carousel-arrow-btn { padding: 0.3rem 0.6rem; font-size: 1.2rem; }
  .carousel-title-link h2 { font-size: 1.8rem; }
  .news-carousel-section { padding: 0 1rem; }
}
</style>

<script>
  // Carosello notizie - viene eseguito dopo il caricamento della pagina
  (function() {
    // Credenziali JSONbin (usa le stesse della newsletter)
    const CAROUSEL_BIN_ID = "69f3d0a936566621a80f357f";
    const CAROUSEL_API_KEY = "$2a$10$JWsV3hKpO6l.WAB//Gdnw.WMMlUmclCw5mT1gTzHJVsdef/p0swoO";
    
    let carouselArticles = [];
    let currentIndex = 0;
    let itemsPerPage = 3;
    let track, prevBtn, nextBtn, dotsContainer;
    
    function updateItemsPerPage() {
      if (window.innerWidth <= 600) itemsPerPage = 1;
      else if (window.innerWidth <= 900) itemsPerPage = 2;
      else itemsPerPage = 3;
    }
    
    async function loadCarouselArticles() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${CAROUSEL_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': CAROUSEL_API_KEY }
        });
        if (!res.ok) throw new Error('Errore caricamento');
        const data = await res.json();
        const allArticles = data.record.articles || [];
        // Prendiamo gli ultimi 6 articoli (più recenti) per il carosello
        carouselArticles = [...allArticles]
          .sort((a, b) => (b.id || 0) - (a.id || 0))
          .slice(0, 6);
        renderCarousel();
      } catch(e) {
        console.error('Errore carosello:', e);
        const track = document.getElementById('carouselTrack');
        if (track) track.innerHTML = '<div class="carousel-loading">❌ Impossibile caricare le notizie</div>';
      }
    }
    
    function renderCarousel() {
      track = document.getElementById('carouselTrack');
      prevBtn = document.querySelector('.carousel-prev');
      nextBtn = document.querySelector('.carousel-next');
      dotsContainer = document.getElementById('carouselDots');
      
      if (!track) return;
      
      if (!carouselArticles.length) {
        track.innerHTML = '<div class="carousel-loading">📭 Nessuna notizia disponibile</div>';
        return;
      }
      
      updateItemsPerPage();
      const totalSlides = Math.ceil(carouselArticles.length / itemsPerPage);
      
      // Genera le card
      let html = '';
      for (let i = 0; i < carouselArticles.length; i++) {
        const art = carouselArticles[i];
        const imgIcon = art.imgLabel || (art.category === 'INCHIESTA' ? '🔍' : '📰');
        html += `
          <div class="carousel-card">
            <div class="carousel-card-img">${imgIcon}</div>
            <div class="carousel-card-content">
              <span class="carousel-card-category">${escapeHtmlCarousel(art.category || 'NOTIZIA')}</span>
              <h3 class="carousel-card-title">${escapeHtmlCarousel(art.title || 'Senza titolo')}</h3>
              <div class="carousel-card-date">📅 ${escapeHtmlCarousel(art.date || '')}</div>
              <p class="carousel-card-excerpt">${escapeHtmlCarousel(art.excerpt || '').substring(0, 100)}${(art.excerpt || '').length > 100 ? '...' : ''}</p>
              <a href="article.html?id=${art.id}" class="carousel-read-more">Leggi più →</a>
            </div>
          </div>
        `;
      }
      track.innerHTML = html;
      
      // Imposta larghezza track in base a itemsPerPage
      const cardWidth = track.children[0]?.offsetWidth || 300;
      const gap = 24; // 1.5rem in px approssimativo
      const trackWidth = carouselArticles.length * (cardWidth + gap);
      track.style.width = `${trackWidth}px`;
      
      // Genera dots
      if (dotsContainer) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
          const dot = document.createElement('span');
          dot.className = 'carousel-dot';
          dot.dataset.index = i;
          dot.addEventListener('click', () => goToSlide(i));
          dotsContainer.appendChild(dot);
        }
      }
      
      updateArrowsAndDots();
      
      // Eventi resize
      window.addEventListener('resize', () => {
        updateItemsPerPage();
        renderCarousel();
      });
    }
    
    function updateArrowsAndDots() {
      updateItemsPerPage();
      const totalSlides = Math.ceil(carouselArticles.length / itemsPerPage);
      const wrapper = document.querySelector('.carousel-track-wrapper');
      if (!wrapper) return;
      
      const slideWidth = wrapper.offsetWidth;
      const newTransform = -currentIndex * slideWidth;
      if (track) track.style.transform = `translateX(${newTransform}px)`;
      
      // Aggiorna dots
      const dots = document.querySelectorAll('.carousel-dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });
      
      // Aggiorna pulsanti
      if (prevBtn) {
        if (currentIndex <= 0) prevBtn.classList.add('disabled');
        else prevBtn.classList.remove('disabled');
      }
      if (nextBtn) {
        if (currentIndex >= totalSlides - 1) nextBtn.classList.add('disabled');
        else nextBtn.classList.remove('disabled');
      }
    }
    
    function goToSlide(index) {
      updateItemsPerPage();
      const totalSlides = Math.ceil(carouselArticles.length / itemsPerPage);
      if (index < 0) index = 0;
      if (index >= totalSlides) index = totalSlides - 1;
      currentIndex = index;
      updateArrowsAndDots();
    }
    
    function nextSlide() {
      const totalSlides = Math.ceil(carouselArticles.length / itemsPerPage);
      if (currentIndex < totalSlides - 1) goToSlide(currentIndex + 1);
    }
    
    function prevSlide() {
      if (currentIndex > 0) goToSlide(currentIndex - 1);
    }
    
    function escapeHtmlCarousel(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    // Inizializza al caricamento del DOM
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        const prevBtnElem = document.querySelector('.carousel-prev');
        const nextBtnElem = document.querySelector('.carousel-next');
        if (prevBtnElem) prevBtnElem.addEventListener('click', prevSlide);
        if (nextBtnElem) nextBtnElem.addEventListener('click', nextSlide);
        loadCarouselArticles();
      });
    } else {
      const prevBtnElem = document.querySelector('.carousel-prev');
      const nextBtnElem = document.querySelector('.carousel-next');
      if (prevBtnElem) prevBtnElem.addEventListener('click', prevSlide);
      if (nextBtnElem) nextBtnElem.addEventListener('click', nextSlide);
      loadCarouselArticles();
    }
  })();
</script>
