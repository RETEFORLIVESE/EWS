function card(a){return `<div class="card"><div class="meta"><span class="tag">${esc(a.categoria)}</span><span class="tag ${a.stato==='vigente'?'':'x'}">${esc(a.stato)}</span>${esc(luogo(a.luogo))}</div>
<h3><a href="${href(a)}">${esc(a.titolo)}</a></h3><div class="meta">n. ${esc(a.numero)}/${esc(a.anno)} · ${esc(a.dataEmanazione)} · ${esc(a.promulgatoDa)}</div>
${a.sommario?`<p>${esc(a.sommario)}</p>`:''}</div>`}
function leggi(){
  const cats=[...new Set(ATTI.map(a=>a.categoria))],lu=[...new Set(ATTI.map(a=>a.luogo))];
  const opt=(v,l,s)=>`<option value="${esc(v)}"${s===v?' selected':''}>${esc(l)}</option>`;
  return `<h1>Leggi e atti</h1>
<div class="bar"><input id="q" placeholder="cerca nel titolo e nel testo…" value="${esc(filtro.q)}" size="26">
<select id="cat"><option value="">tutte le categorie</option>${cats.map(c=>opt(c,c,filtro.cat)).join('')}</select>
<select id="st"><option value="">ogni stato</option>${opt('vigente','vigente',filtro.stato)}${opt('annullato','annullato',filtro.stato)}</select>
<select id="lu"><option value="">tutti i luoghi</option>${lu.map(c=>opt(c,luogo(c),filtro.luogo)).join('')}</select></div><div id="lista"></div>`}
function testoAtto(a){return [a.titolo,a.sommario,...(a.articoli||[]).flatMap(r=>[r.rubrica,r.testo,...(r.commi||[]).map(c=>c.testo)])].join(' ').toLowerCase()}
function lista(){
  const q=filtro.q.toLowerCase();
  const r=ATTI.filter(a=>(!filtro.cat||a.categoria===filtro.cat)&&(!filtro.stato||a.stato===filtro.stato)&&(!filtro.luogo||a.luogo===filtro.luogo)&&(!q||testoAtto(a).includes(q)));
  $('#lista').innerHTML=`<p class="meta">${r.length} risultati</p>`+(r.map(card).join('')||'')}
function atto(id){
  const a=ATTI.find(x=>x.id===id);if(!a)return '<h1>Atto non trovato</h1><p><a href="#leggi">Torna all’elenco</a></p>';
  let toc='',body='';
  (a.articoli||[]).forEach((r,i)=>{
    if(r.tipo){toc+=`<a href="#" data-go="r${i}"><b>${esc(r.testo)}</b></a>`;body+=`<div class="tit" id="r${i}">${esc(r.testo)}</div>`;return}
    toc+=`<a href="#" data-go="r${i}">Art. ${esc(r.numero)} – ${esc(r.rubrica)}</a>`;
    body+=`<div class="art" id="r${i}"><h3><span>Art. ${esc(r.numero)}</span> – ${esc(r.rubrica)}</h3>`+(r.commi||[]).map((c,j)=>`<p>${(r.commi.length>1?(j+1)+'. ':'')+esc(c.testo)}</p>`+((c.sottocommi||[]).length?`<ol>${c.sottocommi.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'')).join('')+'</div>'});
  const pr=(a.pronunce||[]).map(p=>`<div class="card"><b>${esc(p.oggetto||p.titolo||'Pronuncia')}</b><div class="meta">${esc(p.data||'')} ${esc(p.dispositivo||'')}</div><p>${esc(p.effetto||p.motivazione||'')}</p></div>`).join('');
  return `
<h1>${esc(a.titolo)}</h1><div class="meta"><span class="tag">${esc(a.categoria)}</span><span class="tag ${a.stato==='vigente'?'':'x'}">${esc(a.stato)}</span>n. ${esc(a.numero)}/${esc(a.anno)} · ${esc(a.dataEmanazione)} · ${esc(a.promulgatoDa)} · ${esc(luogo(a.luogo))}</div>
${extra(a)}${a.stato!=='vigente'?'<div class="warn">Questo atto risulta '+esc(a.stato)+'.</div>':''}${a.sommario?`<p><i>${esc(a.sommario)}</i></p>`:''}
<h2>indice</h2><div class="toc">${toc}</div><h2>testo</h2>${body}${pr?'<h2>pronunce</h2>'+pr:''}`}

function elezStato(){const D=discendenti();return ELEZ.filter(e=>{const id=ezId(e);if(id==='Unione'||e.consultazione_unitaria)return false;return !SOLO_STATO||D.has(id)||id.startsWith(STATO+'-')||e.area==='EstjiLinn'}).sort((a,b)=>dt(b.data)-dt(a.data))}
function livello(e){const id=ezId(e);if(id==='Unione')return 'unione';if(id===STATO)return 'stato';if(e.tipo_codice==='M'||id===STATO+'-TLN')return 'metro';return 'sezione'}
function nomeLuogo(e){const id=ezId(e);return LUO[id]||(id==='Unione'?'Unione Sociale degli Stati dell’Estji':(e.comune||id))}
function linkLuogo(e){const id=ezId(e),n=esc(nomeLuogo(e));return id?`<a href="#luogo-${esc(id)}">${n}</a>`:n}
function ezCard(e,grafici){
  const P=e.risultati_partiti||[],tot=P.reduce((s,p)=>s+(+p.seggi||0),0),ref=e.tipo_codice==='R';
  const col=(p,i)=>esc(p.colore||PAL[i%PAL.length]);
  const bar=tot&&grafici?`<div class="sb">${P.map((p,i)=>p.seggi?`<i style="width:${p.seggi/tot*100}%;background:${col(p,i)}" title="${esc(p.nome)}: ${p.seggi}"></i>`:'').join('')}</div><div class="pts">${P.filter(p=>p.seggi).map((p,i)=>`<span class="pt"><u style="background:${col(p,i)}"></u>${esc(p.nome)} <b>${p.seggi}</b></span>`).join('')}</div>`:'';
  const voti=!tot&&P.some(p=>p.voti)?`<div class="pts">${P.map(p=>`<span class="pt"><b>${esc(p.nome)}</b> ${esc(p.voti)}${p.percentuale?' ('+esc(p.percentuale)+')':''}</span>`).join('')}</div>`:'';
  const dett=[e.elettori!=null?'elettori '+e.elettori:'',e.votanti!=null?'votanti '+e.votanti:'',e.sezioni_scrutinate!=null?'sezioni '+e.sezioni_scrutinate+'/'+e.sezioni_totali:''].filter(Boolean).join(' · ');
  return `<div class="card"><div class="meta"><span class="tag">${esc(e.tipo)}</span>${esc(e.data)} · ${linkLuogo(e)}${e.affluenza?' · affluenza '+esc(e.affluenza):''}</div>
<h3>${esc(e.tipo)} – ${esc(e.comune||nomeLuogo(e))}</h3>${ref&&e.area?`<p><i>${esc(e.area)}</i></p>`:''}${e.candidato_vincente?`<div><b>${ref?'Esito':'Eletto'}:</b> ${esc(e.candidato_vincente)}</div>`:''}${bar}${voti}${dett?`<div class="meta">${dett}</div>`:''}</div>`}
function ultimeElez(n){const r=elezStato().slice(0,n);return r.length?r.map(e=>ezCard(e)).join(''):'<p class="meta">Nessuna elezione disponibile.</p>'}
function archivio(){
  const E=elezStato();if(!E.length)return '<p class="meta">Dati non caricati.</p>';
  const g=k=>E.filter(e=>livello(e)===k);
  return `<div class="ban">Archivio statale per livello</div><div class="lvl">${LIVELLI.filter(([k])=>g(k).length).map(([k,t])=>`<a href="#" data-go="lv-${k}">${t} (${g(k).length})</a>`).join('')}</div>`+
  LIVELLI.filter(([k])=>g(k).length).map(([k,t,d])=>`<h2 id="lv-${k}">${t}</h2><p class="meta">${d}</p>${g(k).map(e=>ezCard(e,true)).join('')}`).join('')}
function nodoOrgano(id,L){for(const n of L||[]){if(n.id_organo===id)return n;const r=nodoOrgano(id,n.figli);if(r)return r}return null}
function figliDi(n){return n.figli||[]}
function idsSotto(id){const S=new Set([id]);const add=n=>figliDi(n).forEach(c=>{S.add(c.id_organo);add(c)});const n=nodoOrgano(id,ORG.alberoOrgani);if(n)add(n);
  ELEZ.forEach(e=>{const x=ezId(e);if(id==='Unione'||x.startsWith(id+'-'))S.add(x)});return S}
// Se organi.json non e' caricato, l'albero si ricostruisce dai codici id_organo delle elezioni (A-B-C => A > A-B > A-B-C).
function alberoDaCodici(L){
  L=L||ELEZ;const M={},nome={};L.forEach(e=>{const id=ezId(e);if(id&&!nome[id])nome[id]=nomeLuogo(e)});
  const get=id=>M[id]||(M[id]={id_organo:id,nome_display:LUO[id]||nome[id]||id,figli:[]});
  Object.keys(nome).forEach(id=>{const p=id.split('-');for(let i=1;i<=p.length;i++)get(p.slice(0,i).join('-'))});
  Object.keys(M).forEach(id=>{if(id==='Unione')return;const i=id.lastIndexOf('-');get(i<0?'Unione':id.slice(0,i)).figli.push(M[id])});
  return [get('Unione')]}
function nodoDistretto(n){
  const id=n.id_organo,E=ELEZ.filter(e=>ezId(e)===id).sort((a,b)=>dt(b.data)-dt(a.data)),F=figliDi(n);
  const info=E.length?` <span class="meta">· ${E.length} ${E.length>1?'elezioni':'elezione'} · ultima: ${esc(E[0].tipo)} ${esc(E[0].data)}</span>`:'';
  const t=`<a href="#luogo-${esc(id)}"><b>${esc(n.nome_display||LUO[id]||id)}</b></a> <span class="meta">${esc(n.categoria||'')}</span>${info}`;
  return `<li>${F.length?`<details open><summary>${t}</summary><ul>${F.map(nodoDistretto).join('')}</ul></details>`:t}</li>`}
function nodoElez(n){
  const id=n.id_organo,E=ELEZ.filter(e=>ezId(e)===id).sort((a,b)=>dt(b.data)-dt(a.data)),F=figliDi(n);
  const t=`<a href="#luogo-${esc(id)}"><b>${esc(n.nome_display||LUO[id]||id)}</b></a> <span class="meta">${esc(n.categoria||'')}${E.length?' · '+E.length+(E.length>1?' elezioni':' elezione'):''}</span>${n.link_sito?` <a href="${esc(n.link_sito)}" rel="noopener">sito</a>`:''}`;
  if(!E.length&&!F.length)return `<li>${t}</li>`;
  return `<li><details open><summary>${t}</summary>${E.map(e=>ezCard(e,true)).join('')}${F.length?`<ul>${F.map(nodoElez).join('')}</ul>`:''}</details></li>`}
// Albero come "Organi e luoghi" (parte dallo Stato), con le elezioni di ogni luogo e i grafici.
function alberoElezioni(){
  const st=nodoOrgano(STATO,ORG.alberoOrgani);let R;
  if(st)R=[st];else{const r=alberoDaCodici(elezStato())[0];R=r.figli.length?r.figli:[r]}
  return `<div class="tree"><ul>${R.map(nodoElez).join('')}</ul></div>`}
function alberoDistretti(){
  let R=ORG.alberoOrgani||[];const un=nodoOrgano('Unione',R);if(un)R=[un];else if(!R.length)R=alberoDaCodici();
  return `<div class="tree"><ul>${R.map(nodoDistretto).join('')}</ul></div>`}
function luogoPag(id){
  const n=nodoOrgano(id,ORG.alberoOrgani),nome=LUO[id]||(n&&n.nome_display)||(id==='Unione'?'Unione Sociale degli Stati dell’Estji':id),S=idsSotto(id),E=ELEZ.filter(e=>S.has(ezId(e))).sort((a,b)=>dt(b.data)-dt(a.data));
  return `<h1>${esc(nome)}</h1><div class="meta">${n?esc(n.categoria||'')+' · ':''}codice organo: ${esc(id)}${n&&n.link_sito?` · <a href="${esc(n.link_sito)}" rel="noopener">sito</a>`:''}</div>
<h2>elezioni</h2><p class="meta">Comprese quelle dei luoghi collegati sotto di esso.</p>${E.map(e=>ezCard(e)).join('')||'<p class="meta">Nessuna elezione registrata per questo luogo.</p>'}<p><a href="#organi">Albero degli organi ›</a> · <a href="#sub-elezioni-CEPUS">Archivio CEPUS ›</a></p>`}
function right(){return `<div class="box"><h4>filo diretto con i cittadini</h4><a href="#pag-reclami">richieste reclami segnalazioni proposte</a><a href="#pag-reclami">avvisami</a><a href="#pag-urp">ufficio relazioni con il pubblico</a></div>
<div class="box"><h4>ultimi atti</h4>${newsAtti(4).map(a=>`<a href="${href(a)}">${esc(a.titolo)}</a>`).join('')||'<div>Nessun atto disponibile.</div>'}</div>
<div class="box"><a href="#leggi">notizie dalla giunta</a><a href="#leggi">notizie dal congresso</a><a href="#organi">organi e luoghi</a></div>
<div class="box"><a href="#pag-meteo">meteo</a><a href="#sub-ambiente-ambiente">qualità dell’aria</a><a href="#pag-protezionecivile">protezione civile</a><a href="#sub-infrastrutture-trasporti">trasporti</a></div>
<div class="promo"><b>Leggi e atti dello Stato</b>Costituzione, leggi e decreti dell’EstjiLinn.<br><a href="#leggi">consulta la normativa ›</a></div>
<div class="promo"><b>Distretti e Assemblee</b>Taleen e i distretti dello Stato Sociale.<br><a href="#pag-distretti">vai ›</a></div>`}
function home(){
  const ev=newsAtti(5).map(a=>`<div class="ev"><div class="d">${esc(a.dataEmanazione)}</div><h3><a href="${href(a)}">${esc(a.titolo)}</a></h3><div>${esc(a.sommario||'')} ${esc(a.categoria)} n. ${esc(a.numero)}/${esc(a.anno)}, ${esc(luogo(a.luogo))}. <a href="${href(a)}"><b>vai al testo ›</b></a></div></div>`).join('');
  return `<h1>Stato Sociale di EstjiLinn</h1>${INTRO}<h2>in evidenza</h2>${ev||'<p>Nessun atto disponibile al momento.</p>'}<h2>aree tematiche</h2><div class="grid">${Object.entries(SEZ).map(([k,[t,s]])=>`<div class="gc"><h3><a href="#sez-${k}">${t.toLowerCase()}</a></h3><p>${s.map(x=>x[1]).join(', ')}</p></div>`).join('')}</div>`}
// ---- CONTENUTI PERSONALIZZATI ----
// Chiave 'sezione-sottosezione' => sostituisce la pagina standard di quella sottosezione (HTML o funzione che restituisce HTML).
// Chiave 'sezione' => aggiunge un blocco in fondo alla pagina della sezione.  Esempio:
//   'formazione-lavoro': `<h1>Lavoro</h1><p>Testo...</p><div class="card">Un riquadro</div>`,
//   'economia': `<h2>Novità</h2><p>Blocco extra in fondo alla pagina Economia Imprese.</p>`,
// Classi pronte: card, ban (fascia rossa), grid/gc (riquadri), lst (elenco link), warn, tag, meta, tit.
const CONTENUTI={
// ESEMPIO 1 - sostituisce la pagina "Formazione Lavoro > lavoro". Modificalo o cancella tutta la voce.
'formazione-lavoro': `<h1>Lavoro</h1>
<p>Qui puoi scrivere un testo introduttivo, con <b>grassetto</b>, <i>corsivo</i> e <a href="#leggi">link interni</a>.</p>
<div class="ban">Bandi aperti</div>
<div class="card"><div class="meta"><span class="tag">bando</span><span class="tag">scade 30/11/2026</span></div>
<h3>Esempio: incentivi all'assunzione</h3><p>Descrizione del bando, requisiti e come fare domanda.</p></div>
<div class="grid">
<div class="gc"><h3>Sportello lavoro</h3><p>Orari, indirizzo e contatti.</p></div>
<div class="gc"><h3>Moduli</h3><p><a href="documenti/modulo.pdf">Scarica il modulo (PDF)</a></p></div>
</div>
<div class="warn">Esempio di avviso importante.</div>`,
// ESEMPIO 2 - blocco aggiunto in fondo alla pagina della sezione "Economia Imprese" (chiave = solo la sezione).
'economia': `<h2>novità</h2><div class="card"><b>Esempio:</b> nuovo incentivo per le imprese artigiane. <a href="#sub-economia-artigianato">vai ›</a></div>`,
// ESEMPIO 3 - contenuto dinamico (funzione): per attivarlo togli le // all'inizio delle righe.
// 'economia-industria': () => `<h1>Industria</h1>` + ATTI.slice(0,3).map(card).join(''),
};
const cont=k=>{const c=CONTENUTI[k];return c?(typeof c==='function'?c():c):''};
function sez(k){const[t,subs]=SEZ[k];return `<h1>${t.toLowerCase()}</h1><div class="grid">${subs.map(([s,l,d])=>`<div class="gc"><h3><a href="#sub-${k}-${s}">${l}</a></h3><p>${d}</p></div>`).join('')}</div>`+cont(k)}
function sub(k,s){
  const e=SEZ[k][1].find(x=>x[0]===s);if(!e)return '<h1>Pagina non trovata</h1>';
  if(CONTENUTI[k+'-'+s])return cont(k+'-'+s);
  if(k==='elezioni'&&s==='Distrettuali')return `<h1>${e[1]}</h1><p>${e[2]}</p>${alberoElezioni()}<p><a href="#sub-elezioni-CEPUS">Archivio CEPUS ›</a></p>`;
  if(k==='elezioni'&&s==='CEPUS')return `<h1>${e[1]}</h1><p>${e[2]}</p><p><a class="btn" href="https://ews-rose.vercel.app/CEPU.html" target="_blank" rel="noopener">Vai all’archivio completo ›</a></p>${archivio()}`;
  const w=e[1].split(' ')[0].toLowerCase(),rel=ATTI.filter(a=>testoAtto(a).includes(w)).slice(0,6);
  return `<h1>${e[1][0].toUpperCase()+e[1].slice(1)}</h1><p>${e[2]}</p><div class="ban">Misure e servizi</div>
<div class="lst"><a href="#leggi">Normativa di riferimento</a><p>Leggi, statuti e decreti dell’Unione e degli Stati.</p><a href="#organi">Organi competenti</a><p>Enti e organi territoriali coinvolti.</p></div>
<h2>approfondimenti</h2>${rel.length?rel.map(a=>`<div class="ev"><a href="${href(a)}">${esc(a.titolo)}</a><div class="meta">${esc(a.categoria)} n. ${esc(a.numero)}/${esc(a.anno)}</div></div>`).join(''):'<p class="meta">Nessun atto collegato trovato; consulta <a href="#leggi">tutte le leggi</a>.</p>'}
<div class="card"><b>contatti</b><br>Servizio ${esc(e[1])}<br>Stato di EstjiLinn – Taleen</div>`}

const INTRO=`<div class="card">Lo Stato Sociale di EstjiLinn è membro dell’Unione Sociale degli Stati dell’Estji. La capitale è la Città Metropolitana di <b>Taleen</b>, sede di tutte le istituzioni statali. Il potere legislativo è esercitato dalle Assemblee e dai Congressi; il <b>Congresso Statale</b> è composto da 101 delegati. Il diritto di voto si acquisisce a 16 anni. <a href="#leggi">Consulta la Costituzione e le leggi ›</a></div>`;
const DISTRETTI=`<h1>Distretti e assemblee</h1><p>Distretti dello Stato (Costituzione dell’EstjiLinn, art. 8).</p><h2>non membri della Città Metropolitana di Taleen</h2><ul><li><b>Hichibate</b>: Bakeneko, Renault, Bateria, Ginza, Notos, Thora</li><li><b>Konko</b>: Mikita, Royale</li><li><b>Arcipelago di Alinesjia</b></li></ul><h2>membri della Città Metropolitana di Taleen</h2><ul><li><b>Ehime</b>: Sars, Tampere, Estji, Tervetulloa</li><li><b>Aömöry</b>: Fiumana, Klosse, Fluvia, Ankita, Ost, Ecles</li><li><b>Katagaa</b>: Irinastok</li><li><b>Fukura</b>: 1 Ile, 2 Ile, 3 Ile, 4 Ile, 5 Ile</li><li><b>Niigataa</b>: Tegel, TegelGard, Minotte</li><li><b>Kengoko</b>: Finance, NewShinguku, Gallier</li><li><b>Idame</b>: Soyuz, Littoria, Lampugniano, Aprilia</li><li><b>Yate</b>: Rial, Tadam</li></ul><p><a href="#organi">Albero degli organi ›</a></p>`;
function extra(a){if(window.FALLBACK&&FALLBACK.demo)return '';const k=Object.keys(PDFS).find(p=>String(a.id).startsWith(p));
  return (a.immagine?`<img src="${esc(String(a.immagine).replace(/^\//,''))}" alt="" style="max-width:200px;max-height:200px;display:block;margin:10px auto" onerror="this.remove()">`:'')+(k?`<p><a href="${PDFS[k]}" download>⬇ Scarica il PDF</a></p>`:'')}
function pag(s){const l=PAG[s]||s;if(s==='distretti')return `<h1>Distretti e assemblee</h1><h2>albero dei distretti dell’Unione</h2><p class="meta">Clicca un luogo per vedere le sue elezioni: ogni nuova elezione con lo stesso <code>id_organo</code> si collega da sola.</p>${alberoDistretti()}`+DISTRETTI.replace('<h1>Distretti e assemblee</h1>','<h2>elenco dei distretti dello Stato</h2>');return `<h1>${esc(l)}</h1><p>Questa sezione è in preparazione.</p><p><a href="#leggi">Vai alle leggi e agli atti ›</a></p>`}
function route(){
  const h=location.hash.slice(1)||'home',[t,a,b]=h.split('-');
  let sk=t==='sez'||t==='sub'?a:'',main,L=globalMenu(),R='',cr='<a href="#home">home</a>';
  const nm=SEZ[sk]?SEZ[sk][0].toLowerCase():'';
  if(h==='home'){main=home();R=right();cr=''}
  else if(t==='atto'){main=atto(h.slice(5));cr+=' › <a href="#leggi">leggi e atti</a>'}
  else if(h==='leggi'){main=leggi();cr+=' › leggi e atti'}
  else if(h==='organi'){main=organi();cr+=' › organigramma'}
  else if(t==='sez'&&SEZ[a]){main=sez(a);L=sezMenu(a);cr+=' › '+nm}
  else if(t==='sub'&&SEZ[a]){main=sub(a,b);L=sezMenu(a,b);cr+=` › <a href="#sez-${a}">${nm}</a> › ${esc((SEZ[a][1].find(x=>x[0]===b)||[0,''])[1])}`}
  else if(t==='luogo'){main=luogoPag(h.slice(6));cr+=' › luoghi'}
  else if(t==='pag'){main=pag(h.slice(4));cr+=' › '+esc(PAG[h.slice(4)]||'')}
  else main=home();
  $('#app').innerHTML=main;$('#L').innerHTML=L;$('#R').innerHTML=R;$('#R').style.display=R?'':'none';
  $('#crumb').innerHTML=cr?'sei in: '+cr:'';
  $('#nav').innerHTML=Object.entries(SEZ).map(([k,v])=>`<a href="#sez-${k}" class="${k===sk?'on':''}">${v[0]}</a>`).join('');
  if(h==='leggi'){const u=()=>{filtro={q:$('#q').value,cat:$('#cat').value,stato:$('#st').value,luogo:$('#lu').value};lista()};
    ['#q','#cat','#st','#lu'].forEach(s=>$(s).oninput=u);lista()}
  document.body.classList.remove('menu');window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();document.getElementById(g.dataset.go).scrollIntoView()}
  if(e.target.id==='menubtn')document.body.classList.toggle('menu');
  if(e.target.id==='stampa'){e.preventDefault();print()}
  if(e.target.id==='vai')vaiCerca()});
$('#cerca').onkeydown=e=>{if(e.key==='Enter')vaiCerca()};
function vaiCerca(){filtro={q:$('#cerca').value,cat:'',stato:'',luogo:''};if(location.hash==='#leggi')route();else location.hash='leggi'}
window.addEventListener('hashchange',route);
route();carica();
</script></body></html>
