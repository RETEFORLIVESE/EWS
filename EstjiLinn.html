<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0e2;--page:#fff;--ink:#222;--mut:#666;--bar:#7d7a48;--barink:#fff;--red:#8c1a0a;--link:#1a3fb0;--side:#f1f3e6;--line:#d5d6bd;--box:#f6f7ee;--blue:#1b3a8c}

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 Verdana,Geneva,sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1000px;margin:0 auto;background:var(--page);min-height:100vh}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 16px;flex-wrap:wrap}
.logo{border:2px solid var(--ink);padding:10px 14px;font:700 15px/1.2 Georgia,serif;letter-spacing:.08em;text-transform:uppercase}
.logo small{display:block;font-weight:400;letter-spacing:.05em;font-size:10px}
.tools{background:var(--side);padding:6px 10px;font-size:12px}.tools input{width:150px}
nav{background:var(--bar);display:flex;flex-wrap:wrap;box-shadow:0 0 0 100vmax var(--bar);clip-path:inset(0 -100vmax)}
nav a{color:var(--barink);font:700 10.5px/1.2 Verdana,sans-serif;text-transform:uppercase;padding:9px 12px;flex:1 1 auto}
nav a.on{background:var(--page);color:var(--ink)}
.crumb{font-size:12px;padding:8px 16px 0}
.cols{display:flex;gap:16px;padding:12px 16px 20px;align-items:flex-start}
.l{width:176px;flex:none}.r{width:200px;flex:none}main{flex:1;min-width:0}
.l a{display:block;background:var(--side);border-bottom:1px solid var(--line);padding:5px 8px;margin-bottom:2px}
.l a.on{font-weight:700;border-left:4px solid var(--red)}
.l a.sub{background:none;padding:5px 8px 5px 14px}
.l h4,.r h4{background:var(--bar);color:#fff;margin:10px 0 4px;padding:3px 8px;font-size:12px;font-weight:400}
.l h4.s{background:var(--blue);color:#fff}
.box{border:1px solid var(--line);background:var(--box);margin-bottom:10px}.box h4{margin:0}.box>div,.box>a{display:block;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px}
.promo{border:1px solid var(--line);padding:8px;margin-bottom:10px;text-align:center}.promo b{display:block;font:700 18px/1.15 Georgia,serif;color:var(--blue);margin-bottom:6px}
h1{font:700 30px/1.1 Georgia,serif;color:var(--red);margin:0 0 12px}
h2{font:700 15px Georgia,serif;margin:16px 0 8px;border-bottom:2px solid var(--bar);text-transform:lowercase;color:var(--ink)}
.ev{border-bottom:1px solid var(--line);padding:8px 0}.ev .d{font-weight:700;font-size:12px}.ev h3{margin:3px 0;font:700 19px/1.2 Georgia,serif}.ev h3 a{color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc{border:1px solid var(--line);padding:6px;min-height:110px}.gc h3{margin:0 0 6px;padding:4px 8px;background:var(--box);font:700 15px Verdana,sans-serif}.gc p{margin:0 4px;font-size:12px}
.ban{background:var(--red);color:#fff;font-weight:700;font-size:11px;padding:3px 8px;margin:14px 0 8px;text-transform:uppercase}
.lst a{font-weight:700}.lst p{margin:0 0 10px 12px;font-size:12px}
input,select,button{font:inherit;padding:5px 8px;border:1px solid var(--line);background:var(--page);color:var(--ink)}
button{background:var(--bar);color:#fff;cursor:pointer;border:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.card{border:1px solid var(--line);background:var(--box);padding:10px 12px;margin-bottom:8px}
.card h3{margin:2px 0 4px;font:700 16px Georgia,serif}.meta{font-size:12px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border:1px solid var(--bar);margin-right:4px}.tag.x{border-color:var(--red);color:var(--red)}
.warn{border:1px solid var(--red);color:var(--red);padding:8px;margin:10px 0;font-weight:700}
.toc{border:1px solid var(--line);background:var(--box);padding:8px 12px;font-size:12px;max-height:200px;overflow:auto;columns:2}.toc a{display:block}
.tit{background:var(--bar);color:#fff;padding:4px 10px;margin:20px 0 6px;font-weight:700}
.art{margin:14px 0}.art h3{margin:0 0 4px;font:700 15px Georgia,serif}.art h3 span{color:var(--red)}
.art p{margin:4px 0}.art ol{margin:2px 0 4px;padding-left:28px;list-style:lower-alpha}
.tree ul{list-style:none;padding-left:18px;margin:2px 0}.tree summary{cursor:pointer;padding:2px 0}
footer{border-top:3px solid var(--bar);padding:10px 16px;font-size:11px;color:var(--mut);display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
#menubtn{display:none}
@media(max-width:800px){body{font-size:15px}
header{padding:10px 12px}.tools{width:100%}.tools input{width:calc(100% - 78px)}
#menubtn{display:block;width:100%;text-align:left;padding:12px 14px;background:var(--side);color:var(--ink);border-bottom:1px solid var(--line);font-weight:700}
nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:none;clip-path:none}nav a{flex:none;white-space:nowrap;padding:13px 14px}
.cols{flex-direction:column;padding:10px 12px 16px;gap:12px}.l,.r{width:100%}.l{display:none}body.menu .l{display:block}
.l a{padding:11px 10px}main{width:100%}
.toc{columns:1;max-height:170px}h1{font-size:23px}.grid{grid-template-columns:1fr}.ev h3{font-size:17px}
.bar{flex-direction:column}.bar input,.bar select{width:100%;padding:10px}
.crumb{padding:8px 12px 0}footer{flex-direction:column;padding:12px}.art ol{padding-left:22px}}
@media print{nav,.l,.r,.tools,footer{display:none}}
</style></head><body><div class="wrap">
<header><a href="#home" class="logo" style="color:inherit;text-decoration:none;display:flex;gap:10px;align-items:center"><img src="https://github.com/RETEFORLIVESE/IMG/blob/main/COAT/EstjiLinn.png?raw=true" alt="" width="44" height="44" style="object-fit:contain" onerror="this.remove()"><span>Stato di EstjiLinn<small>Unione Sociale degli Stati dell’Estji</small></span></a>
<div class="tools"><a href="#home">mappa</a> | <a href="#pag-rss">rss</a> | <a href="#pag-login">login</a> | <a href="#" id="stampa">versione stampabile</a><br>
<input id="cerca" placeholder="cerca nelle leggi…"> <button id="vai">cerca</button></div></header>
<button id="menubtn" type="button">☰ menu</button><nav id="nav"></nav><div class="crumb" id="crumb"></div>
<div class="cols"><div class="l" id="L"></div><main id="app"></main><div class="r" id="R"></div></div>
<footer><span>© Zentraler Exekutivrat der EstjiLinn · [estjibundes.me.ei]</span></footer></div>
<script>

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATO='ELIN',RIF=['costituzione-dell-unione'],PDFS={'costituzione-estjilinn':'documenti/costituzione-estjilinn.pdf','costituzione-dell-unione':'documenti/costituzione-unione.pdf'};
let ATTI=[],ORG={},LUO={},filtro={q:'',cat:'',stato:'',luogo:''};
const $=s=>document.querySelector(s);
// Lettura: prima gli endpoint API (api/atti.js, api/organi.js), poi i file JSON accanto alla pagina.
async function prova(urls){for(const u of urls){try{const r=await fetch(u,{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}}return null}
function applica(d){
  if(d&&Array.isArray(d.atti))ATTI=d.atti; else if(Array.isArray(d))ATTI=d;
  ATTI=ATTI.filter(a=>a.luogo===STATO||RIF.some(p=>String(a.id).startsWith(p)));
  if(d&&(d.luoghi||d.alberoOrgani)){ORG=d;LUO={};
    for(const liv of Object.values(d.luoghi||{}))for(const[k,v]of Object.entries(liv))LUO[k]=typeof v==='string'?v:(v.nome||k)}
}
async function carica(){
  const[a,o]=await Promise.all([prova(['/api/atti','atti.json']),prova(['/api/atti?risorsa=organi','/api/organi','organi.json'])]);
  applica(a);applica(o);if(!ATTI.length&&window.FALLBACK){applica(FALLBACK.atti);applica(FALLBACK.organi)}stato();route();
}
function stato(){}

const luogo=c=>c?(LUO[c]||c):'';
const href=a=>'#atto-'+a.id;
function card(a){return `<div class="card"><div class="meta"><span class="tag">${esc(a.categoria)}</span><span class="tag ${a.stato==='vigente'?'':'x'}">${esc(a.stato)}</span>${esc(luogo(a.luogo))}</div>
<h3><a href="${href(a)}">${esc(a.titolo)}</a></h3><div class="meta">n. ${esc(a.numero)}/${esc(a.anno)} · ${esc(a.dataEmanazione)} · ${esc(a.promulgatoDa)}</div>
${a.sommario?`<p>${esc(a.sommario)}</p>`:''}</div>`}
function leggi(){
  const cats=[...new Set(ATTI.map(a=>a.categoria))],lu=[...new Set(ATTI.map(a=>a.luogo))];
  const opt=(v,l,s)=>`<option value="${esc(v)}"${s===v?' selected':''}>${esc(l)}</option>`;
  return `<h1>Leggi e atti</h1>
<div class="bar"><input id="q" placeholder="cerca nel titolo e nel testo…" value="${esc(filtro.q)}" size="26">
<select id="cat"><option value="">tutte le categorie</option>${cats.map(c=>opt(c,c,filtro.cat)).join('')}</select>
<select id="st"><option value="">ogni stato</option>${opt('vigente','vigente',filtro.stato)}${opt('annullato','annullato',filtro.stato)}</select>
<select id="lu"><option value="">tutti i luoghi</option>${lu.map(c=>opt(c,luogo(c),filtro.luogo)).join('')}</select></div><div id="lista"></div>`}
function testoAtto(a){return [a.titolo,a.sommario,...(a.articoli||[]).flatMap(r=>[r.rubrica,r.testo,...(r.commi||[]).map(c=>c.testo)])].join(' ').toLowerCase()}
function lista(){
  const q=filtro.q.toLowerCase();
  const r=ATTI.filter(a=>(!filtro.cat||a.categoria===filtro.cat)&&(!filtro.stato||a.stato===filtro.stato)&&(!filtro.luogo||a.luogo===filtro.luogo)&&(!q||testoAtto(a).includes(q)));
  $('#lista').innerHTML=`<p class="meta">${r.length} risultati</p>`+(r.map(card).join('')||'')}
function atto(id){
  const a=ATTI.find(x=>x.id===id);if(!a)return '<h1>Atto non trovato</h1><p><a href="#leggi">Torna all’elenco</a></p>';
  let toc='',body='';
  (a.articoli||[]).forEach((r,i)=>{
    if(r.tipo){toc+=`<a href="#" data-go="r${i}"><b>${esc(r.testo)}</b></a>`;body+=`<div class="tit" id="r${i}">${esc(r.testo)}</div>`;return}
    toc+=`<a href="#" data-go="r${i}">Art. ${esc(r.numero)} – ${esc(r.rubrica)}</a>`;
    body+=`<div class="art" id="r${i}"><h3><span>Art. ${esc(r.numero)}</span> – ${esc(r.rubrica)}</h3>`+(r.commi||[]).map((c,j)=>`<p>${(r.commi.length>1?(j+1)+'. ':'')+esc(c.testo)}</p>`+((c.sottocommi||[]).length?`<ol>${c.sottocommi.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'')).join('')+'</div>'});
  const pr=(a.pronunce||[]).map(p=>`<div class="card"><b>${esc(p.oggetto||p.titolo||'Pronuncia')}</b><div class="meta">${esc(p.data||'')} ${esc(p.dispositivo||'')}</div><p>${esc(p.effetto||p.motivazione||'')}</p></div>`).join('');
  return `
<h1>${esc(a.titolo)}</h1><div class="meta"><span class="tag">${esc(a.categoria)}</span><span class="tag ${a.stato==='vigente'?'':'x'}">${esc(a.stato)}</span>n. ${esc(a.numero)}/${esc(a.anno)} · ${esc(a.dataEmanazione)} · ${esc(a.promulgatoDa)} · ${esc(luogo(a.luogo))}</div>
${extra(a)}${a.stato!=='vigente'?'<div class="warn">Questo atto risulta '+esc(a.stato)+'.</div>':''}${a.sommario?`<p><i>${esc(a.sommario)}</i></p>`:''}
<h2>indice</h2><div class="toc">${toc}</div><h2>testo</h2>${body}${pr?'<h2>pronunce</h2>'+pr:''}`}
function nodo(n){return `<li>${(n.figli||[]).length?`<details open><summary>`:''}<b>${esc(n.nome_display||n.id_organo)}</b> <span class="meta">${esc(n.categoria||'')}</span>${n.link_sito?` <a href="${esc(n.link_sito)}" rel="noopener">sito</a>`:''}${(n.figli||[]).length?`</summary><ul>${n.figli.map(nodo).join('')}</ul></details>`:''}</li>`}
function organi(){return `<h1>Organi e luoghi</h1><div class="tree"><ul>${(ORG.alberoOrgani||[]).filter(n=>n.id_organo===STATO).map(nodo).join('')||'<li>Dati non caricati.</li>'}</ul></div>`}
// ---- Struttura del sito (sezioni tematiche come nel portale di riferimento) ----
const SEZ={
istruzione:['Istruzione Ricerca',[['scuola','scuola','Scuole dell’Unione, programmi didattici e borse di studio.'],['universita','università','Atenei, corsi e diritto allo studio universitario.'],['ricerca','ricerca','Centri di ricerca, progetti e finanziamenti all’innovazione.'],['edilizia','edilizia scolastica','Costruzione e manutenzione degli edifici scolastici.']]],
formazione:['Formazione Lavoro',[['lavoro','lavoro','Politiche del lavoro, incontro tra domanda e offerta, tutele.'],['formazione','formazione professionale','Corsi, qualifiche e riconversione professionale.'],['apprendistato','apprendistato','Contratti di apprendistato e tirocini.'],['mobilita','avvisi di mobilità','Concorsi e mobilità nel pubblico impiego.']]],
economia:['Economia Imprese',[['industria','industria','Incentivi per crescita e innovazione industriale, incremento e salvaguardia dei livelli occupazionali, risparmio energetico e tutela ambientale.'],['artigianato','artigianato','Contributi e incentivi per avviare, far crescere e innovare un’impresa artigiana.'],['agricoltura','agricoltura e foreste','Contributi, incentivi, settori e filiere, economia delle foreste, marchi di qualità.'],['turismo','turismo','Finanziamenti per avviare un’impresa turistica o una struttura ricettiva, promozione del territorio.'],['commercio','commercio e servizi','Promozione del commercio, valorizzazione della distribuzione, sostegno alle imprese. Registro imprese (IRE).'],['pesca','pesca e acquacoltura','Interventi per il sostegno della pesca professionale e dell’acquacoltura.'],['cooperative','cooperative','Vigilanza sulle cooperative, incentivi per la promozione e lo sviluppo della cooperazione.'],['montagna','montagna','Misure per il sostegno e lo sviluppo dell’economia della montagna.']]],
famiglia:['Famiglia Casa',[['famiglia','famiglia','Sostegni alle famiglie, natalità e servizi per l’infanzia.'],['casa','casa','Edilizia residenziale pubblica e contributi per l’abitazione.'],['giovani','giovani','Politiche giovanili, studio, lavoro e tempo libero.'],['anziani','anziani','Servizi e assistenza per la popolazione anziana.']]],
salute:['Salute Sociale',[['sanita','sanità','Servizi sanitari, prevenzione e assistenza.'],['sociale','politiche sociali','Inclusione, welfare e sostegno alle fragilità.'],['disabilita','disabilità','Diritti e servizi per le persone con disabilità.'],['dipendenze','dipendenze','Prevenzione e contrasto delle dipendenze.']]],
cultura:['Cultura Sport',[['cultura','cultura','Eventi, musei, biblioteche e patrimonio culturale.'],['sport','sport','Impianti, associazioni e contributi allo sport.'],['lingue','minoranze e lingue','Tutela delle lingue e delle comunità.'],['eventi','eventi','Calendario degli appuntamenti dell’Unione.']]],
fondi:['Fondi Unione',[['fondi','fondi dell’Unione','Programmi di finanziamento e bandi aperti.'],['cooperazione','cooperazione tra Stati','Progetti transnazionali tra gli Stati membri.'],['bandi','bandi e avvisi','Avvisi pubblici e scadenze.'],['rendicontazione','rendicontazione','Controllo e monitoraggio dei fondi.']]],
ambiente:['Ambiente Territorio',[['ambiente','ambiente','Qualità dell’aria, acqua e tutela della natura.'],['territorio','territorio','Pianificazione territoriale e urbanistica.'],['energia','energia','Risparmio e fonti energetiche.'],['protezione','protezione civile','Emergenze e prevenzione dei rischi.']]],
infrastrutture:['Infrastrutture Lavori Pubblici',[['trasporti','trasporti','Reti ferroviarie e metropolitane, metropolitane e rete di trasporto dello Stato.'],['strade','strade e viabilità','Rete stradale e manutenzione.'],['lavori','lavori pubblici','Appalti e cantieri.'],['porti','porti e logistica','Scali, merci e logistica.']]]};
const ENTE=[['trasparenza','trasparenza'],['organi','organigramma'],['bilancio','bilancio'],['programmazione','programmazione'],['statistica','statistica'],['egovernment','e-government'],['tributi','tributi'],['enti','enti, agenzie e società'],['collaborazioni','collaborazioni e consulenze']];
const CERCA=[['persone','persone/uffici'],['leggi','leggi'],['bollettino','bollettino ufficiale'],['delibere','delibere'],['concorsi','concorsi'],['bandi','bandi e avvisi'],['appalti','appalti e lavori'],['dati','dati ambientali e territoriali'],['conti','conti pubblici']];
const ISTI=[['esecutivo','consiglio esecutivo statale'],['congresso','congresso statale'],['distretti','distretti e assemblee']];
const lk=([s,l])=>`<a href="#${s==='organi'||s==='leggi'?s:'pag-'+s}">${l}</a>`;
const PAG={};[...ISTI,...ENTE,...CERCA,['rss','rss'],['login','login'],['autonomie','autonomie locali'],['reclami','richieste reclami segnalazioni'],['urp','ufficio relazioni con il pubblico'],['meteo','meteo'],['protezionecivile','protezione civile']].forEach(([s,l])=>PAG[s]=l);
function globalMenu(){return ISTI.map(lk).join('')+'<h4>ente</h4>'+ENTE.map(lk).join('')+'<h4>autonomie locali</h4><a href="#organi">sistema delle autonomie</a><a href="#pag-autonomie">polizia locale e sicurezza</a><h4 class="s">cerca</h4>'+CERCA.map(lk).join('')}
function sezMenu(k,sub){const[t,subs]=SEZ[k];return `<h4 class="s" style="margin-top:0">${t.toLowerCase()}</h4>`+subs.map(([s,l])=>`<a href="#sub-${k}-${s}" class="${s===sub?'on':''}">${l}</a>`).join('')}
function newsAtti(n){return ATTI.filter(a=>a.luogo===STATO).sort((x,y)=>y.anno-x.anno||y.numero-x.numero).slice(0,n)}
function right(){return `<div class="box"><h4>filo diretto con i cittadini</h4><a href="#pag-reclami">richieste reclami segnalazioni proposte</a><a href="#pag-reclami">avvisami</a><a href="#pag-urp">ufficio relazioni con il pubblico</a></div>
<div class="box"><h4>ultimi atti</h4>${newsAtti(4).map(a=>`<a href="${href(a)}">${esc(a.titolo)}</a>`).join('')||'<div>Nessun atto disponibile.</div>'}</div>
<div class="box"><a href="#leggi">notizie dalla giunta</a><a href="#leggi">notizie dal congresso</a><a href="#organi">organi e luoghi</a></div>
<div class="box"><a href="#pag-meteo">meteo</a><a href="#sub-ambiente-ambiente">qualità dell’aria</a><a href="#pag-protezionecivile">protezione civile</a><a href="#sub-infrastrutture-trasporti">trasporti</a></div>
<div class="promo"><b>leggi e atti dello Stato</b>Costituzione, leggi e decreti dell’EstjiLinn.<br><a href="#leggi">consulta la normativa ›</a></div>
<div class="promo"><b>distretti e assemblee</b>Taleen e i distretti dello Stato.<br><a href="#pag-distretti">vai ›</a></div>`}
function home(){
  const ev=newsAtti(5).map(a=>`<div class="ev"><div class="d">${esc(a.dataEmanazione)}</div><h3><a href="${href(a)}">${esc(a.titolo)}</a></h3><div>${esc(a.sommario||'')} ${esc(a.categoria)} n. ${esc(a.numero)}/${esc(a.anno)}, ${esc(luogo(a.luogo))}. <a href="${href(a)}"><b>vai al testo ›</b></a></div></div>`).join('');
  return `<h1>Stato Sociale di EstjiLinn</h1>${INTRO}<h2>in evidenza</h2>${ev||'<p>Nessun atto disponibile al momento.</p>'}<h2>aree tematiche</h2><div class="grid">${Object.entries(SEZ).map(([k,[t,s]])=>`<div class="gc"><h3><a href="#sez-${k}">${t.toLowerCase()}</a></h3><p>${s.map(x=>x[1]).join(', ')}</p></div>`).join('')}</div>`}
function sez(k){const[t,subs]=SEZ[k];return `<h1>${t.toLowerCase()}</h1><div class="grid">${subs.map(([s,l,d])=>`<div class="gc"><h3><a href="#sub-${k}-${s}">${l}</a></h3><p>${d}</p></div>`).join('')}</div>`}
function sub(k,s){
  const e=SEZ[k][1].find(x=>x[0]===s);if(!e)return '<h1>Pagina non trovata</h1>';
  const w=e[1].split(' ')[0].toLowerCase(),rel=ATTI.filter(a=>testoAtto(a).includes(w)).slice(0,6);
  return `<h1>${e[1][0].toUpperCase()+e[1].slice(1)}</h1><p>${e[2]}</p><div class="ban">Misure e servizi</div>
