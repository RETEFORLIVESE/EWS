<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>RF Admin – Gestione articoli</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { background:#0a0c10; color:#eee; font-family: 'Barlow', sans-serif; padding:2rem; }
  .container { max-width:1000px; margin:0 auto; }
  input, textarea, button { background:#1e1e2a; border:1px solid #333; color:white; padding:0.5rem; margin:0.2rem; border-radius:4px; }
  button { background:#c83b2f; cursor:pointer; border:none; }
  button:hover { opacity:0.9; }
  .article-item { background:#121417; margin:1rem 0; padding:1rem; border-left:4px solid #d6a536; display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
  .article-item input[type="checkbox"] { transform:scale(1.2); }
  hr { border-color:#333; margin:1rem 0; }
  .success { background:#2a6230; padding:0.5rem; margin:0.5rem 0; border-radius:4px; }
  .error { background:#8b2a1e; padding:0.5rem; margin:0.5rem 0; border-radius:4px; }
  .loading { opacity:0.7; pointer-events:none; }
  .status-msg { margin-top:1rem; padding:0.5rem; border-radius:4px; display:none; }
</style>
</head>
<body>
<div class="container">
  <h1>✍️ Pannello di amministrazione RF</h1>
  <div id="loginArea">
    <p>Inserisci la password per accedere:</p>
    <input type="password" id="adminPassword" placeholder="Password">
    <button id="loginBtn">Accedi</button>
  </div>
  <div id="adminContent" style="display:none;">
    <div id="statusMsg" class="status-msg"></div>
    
    <h2>➕ Nuovo articolo</h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
      <input id="title" placeholder="Titolo">
      <input id="category" placeholder="Categoria">
      <input id="author" placeholder="Autore">
      <input id="date" placeholder="Data (es. 30 aprile 2026)">
      <textarea id="excerpt" rows="2" placeholder="Estratto" style="grid-column:span 2;"></textarea>
      <input id="imgLabel" placeholder="Icona (es. 📰 POLITICA)">
      <label><input type="checkbox" id="verified"> ✅ Verificato RF</label>
      <label><input type="checkbox" id="featured"> ⭐ Articolo in evidenza</label>
    </div>
    <button id="addArticleBtn">➕ Aggiungi articolo e salva su cloud</button>
    <hr>
    <h2>✔️ Gestione verifica articoli esistenti</h2>
    <div id="articlesList"></div>
    <button id="saveAllBtn" style="background:#2a6230;">💾 Salva tutte le modifiche su JSONbin</button>
    <hr>
    <p><strong>⚠️ Nota:</strong> Ogni modifica viene salvata immediatamente sul cloud (JSONbin). Non serve più esportare nulla.</p>
  </div>
</div>

<script>
  // ===== CONFIGURAZIONE CON LE TUE CREDENZIALI FUNZIONANTI =====
  const BIN_ID = "69f3d0a936566621a80f357f";
  const API_KEY = "$2a$10$JWsV3hKpO6l.WAB//Gdnw.WMMlUmclCw5mT1gTzHJVsdef/p0swoO";
  const ADMIN_PASSWORD = "RF2026Admin";

  let currentArticles = [];

  function showMessage(msg, isError = false) {
    const statusDiv = document.getElementById('statusMsg');
    statusDiv.style.display = 'block';
    statusDiv.className = isError ? 'error' : 'success';
    statusDiv.innerHTML = isError ? `❌ ${msg}` : `✅ ${msg}`;
    setTimeout(() => {
      statusDiv.style.display = 'none';
    }, 3000);
  }

  async function fetchArticles() {
    try {
      showMessage("Caricamento articoli in corso...", false);
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 'X-Master-Key': API_KEY }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      currentArticles = data.record.articles || [];
      renderArticleList();
      showMessage(`Caricati ${currentArticles.length} articoli`);
    } catch (err) {
      console.error(err);
      showMessage(`Errore caricamento: ${err.message}`, true);
      currentArticles = [];
      renderArticleList();
    }
  }

  async function saveArticlesToCloud() {
    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': API_KEY
        },
        body: JSON.stringify({ articles: currentArticles })
      });
      
      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`HTTP ${response.status}: ${errorText}`);
      }
      
      showMessage("Articoli salvati su cloud con successo!");
      return true;
    } catch (err) {
      console.error(err);
      showMessage(`Errore nel salvataggio: ${err.message}`, true);
      return false;
    }
  }

  function renderArticleList() {
    const container = document.getElementById('articlesList');
    if (!container) return;
    
    if (currentArticles.length === 0) {
      container.innerHTML = '<p style="color:#888;">Nessun articolo presente. Creane uno usando il form sopra.</p>';
      return;
    }
    
    container.innerHTML = '';
    currentArticles.forEach((art, idx) => {
      const div = document.createElement('div');
      div.className = 'article-item';
      div.innerHTML = `
        <input type="checkbox" class="verified-checkbox" data-idx="${idx}" ${art.verified ? 'checked' : ''}>
        <strong>${escapeHtml(art.title)}</strong> 
        <small>(${art.author || 'anonimo'})</small>
        <span style="margin-left:auto; font-size:0.8rem;">${art.date || ''}</span>
        <button class="delete-article" data-idx="${idx}" style="background:#8b2a1e; padding:0.2rem 0.5rem;">🗑️ Elimina</button>
      `;
      container.appendChild(div);
    });
    
    // Aggiungi event listener per i pulsanti elimina
    document.querySelectorAll('.delete-article').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const idx = parseInt(btn.getAttribute('data-idx'));
        if (confirm(`Sei sicuro di voler eliminare "${currentArticles[idx].title}"?`)) {
          currentArticles.splice(idx, 1);
          await saveArticlesToCloud();
          renderArticleList();
        }
      });
    });
  }

  async function addArticle() {
    const title = document.getElementById('title').value.trim();
    if (!title) {
      showMessage("Il titolo è obbligatorio", true);
      return;
    }
    
    const newArt = {
      id: Date.now(),
      title: title,
      category: document.getElementById('category').value.trim() || "ATTUALITÀ",
      categoryColor: "#173b73",
      date: document.getElementById('date').value.trim() || new Date().toLocaleDateString('it-IT'),
      author: document.getElementById('author').value.trim() || "Redazione",
      excerpt: document.getElementById('excerpt').value.trim() || "Contenuto in arrivo...",
      imgLabel: document.getElementById('imgLabel').value.trim() || "📰 NOTIZIA",
      featured: document.getElementById('featured').checked,
      verified: document.getElementById('verified').checked,
      likes: 0,
      dislikes: 0
    };
    
    currentArticles.push(newArt);
    const saved = await saveArticlesToCloud();
    if (saved) {
      renderArticleList();
      // reset form
      document.getElementById('title').value = '';
      document.getElementById('category').value = '';
      document.getElementById('author').value = '';
      document.getElementById('date').value = '';
      document.getElementById('excerpt').value = '';
      document.getElementById('imgLabel').value = '';
      document.getElementById('featured').checked = false;
      document.getElementById('verified').checked = false;
      showMessage(`Articolo "${title}" aggiunto!`);
    } else {
      // rollback
      currentArticles.pop();
    }
  }

  async function saveVerifiedChanges() {
    const checkboxes = document.querySelectorAll('#articlesList .verified-checkbox');
    checkboxes.forEach(cb => {
      const idx = parseInt(cb.getAttribute('data-idx'));
      if (currentArticles[idx]) {
        currentArticles[idx].verified = cb.checked;
      }
    });
    await saveArticlesToCloud();
    renderArticleList();
  }

  function escapeHtml(str) { 
    if (!str) return ''; 
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Login
  document.getElementById('loginBtn').onclick = () => {
    const pwd = document.getElementById('adminPassword').value;
    if (pwd === ADMIN_PASSWORD) {
      document.getElementById('loginArea').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      fetchArticles();
    } else { 
      alert("Password errata"); 
    }
  };
  
  document.getElementById('addArticleBtn').onclick = addArticle;
  document.getElementById('saveAllBtn').onclick = saveVerifiedChanges;
</script>
</body>
</html>
