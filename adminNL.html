<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>RF Admin – Gestione articoli</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { background:#0a0c10; color:#eee; font-family: 'Barlow', sans-serif; padding:2rem; }
  .container { max-width:1200px; margin:0 auto; }
  input, textarea, button, select { background:#1e1e2a; border:1px solid #333; color:white; padding:0.5rem; margin:0.2rem; border-radius:4px; }
  button { background:#c83b2f; cursor:pointer; border:none; }
  button:hover { opacity:0.9; }
  .article-item { background:#121417; margin:1rem 0; padding:1rem; border-left:4px solid #d6a536; display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
  .article-item button { margin-left:0.5rem; }
  hr { border-color:#333; margin:1rem 0; }
  .success { background:#2a6230; padding:0.5rem; margin:0.5rem 0; border-radius:4px; }
  .error { background:#8b2a1e; padding:0.5rem; margin:0.5rem 0; border-radius:4px; }
  .image-group { background:#1a1d24; padding:1rem; margin:0.5rem 0; border-radius:8px; }
  .image-item { display:flex; gap:0.5rem; margin-bottom:0.5rem; flex-wrap:wrap; align-items:center; }
  .image-item input { flex:1; min-width:150px; }
  .remove-img { background:#8b2a1e; padding:0.2rem 0.5rem; }
  .btn-add-img { background:#2a6230; margin-top:0.5rem; }
  .status-msg { margin-top:1rem; padding:0.5rem; border-radius:4px; display:none; }
  h3 { margin-top:1rem; color: #d6a536; }
  .login-box { background:#1e1e2a; padding:2rem; border-radius:8px; max-width:400px; margin:2rem auto; text-align:center; }
  .login-box input { width:100%; margin:0.5rem 0; }
  .date-options { display:flex; gap:1rem; align-items:center; margin:0.5rem 0; }
  .date-options label { display:flex; align-items:center; gap:0.5rem; }
  .edit-mode-indicator { background:#d6a536; color:#0a0c10; padding:0.2rem 0.5rem; border-radius:4px; display:inline-block; margin-bottom:1rem; }
</style>
</head>
<body>
<div class="container">
  <h1>✍️ Pannello di amministrazione RF</h1>
  
  <!-- Login Area -->
  <div id="loginArea">
    <div class="login-box">
      <h2>🔐 Accesso riservato</h2>
      <input type="text" id="adminUsername" placeholder="Nome utente">
      <input type="password" id="adminPassword" placeholder="Password">
      <button id="loginBtn">Accedi</button>
      <p style="font-size:0.8rem; margin-top:1rem; color:#888;">Contatta l'amministratore per le credenziali</p>
    </div>
  </div>
  
  <!-- Admin Content (inizialmente nascosto) -->
  <div id="adminContent" style="display:none;">
    <div id="statusMsg" class="status-msg"></div>
    <div id="editModeIndicator" class="edit-mode-indicator" style="display:none;">✏️ Modalità modifica</div>
    
    <h2 id="formTitle">➕ Nuovo articolo</h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
      <input id="title" placeholder="Titolo">
      <input id="category" placeholder="Categoria (es. POLITICA)">
      <input id="author" placeholder="Autore (il tuo nome utente)">
      <!-- Data: opzioni -->
      <div class="date-options" style="grid-column:span 2;">
        <label><input type="radio" name="dateType" value="today" checked> 🗓️ Pubblicato oggi ({{data_corrente}})</label>
        <label><input type="radio" name="dateType" value="custom"> 📅 Data personalizzata (evento passato)</label>
      </div>
      <input id="customDate" placeholder="Data personalizzata (es. 25 aprile 1975)" style="display:none; grid-column:span 2;">
      <input id="imgLabel" placeholder="Icona card (es. 📰 POLITICA)" style="grid-column:span 2;">
    </div>
    
    <!-- ESTRATTO -->
    <textarea id="excerpt" rows="2" placeholder="Estratto (anteprima nella homepage)" style="width:100%; margin-top:0.5rem;"></textarea>
    
    <!-- CONTENUTO COMPLETO -->
    <textarea id="fullContent" rows="8" placeholder="CONTENUTO COMPLETO DELL'ARTICOLO (per la pagina dedicata)&#10;Puoi usare paragrafi, elenchi, grassetto ecc." style="width:100%; margin-top:0.5rem;"></textarea>
    
    <!-- CAROSELLO IMMAGINI -->
    <h3>🖼️ Carosello immagini (appare dopo il titolo nell'articolo)</h3>
    <div id="imagesContainer">
      <div id="imageList"></div>
      <button type="button" id="addImageBtn" class="btn-add-img">➕ Aggiungi immagine al carosello</button>
    </div>
    
    <!-- FONTI -->
    <h3>📚 Fonti e riferimenti</h3>
    <textarea id="sources" rows="3" placeholder="Fonti: (una per riga)&#10;Fonte 1: https://...&#10;Fonte 2: Nome documento"></textarea>
    
    <hr>
    <div style="margin:0.5rem 0;">
      <label><input type="checkbox" id="verified"> ✅ Verificato RF</label>
      <label style="margin-left:1rem;"><input type="checkbox" id="featured"> ⭐ Articolo in evidenza</label>
    </div>
    
    <button id="saveArticleBtn" style="background:#2a6230;">💾 Salva articolo</button>
    <button id="cancelEditBtn" style="background:#666; display:none;">❌ Annulla modifica</button>
    <hr>
    
    <h2>📋 Gestione articoli esistenti</h2>
    <div id="articlesList"></div>
  </div>
</div>

<script>
  // ===== CONFIGURAZIONE =====
  const BIN_ID = "69f3d0a936566621a80f357f";
  const API_KEY = "$2a$10$JWsV3hKpO6l.WAB//Gdnw.WMMlUmclCw5mT1gTzHJVsdef/p0swoO";
  
  // ===== CREDENZIALI UTENTI (nome utente fisso per lo scrittore) =====
  const VALID_USERS = {
    "redazione": "RF2026Admin",
    "mariorossi": "forli2026",
    "giornalista": "reteforlivese"
  };
  
  let currentArticles = [];
  let tempImages = [];
  let editingArticleId = null;
  let currentUser = "";
  
  // Data corrente formattata
  function getTodayDate() {
    const oggi = new Date();
    return oggi.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  
  // Aggiorna la data nel radio button
  function updateTodayLabel() {
    const todayLabel = document.querySelector('label[value="today"]');
    if (todayLabel) {
      todayLabel.innerHTML = `🗓️ Pubblicato oggi (${getTodayDate()})`;
    }
  }
  
  function showMessage(msg, isError = false) {
    const statusDiv = document.getElementById('statusMsg');
    statusDiv.style.display = 'block';
    statusDiv.className = isError ? 'error' : 'success';
    statusDiv.innerHTML = isError ? `❌ ${msg}` : `✅ ${msg}`;
    setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);
  }
  
  // Gestione data
  function handleDateTypeChange() {
    const customDateInput = document.getElementById('customDate');
    const todayRadio = document.querySelector('input[value="today"]');
    const customRadio = document.querySelector('input[value="custom"]');
    
    todayRadio.addEventListener('change', () => {
      customDateInput.style.display = 'none';
    });
    customRadio.addEventListener('change', () => {
      customDateInput.style.display = 'block';
    });
  }
  
  function getSelectedDate() {
    const todayRadio = document.querySelector('input[value="today"]');
    const customRadio = document.querySelector('input[value="custom"]');
    if (todayRadio.checked) {
      return getTodayDate();
    } else {
      const customDate = document.getElementById('customDate').value.trim();
      return customDate || "Data non specificata";
    }
  }
  
  // Gestione immagini
  function renderImageList() {
    const container = document.getElementById('imageList');
    container.innerHTML = '';
    tempImages.forEach((img, idx) => {
      const div = document.createElement('div');
      div.className = 'image-group';
      div.innerHTML = `
        <div class="image-item">
          <input type="text" placeholder="URL immagine (es. https://...)" value="${escapeHtml(img.url)}" class="img-url" data-idx="${idx}" style="flex:2;">
          <input type="text" placeholder="Didascalia" value="${escapeHtml(img.caption)}" class="img-caption" data-idx="${idx}" style="flex:1;">
          <input type="text" placeholder="Crediti foto" value="${escapeHtml(img.credit)}" class="img-credit" data-idx="${idx}" style="flex:1;">
          <button class="remove-img" data-idx="${idx}">🗑️</button>
        </div>
      `;
      container.appendChild(div);
    });
    
    document.querySelectorAll('.img-url').forEach(inp => {
      inp.addEventListener('change', (e) => {
        const idx = parseInt(e.target.getAttribute('data-idx'));
        if (tempImages[idx]) tempImages[idx].url = e.target.value;
      });
    });
    document.querySelectorAll('.img-caption').forEach(inp => {
      inp.addEventListener('change', (e) => {
        const idx = parseInt(e.target.getAttribute('data-idx'));
        if (tempImages[idx]) tempImages[idx].caption = e.target.value;
      });
    });
    document.querySelectorAll('.img-credit').forEach(inp => {
      inp.addEventListener('change', (e) => {
        const idx = parseInt(e.target.getAttribute('data-idx'));
        if (tempImages[idx]) tempImages[idx].credit = e.target.value;
      });
    });
    document.querySelectorAll('.remove-img').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(btn.getAttribute('data-idx'));
        tempImages.splice(idx, 1);
        renderImageList();
      });
    });
  }
  
  document.getElementById('addImageBtn')?.addEventListener('click', () => {
    tempImages.push({ url: '', caption: '', credit: '' });
    renderImageList();
  });
  
  // Fetch articoli da cloud
  async function fetchArticles() {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 'X-Master-Key': API_KEY }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      currentArticles = data.record.articles || [];
      renderArticleList();
      showMessage(`Caricati ${currentArticles.length} articoli`);
    } catch (err) {
      showMessage(`Errore caricamento: ${err.message}`, true);
      currentArticles = [];
      renderArticleList();
    }
  }
  
  // Salva su cloud
  async function saveArticlesToCloud() {
    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': API_KEY
        },
        body: JSON.stringify({ articles: currentArticles })
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      showMessage("Articoli salvati su cloud con successo!");
      return true;
    } catch (err) {
      showMessage(`Errore nel salvataggio: ${err.message}`, true);
      return false;
    }
  }
  
  // Reset form
  function resetForm() {
    document.getElementById('title').value = '';
    document.getElementById('category').value = '';
    document.getElementById('author').value = currentUser;
    document.getElementById('imgLabel').value = '';
    document.getElementById('excerpt').value = '';
    document.getElementById('fullContent').value = '';
    document.getElementById('sources').value = '';
    document.getElementById('verified').checked = false;
    document.getElementById('featured').checked = false;
    document.getElementById('customDate').value = '';
    document.querySelector('input[value="today"]').checked = true;
    document.getElementById('customDate').style.display = 'none';
    tempImages = [];
    renderImageList();
    editingArticleId = null;
    document.getElementById('formTitle').innerHTML = '➕ Nuovo articolo';
    document.getElementById('editModeIndicator').style.display = 'none';
    document.getElementById('cancelEditBtn').style.display = 'none';
    document.getElementById('saveArticleBtn').innerHTML = '💾 Salva articolo';
  }
  
  // Carica articolo per modifica
  function loadArticleForEdit(articleId) {
    const art = currentArticles.find(a => a.id === articleId);
    if (!art) return;
    
    editingArticleId = articleId;
    document.getElementById('title').value = art.title || '';
    document.getElementById('category').value = art.category || '';
    document.getElementById('author').value = art.author || currentUser;
    document.getElementById('imgLabel').value = art.imgLabel || '';
    document.getElementById('excerpt').value = art.excerpt || '';
    document.getElementById('fullContent').value = art.fullContent || '';
    document.getElementById('sources').value = (art.sources || []).join('\n');
    document.getElementById('verified').checked = art.verified || false;
    document.getElementById('featured').checked = art.featured || false;
    tempImages = art.images || [];
    renderImageList();
    
    // Gestione data
    const isToday = art.date === getTodayDate();
    if (isToday) {
      document.querySelector('input[value="today"]').checked = true;
      document.getElementById('customDate').style.display = 'none';
    } else {
      document.querySelector('input[value="custom"]').checked = true;
      document.getElementById('customDate').value = art.date || '';
      document.getElementById('customDate').style.display = 'block';
    }
    
    document.getElementById('formTitle').innerHTML = '✏️ Modifica articolo';
    document.getElementById('editModeIndicator').style.display = 'inline-block';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    document.getElementById('saveArticleBtn').innerHTML = '💾 Aggiorna articolo';
    
    // Scroll al form
    document.getElementById('formTitle').scrollIntoView({ behavior: 'smooth' });
  }
  
  // Salva o aggiorna articolo
  async function saveArticle() {
    const title = document.getElementById('title').value.trim();
    if (!title) { showMessage("Il titolo è obbligatorio", true); return; }
    
    const sourcesList = document.getElementById('sources').value.split('\n').filter(s => s.trim());
    const selectedDate = getSelectedDate();
    
    const articleData = {
      id: editingArticleId || Date.now(),
      title: title,
      category: document.getElementById('category').value.trim() || "ATTUALITÀ",
      categoryColor: "#173b73",
      date: selectedDate,
      author: document.getElementById('author').value.trim() || currentUser,
      excerpt: document.getElementById('excerpt').value.trim() || "Contenuto in arrivo...",
      fullContent: document.getElementById('fullContent').value.trim() || "Contenuto non ancora disponibile.",
      imgLabel: document.getElementById('imgLabel').value.trim() || "📰 NOTIZIA",
      featured: document.getElementById('featured').checked,
      verified: document.getElementById('verified').checked,
      images: tempImages.filter(img => img.url && img.url.trim()),
      sources: sourcesList,
      likes: editingArticleId ? (currentArticles.find(a => a.id === editingArticleId)?.likes || 0) : 0,
      dislikes: editingArticleId ? (currentArticles.find(a => a.id === editingArticleId)?.dislikes || 0) : 0
    };
    
    if (editingArticleId) {
      // Modifica: sostituisci l'articolo esistente
      const index = currentArticles.findIndex(a => a.id === editingArticleId);
      if (index !== -1) {
        currentArticles[index] = articleData;
      }
    } else {
      // Nuovo articolo
      currentArticles.push(articleData);
    }
    
    const saved = await saveArticlesToCloud();
    if (saved) {
      resetForm();
      renderArticleList();
      showMessage(`Articolo "${title}" salvato con successo!`);
    }
  }
  
  function cancelEdit() {
    resetForm();
    renderArticleList();
  }
  
  async function deleteArticle(articleId) {
    const article = currentArticles.find(a => a.id === articleId);
    if (confirm(`Sei sicuro di voler eliminare "${article?.title}"?`)) {
      currentArticles = currentArticles.filter(a => a.id !== articleId);
      await saveArticlesToCloud();
      renderArticleList();
      showMessage("Articolo eliminato");
    }
  }
  
  function renderArticleList() {
    const container = document.getElementById('articlesList');
    if (!container) return;
    if (currentArticles.length === 0) {
      container.innerHTML = '<p style="color:#888;">Nessun articolo presente. Creane uno usando il form sopra.</p>';
      return;
    }
    container.innerHTML = '';
    currentArticles.forEach((art) => {
      const div = document.createElement('div');
      div.className = 'article-item';
      div.innerHTML = `
        <input type="checkbox" class="verified-checkbox" data-id="${art.id}" ${art.verified ? 'checked' : ''}>
        <strong>${escapeHtml(art.title)}</strong> 
        <small>(${art.author || 'anonimo'})</small>
        <span style="font-size:0.75rem; color:#d6a536;">${art.date || ''}</span>
        <span style="margin-left:auto;">
          <button class="edit-article" data-id="${art.id}" style="background:#2a6230;">✏️ Modifica</button>
          <button class="delete-article" data-id="${art.id}" style="background:#8b2a1e;">🗑️ Elimina</button>
        </span>
      `;
      container.appendChild(div);
    });
    
    document.querySelectorAll('.delete-article').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(btn.getAttribute('data-id'));
        deleteArticle(id);
      });
    });
    
    document.querySelectorAll('.edit-article').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(btn.getAttribute('data-id'));
        loadArticleForEdit(id);
      });
    });
    
    document.querySelectorAll('.verified-checkbox').forEach(cb => {
      cb.addEventListener('change', async (e) => {
        const id = parseInt(cb.getAttribute('data-id'));
        const article = currentArticles.find(a => a.id === id);
        if (article) {
          article.verified = cb.checked;
          await saveArticlesToCloud();
        }
      });
    });
  }
  
  function escapeHtml(str) { 
    if (!str) return ''; 
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  // LOGIN
  document.getElementById('loginBtn').onclick = () => {
    const username = document.getElementById('adminUsername').value.trim();
    const password = document.getElementById('adminPassword').value;
    
    if (VALID_USERS[username] && VALID_USERS[username] === password) {
      currentUser = username;
      document.getElementById('loginArea').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      document.getElementById('author').value = username;
      updateTodayLabel();
      handleDateTypeChange();
      fetchArticles();
      showMessage(`Benvenuto, ${username}!`);
    } else {
      alert("Nome utente o password errati");
    }
  };
  
  document.getElementById('saveArticleBtn').onclick = saveArticle;
  document.getElementById('cancelEditBtn').onclick = cancelEdit;
  
  // Inizializzazione
  updateTodayLabel();
</script>
</body>
</html>
