<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Site Builder</title>
<style>

.btn{background:var(--bar);color:#fff;padding:8px 14px;font-weight:700;text-decoration:none;display:inline-block}.tag{font-size:11px;padding:0 6px;border:1px solid var(--bar);margin-right:4px}

function ez(e,g){const P=e.risultati_partiti||[],t=P.reduce((s,p)=>s+(+p.seggi||0),0),ref=e.tipo_codice==='R',c=(p,i)=>p.colore||PAL[i%PAL.length];
 const bar=t&&g?`<div class="sb">${P.map((p,i)=>p.seggi?`<i style="width:${p.seggi/t*100}%;background:${c(p,i)}"></i>`:'').join('')}</div><div class="pts">${P.filter(p=>p.seggi).map((p,i)=>`<span class="pt"><u style="background:${c(p,i)}"></u>${E(p.nome)} <b>${p.seggi}</b></span>`).join('')}</div>`:'';
 return `<div class="card"><div class="meta"><span class="tag">${E(e.tipo)}</span>${E(e.data)} · ${E(e.comune)}${e.affluenza?' · affluenza '+E(e.affluenza):''}</div><h3>${E(e.tipo)} – ${E(e.comune)}</h3>${ref&&e.area?`<p><i>${E(e.area)}</i></p>`:''}${e.candidato_vincente?`<div><b>${ref?'Esito':'Eletto'}:</b> ${E(e.candidato_vincente)}</div>`:''}${bar}</div>`}

link:{n:'Link / bottone',d:{txt:'Vai ›',href:'#leggi',btn:true},f:[['txt','Etichetta'],['href','Indirizzo (#pagina o https://…)'],['btn','Come bottone','chk']],h:b=>`<p><a${b.btn?' class="btn"':''} href="${E(b.href)}">${E(b.txt)}</a></p>`},

elez:{n:'Consultazione (dati JSON)',dyn:1,d:{k:'',g:true},f:[['k','Consultazione','sel',opz(()=>1)],['g','Con grafico seggi','chk']],h:b=>{const e=EZ.find(x=>K(x)===b.k);return e?ez(e,b.g):'<p class="meta">(scegli una consultazione)</p>'},
 x:b=>`(e=>e?ezCard(e,${!!b.g}):'')(ELEZ.find(e=>e.tipo_codice+'|'+e.data+'|'+e.comune===${JSON.stringify(b.k)}))`},

piano:{n:'Piano CTSU / CCP',d:{src:'CTSU',pid:'',ti:'Titolo del piano',stato:'',org:'',sommario:'',img:'',href:''},
 f:[['src','Fonte','sel',['CTSU','CCP']],['pid','Scegli dall\'elenco caricato','sel',b=>[['','— scegli (prima carica i piani in alto) —'],...(PI[b.src]||[]).map(p=>[p.id,p.ti+(p.stato?' ('+p.stato+')':'')])]],['ti','Titolo'],['stato','Stato'],['org','Organo responsabile'],['sommario','Descrizione','area'],['img','Immagine di copertina','img'],['href','Link al piano']],
 fill:b=>{const p=(PI[b.src]||[]).find(x=>x.id===b.pid);if(!p)return;Object.assign(b,{ti:p.ti,stato:p.stato,org:p.org,sommario:p.sommario,img:p.img});const h=piHref(b.src,p.id);if(h)b.href=h},

 h:b=>b.html?`<iframe srcdoc="${E(b.html)}" style="width:100%;height:${+b.h||800}px;border:1px solid var(--line);background:#fff" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`:'<p class="meta">(nessun sito)</p>'}
};
