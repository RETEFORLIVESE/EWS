<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><link rel="manifest" href="id-manifest.webmanifest"><meta name="theme-color" content="#043a96"><link rel="apple-touch-icon" href="id-icon-512.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Estji ID"><title>Estji ID</title>
<style>
:root{--bg:#eef2fa;--p:#fff;--ink:#0a1f44;--mute:#5a6a8a;--blue:#043a96;--line:#cfd8ea;--ok:#0b7a4b;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#07122b;--p:#0e1d3f;--ink:#e6edfb;--mute:#93a3c6;--blue:#5b8cff;--line:#243660;--ok:#4cd08f;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
header{background:#043a96;color:#fff;padding:16px 20px}header h1{margin:0;font-size:1.2rem}
main{max-width:520px;margin:0 auto;padding:16px 16px 48px}.p{background:var(--p);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
h2{margin:0 0 8px;font-size:1.05rem}label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{margin-top:12px;padding:10px 16px;border:0;border-radius:6px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.alt{background:none;color:var(--blue);border:1px solid var(--blue)}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
.m{margin:10px 0;padding:9px 11px;border-left:4px solid var(--blue);background:var(--bg);border-radius:4px;font-size:.9rem}.m.ok{border-color:var(--ok)}.m.bad{border-color:var(--bad)}
ul{list-style:none;margin:0;padding:0}li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.card{background:#f3f6fd;color:#0a1f44;border:1px solid #cfd8ea;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.25);margin:12px 0 6px}
.card .ch{background:#043a96;color:#fff;padding:12px 16px}.card .ch b{display:block;font-size:1rem}.card .ch small{opacity:.85;font-size:.72rem}
.card .cb{display:flex;gap:14px;padding:14px 16px;position:relative}
.card .av{flex:none;width:76px;height:98px;border-radius:8px;background:linear-gradient(160deg,#043a96,#3d6fd6);color:#fff;font-size:2.2rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.card .av.sk{height:76px;background:none;overflow:hidden}.card .av img{display:block;width:76px;height:76px;border-radius:8px;image-rendering:pixelated}
.card .cf{min-width:0;flex:1}.card .cf small{display:block;font-size:.68rem;color:#5a6a8a;margin-top:7px}.card .cf b{display:block;font-size:.98rem;overflow-wrap:anywhere}
.card .dots{letter-spacing:2px;color:#5a6a8a;font-weight:400}
.card .st{position:absolute;right:12px;bottom:8px;width:64px;height:64px;border:3px double #c9a227;border-radius:50%;color:#c9a227;font-size:.55rem;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-12deg);opacity:.85}
.card .mrz{background:#e2e9f7;font:700 .68rem ui-monospace,monospace;padding:8px 12px;overflow:hidden;white-space:nowrap;text-overflow:clip;color:#0a1f44}
.mute{color:var(--mute);font-size:.85rem}.cup{font-family:ui-monospace,monospace;font-weight:700;color:var(--blue)}
</style></head><body>
<header><h1>Estji ID · Identità digitale USSE</h1></header><main id="app"></main>
<link rel="apple-touch-icon" href="id-icon-512.png">
<link rel="icon" type="image/png" href="id-icon-512.png">
<script>
var $=function(s){return document.querySelector(s)},esc=function(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var vista="pub",ip=null;
if("serviceWorker" in navigator)navigator.serviceWorker.register("id-sw.js").catch(function(){});
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();ip=e;aggInst()});
window.addEventListener("appinstalled",function(){ip=null;aggInst()});
function installata(){return window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}
function aggInst(){var b=$("#inst");if(!b)return;if(installata()){b.innerHTML="";return}
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  b.innerHTML='<div class="p"><h2>Accesso rapido</h2><p class="mute">Aggiungi Estji ID alla schermata Home: si apre come un\'app, senza cercare il link ogni volta. Il nome in gioco viene ricordato; la password la completa il gestore password del dispositivo.</p>'+
   (ip?'<button id="ib" style="width:100%">Aggiungi alla schermata Home</button>':ios?'<div class="m">Su iPhone/iPad: tocca <b>Condividi</b>, poi <b>Aggiungi alla schermata Home</b>.</div>':'<div class="m">Dal menu del browser scegli <b>Installa app</b> oppure <b>Aggiungi a schermata Home</b>.</div>')+'</div>';
  if($("#ib"))$("#ib").onclick=function(){var p=ip;ip=null;p.prompt();p.userChoice.then(aggInst,aggInst)}}
function resid(m){return m.residenzaNome||m.residenza||((m.stato||"")+(m.sezione?" · "+m.sezione:""))}
function testa(m){var l=esc(String(m.nick||"?").charAt(0).toUpperCase()),k=m.uuid||m.nick;
  if(!k)return l;
  return'<img src="https://mc-heads.net/avatar/'+encodeURIComponent(k)+'/128" alt="'+esc(m.nick)+'" width="76" height="76" onerror="this.parentNode.classList.remove(\'sk\');this.outerHTML=\''+l+'\'">'}
function carta(m){
  var full=vista==="full",dots='<span class="dots">••••••••</span>',cl=function(t){return String(t==null?"":t).toUpperCase().replace(/[^A-Z0-9]+/g,"<")};
  var mrz="P<EST<"+cl(m.nick)+"<<<"+cl(m.id)+"<<"+String(m.iscritto||"").replace(/\D/g,"");
  return'<div class="row" style="margin-top:6px"><button class="'+(full?"alt":"")+'" data-v="pub">Dati nascosti</button><button class="'+(full?"":"alt")+'" data-v="full">Dati completi</button></div>'+
  '<div class="card"><div class="ch"><b>USSE · Carta d\'Identità</b><small>Union der Wohlfartsstaaten von Estji</small></div><div class="cb"><div class="av sk">'+testa(m)+'</div><div class="cf">'+
  '<small>Nome in gioco</small><b>'+esc(m.nick)+'</b><small>ID Estji</small><b>'+esc(m.id)+'</b><small>Residenza elettorale</small><b>'+esc(resid(m))+'</b><small>Cariche e ruoli</small><b>'+esc((m.ruoli||[]).join(", ")||"Nessuna")+'</b>'+
  '<small>Discord</small><b>'+(full&&m.discord?esc(m.discord):dots)+'</b><small>UUID di gioco</small><b>'+(full&&m.uuid?esc(m.uuid):dots)+'</b></div>'+(m.verificato?'<div class="st">VERIFICATO<br>EWS</div>':'')+'</div><div class="mrz">'+esc(mrz)+'</div></div>'}
var LUOGHI=null,LERR=null;
function eVoce(v){return typeof v==="string"||(v&&typeof v==="object"&&typeof v.nome==="string")}
function raccogli(c,g,out){Object.keys(c||{}).forEach(function(k){var v=c[k];if(eVoce(v))out.push({id:k,nome:typeof v==="string"?v:v.nome,gruppo:g});else if(v&&typeof v==="object")raccogli(v,g||k,out)})}
function caricaLuoghi(){return fetch("/api/organi",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(j){var o=[];raccogli(j&&j.luoghi,"",o);LUOGHI=o}).catch(function(e){LERR=e.message}).then(render)}
function optLuoghi(){var gr={},ord=[];LUOGHI.forEach(function(l){var g=l.gruppo||"";if(!gr[g]){gr[g]=[];ord.push(g)}gr[g].push(l)});
  return ord.map(function(g){var o=gr[g].map(function(l){return'<option value="'+esc(l.id)+'">'+esc(l.nome)+'</option>'}).join("");return g?'<optgroup label="'+esc(g.replace(/_/g," "))+'">'+o+'</optgroup>':o}).join("")}
var R=new URLSearchParams(location.search).get("r"),tok=localStorage.getItem("estji_id_tok"),me=null,sso=null,tab="in",M=null,done=null;
function api(u,b){return fetch(u,{method:"POST",headers:Object.assign({"Content-Type":"application/json"},tok?{Authorization:"Bearer "+tok}:{}),body:JSON.stringify(b)}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok){var e=new Error(d.error||"Errore "+r.status);e.status=r.status;throw e}return d})})}
function msg(){return M?'<div class="m '+M[0]+'">'+esc(M[1])+'</div>':""}
function esci(){tok=null;me=null;sso=null;localStorage.removeItem("estji_id_tok")}
function carica(){
  if(!tok)return render();
  api("/api/estji",{azione:"profilo"}).then(function(d){me=d.profilo;return R?api("/api/estji",{azione:"info",id:R}).then(function(i){sso=i},function(e){sso=null;done=["bad",e.message]}):0}).catch(function(e){if(e.status===401)esci();else M=["bad",e.message]}).then(render);
}
function render(){
  var h="";
  if(R&&!done&&!me)h+='<div class="m">Per confermare l\'accesso al portale, accedi con la tua identità.</div>';
  if(!me){
    h+='<div class="row"><button class="'+(tab==="in"?"":"alt")+'" data-t="in">Accedi</button><button class="'+(tab==="reg"?"":"alt")+'" data-t="reg">Registrati</button></div><div class="p" style="margin-top:12px">';
    if(tab==="in")h+='<h2>Accedi</h2><label for="n">Nome in gioco</label><input id="n" autocomplete="username" value="'+esc(localStorage.getItem("estji_id_nick")||"")+'"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><button id="go">Accedi</button>';
    else h+='<h2>Nuova identità</h2><label for="n">Nome in gioco</label><input id="n" maxlength="16" autocomplete="off"><label for="d">Account Discord</label><input id="d" maxlength="40" autocomplete="off"><label for="s">Residenza</label>'+(LUOGHI&&LUOGHI.length?'<select id="s">'+optLuoghi()+'</select>':'<div class="m '+(LERR?"bad":"")+'">'+(LERR?"Impossibile caricare i luoghi: "+esc(LERR):LUOGHI?"Nessun luogo disponibile.":"Caricamento dei luoghi…")+'</div>')+'<label for="pw">Password</label><input id="pw" type="password" autocomplete="new-password"><label for="pw2">Ripeti la password</label><input id="pw2" type="password" autocomplete="new-password"><p class="mute">Cariche, ruoli e CUP li assegna il sistema. La verifica in gioco la conferma lo staff.</p><button id="reg"'+(LUOGHI&&LUOGHI.length?"":" disabled")+'>Crea identità</button>';
    $("#app").innerHTML=h+msg()+"</div><div id=\"inst\"></div>";bind();return;
  }
  if(R){
    h+='<div class="p"><h2>Richiesta di accesso</h2>';
    if(done)h+='<div class="m '+done[0]+'">'+esc(done[1])+'</div>';
    else if(sso){
      h+='<p>Vuoi accedere a <b>'+esc(sso.portale)+'</b>?<br><span class="mute">Richiesta da: '+esc(sso.da||"browser")+'</span></p><p class="mute">Il portale vedrà:</p><ul>'+sso.permessi.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul>';
      if(sso.numero)h+='<p><b>Scegli il numero che vedi sul PC.</b></p><div class="row">'+sso.numero.map(function(n){return'<button class="alt" data-n="'+n+'">'+n+'</button>'}).join("")+'</div>';
      else h+='<button id="ok" style="width:100%">Conferma accesso</button>';
      h+='<button class="alt" id="no" style="width:100%">Non sono io</button>';
    }else h+='<div class="m bad">Richiesta non trovata o scaduta: generane una nuova sul PC.</div>';
    h+='</div>';
  }
  h+='<div class="p"><h2>La mia carta d\'identità</h2><p class="mute">Dati e ruoli sono in sola lettura: li gestisce lo staff.</p>'+carta(me)+'<ul style="margin-top:12px"><li><span>CUP</span><b class="cup">'+esc(me.cup)+'</b></li><li><span>Iscritto dal</span><b>'+esc(me.iscritto)+'</b></li><li><span>Stato</span><b>'+(me.verificato?"Verificato":"In verifica")+'</b></li></ul></div>'+
   '<div class="p"><h2>Sicurezza</h2><label><input type="checkbox" id="tf" style="width:auto;margin-right:6px"'+(me.tf?" checked":"")+'>Verifica a due fattori attiva (livello 2)</label><h2 style="margin-top:16px">Cambia password</h2><label for="cp">Password attuale</label><input id="cp" type="password" autocomplete="current-password"><label for="n1">Nuova password</label><input id="n1" type="password" autocomplete="new-password"><label for="n2">Ripeti la nuova password</label><input id="n2" type="password" autocomplete="new-password"><button id="sv">Salva password</button>'+msg()+'</div><button class="alt" id="out">Esci</button><div id="inst"></div>';
  $("#app").innerHTML=h;bind();
}
function ask(fn){M=null;return fn().catch(function(e){M=["bad",e.message];if(e.status===401&&me){esci()}}).then(render)}
function bind(){
  var g=function(i){return document.getElementById(i)};aggInst();
  document.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){tab=b.getAttribute("data-t");M=null;render()}});
  if(g("go"))g("go").onclick=function(){ask(function(){return api("/api/estji",{azione:"accedi",nick:g("n").value,password:g("pw").value}).then(function(d){try{localStorage.setItem("estji_id_nick",g("n").value.trim())}catch(e){}tok=d.token;localStorage.setItem("estji_id_tok",tok);me=d.profilo;return R?api("/api/estji",{azione:"info",id:R}).then(function(i){sso=i},function(e){done=["bad",e.message]}):0})})};
  if(g("reg"))g("reg").onclick=function(){var lid=g("s")?g("s").value:"",lu=(LUOGHI||[]).filter(function(l){return l.id===lid})[0];if(!lu){M=["bad","Seleziona una residenza."];return render()}if(g("pw").value!==g("pw2").value){M=["bad","Le due password non coincidono."];return render()}
    ask(function(){return api("/api/estji",{azione:"registra",nick:g("n").value,discord:g("d").value,residenza:lu.id,residenzaNome:lu.nome,password:g("pw").value}).then(function(d){tab="in";M=["ok","Identità creata: "+d.id+" · CUP "+d.cup+". Ora puoi accedere."]})})};
  document.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){vista=b.getAttribute("data-v");render()}});
  if(g("tf"))g("tf").onchange=function(){ask(function(){return api("/api/estji",{azione:"tf",attiva:g("tf").checked}).then(function(d){me=d.profilo;M=["ok","Impostazione salvata."]})})};
  if(g("sv"))g("sv").onclick=function(){if(g("n1").value!==g("n2").value){M=["bad","Le due nuove password non coincidono."];return render()}
    ask(function(){return api("/api/estji",{azione:"cambia-password",attuale:g("cp").value,nuova:g("n1").value}).then(function(){M=["ok","Password aggiornata."]})})};
  if(g("out"))g("out").onclick=function(){esci();M=null;render()};
  var fin=function(a,extra){ask(function(){return api("/api/estji",Object.assign({azione:a,id:R},extra||{})).then(function(){done=a==="approva"?["ok","Fatto: torna al PC, l'accesso è confermato."]:["ok","Richiesta rifiutata: nessun accesso concesso."]},function(e){done=["bad",e.message]})})};
  if(g("ok"))g("ok").onclick=function(){fin("approva")};if(g("no"))g("no").onclick=function(){fin("rifiuta")};
  document.querySelectorAll("[data-n]").forEach(function(b){b.onclick=function(){fin("approva",{scelta:+b.getAttribute("data-n")})}});
}
caricaLuoghi();carica();
</script></body></html>
