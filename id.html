<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NomrAktiv — Redazione</title>
  <meta name="description" content="Area di redazione per creare e modificare gli atti normativi." />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="apple-touch-icon" href="NormAktiv.png">
  <link rel="icon" type="image/png" href="NormAktiv.png">

 <style>
  /* ---- UI di login (integrazione con lo stile del sito) ---- */
  .login-wrap {
    max-width: 440px;
    margin: 48px auto 80px;
    padding: 2rem 2rem 1.6rem;
    background: #ffffff;
    border: 1px solid var(--bordo, #d6e2ed);
    border-top: 5px solid var(--blu-700, #12508c);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(11,61,110,0.12);
    color: var(--inchiostro, #1f2a33);
  }
  .login-wrap h2 {
    margin: 0 0 0.3rem;
    font-family: var(--font-chrome, "Titillium Web", sans-serif);
    letter-spacing: 0.03em;
    font-size: 1.35rem;
    color: var(--blu-900, #0b1f38);
  }
  .login-wrap p.sottotitolo {
    margin: 0 0 1.2rem;
    color: var(--inchiostro-tenue, #4b5866);
    font-size: 0.88rem;
  }
  .login-wrap label {
    display: block;
    font-family: var(--font-chrome, "Titillium Web", sans-serif);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--blu-800, #0b3d6e);
    margin-bottom: 0.25rem;
  }
  .login-wrap input {
    width: 100%;
    padding: 0.7rem 0.85rem;
    margin-bottom: 0.9rem;
    background: #f5f9fd;
    border: 1px solid var(--bordo, #d6e2ed);
    color: var(--inchiostro, #1f2a33);
    border-radius: 4px;
    font-family: var(--font-chrome, "Titillium Web", sans-serif);
    font-size: 0.95rem;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .login-wrap input:focus {
    outline: none;
    border-color: var(--blu-accento, #2e77c9);
    box-shadow: 0 0 0 3px rgba(46,119,201,0.18);
  }
  .login-wrap button {
    width: 100%;
    padding: 0.8rem;
    background: var(--blu-700, #12508c);
    border: none;
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--font-chrome, "Titillium Web", sans-serif);
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    transition: background 0.15s ease;
  }
  .login-wrap button:hover:not(:disabled) { background: var(--blu-800, #0b3d6e); }
  .login-wrap button:disabled { opacity: 0.6; cursor: not-allowed; }
  .login-error {
    color: #a72e23;
    background: #fdeceb;
    border: 1px solid rgba(205,33,42,0.25);
    border-radius: 4px;
    font-size: 0.85rem;
    min-height: 1.2em;
    margin: 0.6rem 0 0;
    padding: 0.4rem 0.6rem;
    text-align: center;
    display: none;
  }
  .login-error.show { display: block; }

  /* ---- Barra di stato quando l'admin è loggato ---- */
  .admin-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin: 1.2rem 0 0.5rem;
    padding: 0.7rem 1rem;
    background: #e7f1fa;
    border-left: 4px solid var(--blu-700, #12508c);
    border-radius: 4px;
    font-family: var(--font-chrome, "Titillium Web", sans-serif);
    font-size: 0.88rem;
    color: var(--inchiostro, #1f2a33);
  }
  .admin-topbar strong { color: var(--blu-900, #0b1f38); }
  .admin-topbar button {
    background: transparent;
    border: 1px solid var(--blu-700, #12508c);
    color: var(--blu-700, #12508c);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    transition: all 0.15s ease;
  }
  .admin-topbar button:hover {
    background: var(--blu-700, #12508c);
    color: #fff;
  }

  /* ---- Accesso con Estji ID (QR) — tutto centrato ---- */
  .estji-blocco {
    text-align: center;
    margin: 0 0 1.4rem;
    padding-bottom: 1.2rem;
    border-bottom: 1px solid var(--bordo, #d6e2ed);
  }
  .estji-blocco h3 {
    margin: 0 0 0.3rem;
    font-family: var(--font-chrome, "Titillium Web", sans-serif);
    font-size: 1.05rem;
    letter-spacing: 0.03em;
    color: var(--blu-900, #0b1f38);
  }
  .estji-blocco p.sottotitolo { margin-bottom: 0.9rem; }
  #estji-login {
    display: flex;
    flex-direction: column;
    align-items: center;      /* QR al centro, non a sinistra */
    justify-content: center;
    gap: 0.5rem;
    text-align: center;
  }
  #estji-login > * { margin-left: auto; margin-right: auto; }
  #estji-login canvas,
  #estji-login img,
  #estji-login svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  #estji-login button { width: auto; padding: 0.5rem 1rem; font-size: 0.85rem; }
  .estji-oppure {
    margin: 1rem 0 0;
    font-family: var(--font-chrome, "Titillium Web", sans-serif);
    font-size: 0.82rem;
    color: var(--inchiostro-tenue, #4b5866);
  }
</style>
</head>
<body>
  <div id="testata-root"></div>

  <main class="container">

    <!-- ============================================================
         AREA DI LOGIN (visibile solo se non autenticato)
         ============================================================ -->
    <div id="login-area" style="display:none;">
      <div class="login-wrap">
        <h2>🔐 Accesso redazione</h2>

        <!-- Accesso con Estji ID: resta nascosto finché il backend non è pronto (vedi script in fondo) -->
        <div id="estji-blocco" class="estji-blocco" style="display:none;">
          <h3>Accedi con Estji ID</h3>
          <p class="sottotitolo">Inquadra il QR con il telefono e conferma l'accesso.</p>
          <div id="estji-login"></div>
          <p class="estji-oppure">oppure usa nome utente e password</p>
        </div>
        <p class="sottotitolo">Inserisci le credenziali per modificare gli atti.</p>

        <label for="adminUsername">Nome utente</label>
        <input type="text" id="adminUsername" placeholder="es. redazione"
               autocomplete="username" autocapitalize="off" spellcheck="false" />

        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="••••••••"
               autocomplete="current-password" />

        <button id="loginBtn" type="button">Accedi</button>

        <p class="login-error" id="loginError"></p>
      </div>
    </div>

    <!-- ============================================================
         AREA REDAZIONE (visibile solo se autenticato)
         ============================================================ -->
    <div id="admin-content" style="display:none;">
      <div class="admin-topbar">
        <span>👤 Connesso come <strong id="adminUsernameLabel">—</strong></span>
        <button id="logoutBtn" type="button">Esci</button>
      </div>
      <div id="redazione-root"></div>
    </div>

  </main>

  <div id="footer-root"></div>

  <script src="https://ews-rose.vercel.app/estji-login.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/formattazione.js"></script>
  <script src="assets/js/redazione.js"></script>

  <!-- Login con Estji ID: si attiva solo se api.js definisce API.loginEstji(id_token).
       Dopo l'accesso la pagina si ricarica: redazione.js trova la sessione e apre la redazione. -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var blocco = document.getElementById('estji-blocco');
      var err = document.getElementById('loginError');
      var pronto = blocco && typeof EstjiLogin !== 'undefined' &&
                   typeof API !== 'undefined' && typeof API.loginEstji === 'function';
      if (!pronto) return;                       // backend non ancora collegato: resta solo nome+password
      blocco.style.display = 'block';
      EstjiLogin.mount('#estji-login', {
        clientId: 'normaktiv',
        scopes: ['profile.basic', 'normaktiv.edit'],
        onLogin: async function (res) {
          err.classList.remove('show');
          try {
            var nome = await API.loginEstji(res.id_token);
            try { sessionStorage.setItem('fz_user', nome || ''); } catch (e) {}
            location.reload();
          } catch (e) {
            err.textContent = '❌ ' + (e.message || 'Accesso non riuscito');
            err.classList.add('show');
          }
        }
      });
    });
  </script>
</body>
</html>
