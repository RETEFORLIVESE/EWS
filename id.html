<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><link rel="manifest" href="id-manifest.webmanifest"><meta name="theme-color" content="#043a96"><link rel="apple-touch-icon" href="id-icon-512.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Estji ID"><title>Estji ID</title>
<style>
:root{--bg:#eaf0fb;--p:#fff;--ink:#0a1f44;--mute:#566684;--blue:#043a96;--blue2:#0a56d6;--line:#d3dcee;--ok:#0b7a4b;--bad:#b3261e;--gold:#b8921f;--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#050d20;--p:#0d1b3b;--ink:#e8eefc;--mute:#9aaccf;--blue:#6b97ff;--blue2:#8fb0ff;--line:#22365f;--ok:#4cd08f;--bad:#ff8a80;--gold:#e0b84a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{position:relative;background:linear-gradient(135deg,#032a6e,#043a96 55%,#0a56d6);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 22px;border-bottom:3px solid var(--gold)}
header h1{margin:0 auto;max-width:520px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:1.3rem;line-height:1.3;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:18px 16px calc(48px + env(safe-area-inset-bottom,0px))}
.p{background:var(--p);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
h2{margin:0 0 10px;font:700 1.1rem/1.3 "Helvetica Neue",Helvetica,Arial,sans-serif}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 5px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
button{margin-top:14px;padding:12px 16px;border:1px solid transparent;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer;min-height:44px;transition:background .15s,transform .1s}
@media(prefers-color-scheme:dark){button:not(.alt){color:#04112b}}
button:hover{background:var(--blue2)}button:active{transform:scale(.98)}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
button.alt{background:transparent;color:var(--blue);border-color:var(--blue)}
button.alt:hover{background:color-mix(in srgb,var(--blue) 12%,transparent)}
button#out{width:100%;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;margin-top:0}
.m{margin:12px 0;padding:10px 12px;border-left:4px solid var(--blue);background:var(--bg);border-radius:6px;font-size:.9rem}.m.ok{border-color:var(--ok)}.m.bad{border-color:var(--bad)}
ul{list-style:none;margin:0;padding:0}li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}li:last-child{border-bottom:0}
input[type=checkbox]{width:auto;margin-right:8px;accent-color:var(--blue);transform:scale(1.2)}
.card{position:relative;background:#f4f7fd;color:#0a1f44;border:1px solid #bfcbe6;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(4,58,150,.28),0 1px 0 #fff inset;margin:14px 0 8px;isolation:isolate;animation:rise .5s ease-out both}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-radial-gradient(circle at 85% 110%,transparent 0 7px,rgba(4,58,150,.06) 7px 8px),repeating-radial-gradient(circle at 10% -10%,transparent 0 9px,rgba(184,146,31,.07) 9px 10px)}
.card .ch{background:linear-gradient(135deg,#032a6e,#043a96 60%,#0a56d6);color:#fff;padding:13px 16px;border-bottom:3px solid #c9a227}
.card .ch b{display:block;font:700 1.02rem/1.2 "Helvetica Neue",Helvetica,Arial,sans-serif}.card .ch small{opacity:.85;font-size:.72rem}
.card .cb{display:flex;gap:16px;padding:16px;position:relative}
.card .av{flex:none;width:80px;height:100px;border-radius:10px;background:linear-gradient(160deg,#043a96,#3d6fd6);color:#fff;font-size:2.3rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 0 1px #bfcbe6,0 3px 8px rgba(0,0,0,.18)}
.card .av.sk{height:80px;background:#dfe7f7;overflow:hidden}
.card .av img{display:block;width:100%;height:100%;border-radius:8px;image-rendering:pixelated}
.card .cf{min-width:0;flex:1}.card .cf small{display:block;font-size:.68rem;color:#566684;margin-top:8px}.card .cf small:first-child{margin-top:0}
.card .cf b{display:block;font-size:.98rem;overflow-wrap:anywhere}
.card .dots{letter-spacing:2px;color:#566684;font-weight:400}
.card .mrz{background:#dfe7f7;border-top:1px dashed #9db0d6;font:700 .68rem ui-monospace,Menlo,monospace;padding:9px 12px;overflow:hidden;white-space:nowrap;color:#0a1f44}
.card .cb{overflow:hidden}
.card .cb::after{content:"";position:absolute;right:-48px;bottom:-48px;width:180px;height:180px;z-index:0;pointer-events:none;opacity:.22;background:url("USSEcoat.png") center/contain no-repeat}
.card .cf{position:relative;z-index:1}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:380px){.card .cb{gap:12px}.card .av{width:68px}.card .av.sk{height:68px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mute{color:var(--mute);font-size:.85rem}.cup{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--blue)}
</style></head><body>
<header><h1>Estji ID · Identità digitale USSE</h1></header><main id="app"></main>
<link rel="apple-touch-icon" href="id-icon-512.png">
<link rel="icon" type="image/png" href="id-icon-512.png">
<script>
var $=function(s){return document.querySelector(s)},esc=function(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var vista="pub",ip=null;
if("serviceWorker" in navigator)navigator.serviceWorker.register("id-sw.js").catch(function(){});
function risolvi(n){n=String(n||"").trim();if(!n)return Promise.resolve(null);var k="estji_uuid_"+n.toLowerCase();
  try{var c=localStorage.getItem(k);if(c)return Promise.resolve(JSON.parse(c))}catch(e){}
  return fetch("https://playerdb.co/api/player/minecraft/"+encodeURIComponent(n)).then(function(r){return r.json()}).then(function(j){var p=j&&j.success&&j.data&&j.data.player;if(!p)return null;var o={uuid:p.id,nome:p.username};try{localStorage.setItem(k,JSON.stringify(o))}catch(e){}return o}).catch(function(){return undefined})}
function uuidMc(){if(!me||me.uuid||me._ur)return;me._ur=1;risolvi(me.nick).then(function(r){if(r&&r.uuid&&me){me.uuid=r.uuid;render()}})}
function resid(m){return m.residenzaNome||m.residenza||((m.stato||"")+(m.sezione?" · "+m.sezione:""))}
function testa(m){var l=esc(String(m.nick||"?").charAt(0).toUpperCase()),k=m.uuid||m.nick;
  if(!k)return l;
  return'<img src="https://mc-heads.net/avatar/'+encodeURIComponent(k)+'/128" alt="'+esc(m.nick)+'" width="76" height="76" onerror="this.parentNode.classList.remove(\'sk\');this.outerHTML=\''+l+'\'">'}
function carta(m){
  var full=vista==="full",dots='<span class="dots">••••••••</span>',cl=function(t){return String(t==null?"":t).toUpperCase().replace(/[^A-Z0-9]+/g,"<")};
  var mrz="P<EST<"+cl(m.nick)+"<<<"+cl(m.id)+"<<"+String(m.iscritto||"").replace(/\D/g,"");
  return'<div class="row" style="margin-top:6px"><button class="'+(full?"alt":"")+'" data-v="pub">Dati nascosti</button><button class="'+(full?"":"alt")+'" data-v="full">Dati completi</button></div>'+
  '<div class="card"><div class="ch"><b>USSE · Carta d\'Identità</b><small>Union der Wohlfartsstaaten von Estji</small></div><div class="cb"><div class="av sk">'+testa(m)+'</div><div class="cf">'+
  '<small>Nome in gioco</small><b>'+esc(m.nick)+'</b><small>ID Estji</small><b>'+esc(m.id)+'</b><small>Residenza elettorale</small><b>'+esc(resid(m))+'</b><small>Cariche e ruoli</small><b>'+esc((m.ruoli||[]).join(", ")||"Nessuna")+'</b>'+
  '<small>Discord</small><b>'+(full&&m.discord?esc(m.discord):dots)+'</b><small>UUID di gioco</small><b>'+(full&&m.uuid?esc(m.uuid):dots)+'</b></div>'+'</div><div class="mrz">'+esc(mrz)+'</div></div>'}
var LUOGHI=null,LERR=null;
function eVoce(v){return typeof v==="string"||(v&&typeof v==="object"&&typeof v.nome==="string")}
function raccogli(c,g,out){Object.keys(c||{}).forEach(function(k){var v=c[k];if(eVoce(v))out.push({id:k,nome:typeof v==="string"?v:v.nome,gruppo:g});else if(v&&typeof v==="object")raccogli(v,g||k,out)})}
function caricaLuoghi(){return fetch("/api/organi",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(j){var o=[];raccogli(j&&j.luoghi,"",o);LUOGHI=o}).catch(function(e){LERR=e.message}).then(render)}
function optLuoghi(){var gr={},ord=[];LUOGHI.forEach(function(l){var g=l.gruppo||"";if(!gr[g]){gr[g]=[];ord.push(g)}gr[g].push(l)});
  return ord.map(function(g){var o=gr[g].map(function(l){return'<option value="'+esc(l.id)+'">'+esc(l.nome)+'</option>'}).join("");return g?'<optgroup label="'+esc(g.replace(/_/g," "))+'">'+o+'</optgroup>':o}).join("")}
var R=new URLSearchParams(location.search).get("r"),tok=localStorage.getItem("estji_id_tok"),me=null,sso=null,tab="in",M=null,done=null;
function api(u,b){return fetch(u,{method:"POST",headers:Object.assign({"Content-Type":"application/json"},tok?{Authorization:"Bearer "+tok}:{}),body:JSON.stringify(b)}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok){var e=new Error(d.error||"Errore "+r.status);e.status=r.status;throw e}return d})})}
function msg(){return M?'<div class="m '+M[0]+'">'+esc(M[1])+'</div>':""}
function esci(){tok=null;me=null;sso=null;localStorage.removeItem("estji_id_tok")}
function carica(){
  if(!tok)return render();
  api("/api/estji",{azione:"profilo"}).then(function(d){me=d.profilo;return R?api("/api/estji",{azione:"info",id:R}).then(function(i){sso=i},function(e){sso=null;done=["bad",e.message]}):0}).catch(function(e){if(e.status===401)esci();else M=["bad",e.message]}).then(render);
}
function render(){uuidMc();
  var h="";
  if(R&&!done&&!me)h+='<div class="m">Per confermare l\'accesso al portale, accedi con la tua identità.</div>';
  if(!me){
    h+='<div class="row"><button class="'+(tab==="in"?"":"alt")+'" data-t="in">Accedi</button><button class="'+(tab==="reg"?"":"alt")+'" data-t="reg">Registrati</button></div><div class="p" style="margin-top:12px">';
    if(tab==="in")h+='<label for="n">Nome in gioco</label><input id="n" autocomplete="username" value="'+esc(localStorage.getItem("estji_id_nick")||"")+'"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><button id="go">Accedi</button>';
    else h+='<label for="n">Nome in gioco</label><input id="n" maxlength="16" autocomplete="off"><label for="d">Account Discord</label><input id="d" maxlength="40" autocomplete="off"><label for="s">Residenza</label>'+(LUOGHI&&LUOGHI.length?'<select id="s">'+optLuoghi()+'</select>':'<div class="m '+(LERR?"bad":"")+'">'+(LERR?"Impossibile caricare i luoghi: "+esc(LERR):LUOGHI?"Nessun luogo disponibile.":"Caricamento dei luoghi…")+'</div>')+'<label for="pw">Password</label><input id="pw" type="password" autocomplete="new-password"><label for="pw2">Ripeti la password</label><input id="pw2" type="password" autocomplete="new-password"><button id="reg"'+(LUOGHI&&LUOGHI.length?"":" disabled")+'>Crea identità</button>';
    $("#app").innerHTML=h+msg()+"</div>";bind();return;
  }
  if(R){
    h+='<div class="p"><h2>Richiesta di accesso</h2>';
    if(done)h+='<div class="m '+done[0]+'">'+esc(done[1])+'</div>';
    else if(sso){
      h+='<p>Vuoi accedere a <b>'+esc(sso.portale)+'</b>?<br><span class="mute">Richiesta da: '+esc(sso.da||"browser")+'</span></p><p class="mute">Il portale vedrà:</p><ul>'+sso.permessi.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul>';
      if(sso.numero)h+='<p><b>Scegli il numero che vedi sul PC.</b></p><div class="row">'+sso.numero.map(function(n){return'<button class="alt" data-n="'+n+'">'+n+'</button>'}).join("")+'</div>';
      else h+='<button id="ok" style="width:100%">Conferma accesso</button>';
      h+='<button class="alt" id="no" style="width:100%">Non sono io</button>';
    }else h+='<div class="m bad">Richiesta non trovata o scaduta: generane una nuova sul PC.</div>';
    h+='</div>';
  }
  h+='<div class="p">'+carta(me)+'<ul style="margin-top:12px"><li><span>CUP</span><b class="cup">'+esc(me.cup)+'</b></li><li><span>Iscritto dal</span><b>'+esc(me.iscritto)+'</b></li><li><span>Stato</span><b>'+(me.verificato?"Verificato":"In verifica")+'</b></li></ul></div>'+
   '<div class="p"><h2>Sicurezza</h2><label><input type="checkbox" id="tf" style="width:auto;margin-right:6px"'+(me.tf?" checked":"")+'>Verifica a due fattori attiva (livello 2)</label><h2 style="margin-top:16px">Cambia password</h2><label for="cp">Password attuale</label><input id="cp" type="password" autocomplete="current-password"><label for="n1">Nuova password</label><input id="n1" type="password" autocomplete="new-password"><label for="n2">Ripeti la nuova password</label><input id="n2" type="password" autocomplete="new-password"><button id="sv">Salva password</button>'+msg()+'</div><button class="alt" id="out">Esci</button>';
  $("#app").innerHTML=h;bind();
}
function ask(fn){M=null;return fn().catch(function(e){M=["bad",e.message];if(e.status===401&&me){esci()}}).then(render)}
function bind(){
  var g=function(i){return document.getElementById(i)};
  document.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){tab=b.getAttribute("data-t");M=null;render()}});
  if(g("go"))g("go").onclick=function(){ask(function(){return api("/api/estji",{azione:"accedi",nick:g("n").value,password:g("pw").value}).then(function(d){try{localStorage.setItem("estji_id_nick",g("n").value.trim())}catch(e){}tok=d.token;localStorage.setItem("estji_id_tok",tok);me=d.profilo;return R?api("/api/estji",{azione:"info",id:R}).then(function(i){sso=i},function(e){done=["bad",e.message]}):0})})};
  if(g("reg"))g("reg").onclick=function(){var lid=g("s")?g("s").value:"",lu=(LUOGHI||[]).filter(function(l){return l.id===lid})[0];if(!lu){M=["bad","Seleziona una residenza."];return render()}if(g("pw").value!==g("pw2").value){M=["bad","Le due password non coincidono."];return render()}
    ask(function(){return risolvi(g("n").value).then(function(r){if(r===null)throw new Error("Questo nome non esiste su Minecraft Java.");return api("/api/estji",{azione:"registra",nick:r?r.nome:g("n").value,uuid:r?r.uuid:undefined,discord:g("d").value,residenza:lu.id,residenzaNome:lu.nome,password:g("pw").value})}).then(function(d){tab="in";M=["ok","Identità creata: "+d.id+" · CUP "+d.cup+". Ora puoi accedere."]})})};
  document.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){vista=b.getAttribute("data-v");render()}});
  if(g("tf"))g("tf").onchange=function(){ask(function(){return api("/api/estji",{azione:"tf",attiva:g("tf").checked}).then(function(d){me=d.profilo;M=["ok","Impostazione salvata."]})})};
  if(g("sv"))g("sv").onclick=function(){if(g("n1").value!==g("n2").value){M=["bad","Le due nuove password non coincidono."];return render()}
    ask(function(){return api("/api/estji",{azione:"cambia-password",attuale:g("cp").value,nuova:g("n1").value}).then(function(){M=["ok","Password aggiornata."]})})};
  if(g("out"))g("out").onclick=function(){esci();M=null;render()};
  var fin=function(a,extra){ask(function(){return api("/api/estji",Object.assign({azione:a,id:R},extra||{})).then(function(){done=a==="approva"?["ok","Fatto: torna al PC, l'accesso è confermato."]:["ok","Richiesta rifiutata: nessun accesso concesso."]},function(e){done=["bad",e.message]})})};
  if(g("ok"))g("ok").onclick=function(){fin("approva")};if(g("no"))g("no").onclick=function(){fin("rifiuta")};
  document.querySelectorAll("[data-n]").forEach(function(b){b.onclick=function(){fin("approva",{scelta:+b.getAttribute("data-n")})}});
}
caricaLuoghi();carica();
</script></body></html>
