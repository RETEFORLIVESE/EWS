function msgS(k){return MS&&MS[2]===k?'<div class="m '+MS[0]+'">'+esc(MS[1])+'</div>':""}
function askS(k,fn){MS=null;return fn().catch(function(e){MS=["bad",e.message,k];if(e.status===401&&me)esci()}).then(render)}
function servizi(m){
  var h='<details class="p" data-d="res"'+ap('res')+'><summary>Cambio di residenza</summary><p class="mute">Attuale: <b>'+esc(resid(m))+'</b>'+(m.indirizzo?' · '+esc(m.indirizzo):'')+(statoDi(m)?' · Stato sociale: '+esc(statoDi(m)):'')+'</p>';
  if(LUOGHI&&LUOGHI.length)h+='<label for="rs">Nuova residenza</label><select id="rs">'+optLuoghi(m.residenza)+'</select><label for="rind">Indirizzo di residenza</label><input id="rind" maxlength="80" autocomplete="off" value="'+esc(m.indirizzo||"")+'"><button id="rsv">Aggiorna residenza</button>';
  else h+='<div class="m '+(LERR?"bad":"")+'">'+(LERR?"Impossibile caricare i luoghi: "+esc(LERR):"Caricamento dei luoghi…")+'</div>';
  h+=msgS('res')+'</details><details class="p" data-d="rin"'+ap('rin')+'><summary>Rinnovo documenti</summary><p class="mute">Ogni documento vale 365 giorni dal rilascio. Rinnovando, la nuova validità parte da oggi.</p><ul>'+DOCS.map(function(d){return'<li><span><b>'+esc(d[1])+'</b><br><span class="mute">'+esc(sca(m,d[2]))+'</span></span><button class="alt" style="margin:0" data-rin="'+d[0]+'">Rinnova</button></li>'}).join("")+'</ul>'+msgS('rin')+'</details>';
  return h}
function esci(){MS=null;tok=null;me=null;sso=null;localStorage.removeItem("estji_id_tok")}
function carica(){
  if(!tok)return render();
  api("/api/estji",{azione:"profilo"}).then(function(d){me=d.profilo;return R?api("/api/estji",{azione:"info",id:R}).then(function(i){sso=i},function(e){sso=null;done=["bad",e.message]}):0}).catch(function(e){if(e.status===401)esci();else M=["bad",e.message]}).then(render);
}
function render(){uuidMc();
  var h="";
  if(R&&!done&&!me)h+='<div class="m">Per confermare l\'accesso al portale, accedi con la tua identità.</div>';
  if(!me){
    h+='<div class="row"><button class="'+(tab==="in"?"":"alt")+'" data-t="in">Accedi</button><button class="'+(tab==="reg"?"":"alt")+'" data-t="reg">Registrati</button></div><div class="p" style="margin-top:12px">';
    if(tab==="in")h+=qrBlocco()+'<label for="n">Nome in gioco</label><input id="n" autocomplete="username" value="'+esc(localStorage.getItem("estji_id_nick")||"")+'"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><button id="go">Accedi</button>';
    else h+='<label for="n">Nome in gioco</label><input id="n" maxlength="16" autocomplete="off"><label for="d">Account Discord</label><input id="d" maxlength="40" autocomplete="off"><label for="s">Residenza</label>'+(LUOGHI&&LUOGHI.length?'<select id="s">'+optLuoghi()+'</select>':'<div class="m '+(LERR?"bad":"")+'">'+(LERR?"Impossibile caricare i luoghi: "+esc(LERR):LUOGHI?"Nessun luogo disponibile.":"Caricamento dei luoghi…")+'</div>')+'<label for="ind">Indirizzo di residenza</label><input id="ind" maxlength="80" autocomplete="off"><label for="dg">Delegazione</label><select id="dg">'+optUE()+'</select><label for="pw">Password</label><input id="pw" type="password" autocomplete="new-password"><label for="pw2">Ripeti la password</label><input id="pw2" type="password" autocomplete="new-password"><button id="reg"'+(LUOGHI&&LUOGHI.length?"":" disabled")+'>Crea identità</button>';
    $("#app").innerHTML=h+msg()+"</div>";bind();return;
  }
  if(R){
    h+='<div class="p"><h2>Richiesta di accesso</h2>';
    if(done)h+='<div class="m '+done[0]+'">'+esc(done[1])+'</div>';
    else if(sso){
      h+='<p>Vuoi accedere a <b>'+esc(sso.portale)+'</b>?<br><span class="mute">Richiesta da: '+esc(sso.da||"browser")+'</span></p><p class="mute">Il portale vedrà:</p><ul>'+sso.permessi.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul>';
      if(sso.numero)h+='<p><b>Scegli il numero che vedi sul PC.</b></p><div class="row">'+sso.numero.map(function(n){return'<button class="alt" data-n="'+n+'">'+n+'</button>'}).join("")+'</div>';
      else h+='<button id="ok" style="width:100%">Conferma accesso</button>';
      h+='<button class="alt" id="no" style="width:100%">Non sono io</button>';
    }else h+='<div class="m bad">Richiesta non trovata o scaduta: generane una nuova sul PC.</div>';
    h+='</div>';
  }
  h+=scanBtn();
  h+='<div class="p">'+wallet(me)+'</div>'+servizi(me)+
   '<div class="p"><h2>Sicurezza</h2><label><input type="checkbox" id="tf" style="width:auto;margin-right:6px"'+(me.tf?" checked":"")+'>Verifica a due fattori attiva (livello 2)</label><details class=\"sub\" data-d=\"pw\"'+ap('pw')+'><summary>Cambia password</summary><label for=\"cp\">Password attuale</label><input id=\"cp\" type=\"password\" autocomplete=\"current-password\"><label for=\"n1\">Nuova password</label><input id=\"n1\" type=\"password\" autocomplete=\"new-password\"><label for=\"n2\">Ripeti la nuova password</label><input id=\"n2\" type=\"password\" autocomplete=\"new-password\"><button id="sv">Salva password</button></details>'+msg()+'</div><button class="alt" id="out">Esci</button>';
  $("#app").innerHTML=h;bind();
}
function ask(fn){M=null;return fn().catch(function(e){M=["bad",e.message];if(e.status===401&&me){esci()}}).then(render)}
function bind(){
  var g=function(i){return document.getElementById(i)};
  qrAccesso();document.querySelectorAll("[data-scan]").forEach(function(b){b.onclick=scansiona});
  document.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){tab=b.getAttribute("data-t");M=null;render()}});
  if(g("go"))g("go").onclick=function(){ask(function(){return api("/api/estji",{azione:"accedi",nick:g("n").value,password:g("pw").value}).then(function(d){try{localStorage.setItem("estji_id_nick",g("n").value.trim())}catch(e){}tok=d.token;localStorage.setItem("estji_id_tok",tok);me=d.profilo;return R?api("/api/estji",{azione:"info",id:R}).then(function(i){sso=i},function(e){done=["bad",e.message]}):0})})};
  if(g("reg"))g("reg").onclick=function(){var lid=g("s")?g("s").value:"",lu=(LUOGHI||[]).filter(function(l){return l.id===lid})[0];if(!lu){M=["bad","Seleziona una residenza."];return render()}if(g("pw").value!==g("pw2").value){M=["bad","Le due password non coincidono."];return render()}
    ask(function(){return risolvi(g("n").value).then(function(r){if(r===null)throw new Error("Questo nome non esiste su Minecraft Java.");return api("/api/estji",{azione:"registra",nick:r?r.nome:g("n").value,uuid:r?r.uuid:undefined,discord:g("d").value,delegazione:g("dg").value,residenza:lu.id,residenzaNome:lu.nome,indirizzo:g("ind").value,password:g("pw").value})}).then(function(d){tab="in";M=["ok","Identità creata: "+d.id+" · CUP "+d.cup+". Ora puoi accedere."]})})};
  document.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){vista=b.getAttribute("data-v");render()}});
  if(g("tf"))g("tf").onchange=function(){ask(function(){return api("/api/estji",{azione:"tf",attiva:g("tf").checked}).then(function(d){me=d.profilo;M=["ok","Impostazione salvata."]})})};
  if(g("sv"))g("sv").onclick=function(){if(g("n1").value!==g("n2").value){M=["bad","Le due nuove password non coincidono."];return render()}
    ask(function(){return api("/api/estji",{azione:"cambia-password",attuale:g("cp").value,nuova:g("n1").value}).then(function(){M=["ok","Password aggiornata."]})})};
  document.querySelectorAll("details[data-d]").forEach(function(d){d.addEventListener("toggle",function(){OPEN[d.getAttribute("data-d")]=d.open})});
  if(g("rsv"))g("rsv").onclick=function(){askS("res",function(){return api("/api/estji",{azione:"cambia-residenza",residenza:g("rs").value,indirizzo:g("rind").value}).then(function(d){me=d.profilo;MS=["ok","Residenza aggiornata.","res"]})})};
  document.querySelectorAll("[data-rin]").forEach(function(b){b.onclick=function(){var k=b.getAttribute("data-rin");askS("rin",function(){return api("/api/estji",{azione:"rinnova",documento:k}).then(function(d){me=d.profilo;var x=DOCS.filter(function(z){return z[0]===k})[0];MS=["ok",x[1]+" rinnovata. "+sca(me,x[2])+".","rin"]})})}});
  if(g("out"))g("out").onclick=function(){esci();M=null;render()};
  var fin=function(a,extra){ask(function(){return api("/api/estji",Object.assign({azione:a,id:R},extra||{})).then(function(){done=a==="approva"?["ok","Fatto: torna al PC, l'accesso è confermato."]:["ok","Richiesta rifiutata: nessun accesso concesso."]},function(e){done=["bad",e.message]})})};
  if(g("ok"))g("ok").onclick=function(){fin("approva")};if(g("no"))g("no").onclick=function(){fin("rifiuta")};
  document.querySelectorAll("[data-n]").forEach(function(b){b.onclick=function(){fin("approva",{scelta:+b.getAttribute("data-n")})}});
}
/* ---- Accesso con QR (mostra il QR) + scanner (bottone Scansiona) ---- */
function scanBtn(){return'<button data-scan style="width:100%;margin:0 0 16px">Scansiona QR</button>'}
function qrBlocco(){return(typeof EstjiLogin!=="undefined"&&!R)?'<div class="qrb"><h2>Accedi con l\'app Estji ID</h2><p class="mute">Sul telefono apri l\'app, premi <b>Scansiona</b> e inquadra questo QR.</p><div id="qrslot"></div><p class="mute">Hai un QR da confermare?</p><button class="alt" data-scan style="width:100%;margin-top:0">Scansiona un QR</button><p class="oppure">oppure usa nome e password</p></div>':""}
var qrBox=null,qrT=0;
function qrAccesso(){var s=document.getElementById("qrslot");if(!s||typeof EstjiLogin==="undefined")return;
  if(qrBox&&Date.now()-qrT<100000){s.appendChild(qrBox);return}
  qrBox=document.createElement("div");qrBox.id="estji-login";qrT=Date.now();s.appendChild(qrBox);
  EstjiLogin.mount("#estji-login",{clientId:"id",scopes:["id.session"],onLogin:function(r){qrBox=null;
    api("/api/estji",{azione:"accedi-qr",id_token:r&&r.id_token}).then(function(d){tok=d.token;localStorage.setItem("estji_id_tok",tok);M=null;carica()},function(e){M=["bad",e.message];render()})}})}
var SC=null;
function idDaQr(t){t=String(t||"").trim();var m=null;try{m=new URL(t,location.href).searchParams.get("r")}catch(e){}m=m||t;return/^[A-Za-z0-9_-]{20,32}$/.test(m)?m:null}
function scanStato(t){var e=document.getElementById("scs");if(e)e.textContent=t}
function scanStop(){if(SC){SC.on=false;clearTimeout(SC.tm);if(SC.stream)SC.stream.getTracks().forEach(function(t){t.stop()});SC=null}
  var o=document.getElementById("scn"),v=document.getElementById("scv");if(o)o.hidden=true;if(v)v.srcObject=null}
function jsQRcarica(){if(window.jsQR)return Promise.resolve();return new Promise(function(ok,ko){var e=document.createElement("script");e.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";e.onload=ok;e.onerror=function(){ko(new Error("Lettore QR non disponibile: controlla la connessione."))};document.head.appendChild(e)})}
function apriRichiesta(id){R=id;done=null;sso=null;M=null;tab="in";try{history.replaceState(null,"","?r="+encodeURIComponent(id))}catch(e){}carica()}
function scansiona(){
  if(SC)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){M=["bad","Fotocamera non disponibile: apri Estji ID da un telefono, in HTTPS."];return render()}
  var o=document.getElementById("scn"),v=document.getElementById("scv"),det=null;
  try{if("BarcodeDetector" in window)det=new BarcodeDetector({formats:["qr_code"]})}catch(e){det=null}
  var cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  SC={on:true};o.hidden=false;scanStato("Avvio fotocamera…");
  (det?Promise.resolve():jsQRcarica()).then(function(){return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})}).then(function(st){
    if(!SC){st.getTracks().forEach(function(t){t.stop()});return}
    SC.stream=st;v.srcObject=st;return v.play().then(function(){scanStato("Inquadra il QR mostrato sul PC");giro()})
  }).catch(function(e){scanStop();M=["bad",e&&e.name==="NotAllowedError"?"Permesso alla fotocamera negato: abilitalo dalle impostazioni del browser.":(e&&e.message)||"Impossibile avviare la fotocamera."];render()});
  function giro(){if(!SC||!SC.on)return;var p;
    if(det)p=det.detect(v).then(function(r){return r&&r[0]?r[0].rawValue:null});
    else if(!v.videoWidth)p=Promise.resolve(null);
    else{var k=Math.min(1,640/v.videoWidth);cv.width=Math.round(v.videoWidth*k);cv.height=Math.round(v.videoHeight*k);cx.drawImage(v,0,0,cv.width,cv.height);var im=cx.getImageData(0,0,cv.width,cv.height),q=window.jsQR(im.data,im.width,im.height,{inversionAttempts:"dontInvert"});p=Promise.resolve(q?q.data:null)}
    p.catch(function(){return null}).then(function(t){if(!SC||!SC.on)return;
      if(t){var id=idDaQr(t);if(id){scanStop();apriRichiesta(id);return}scanStato("QR non riconosciuto: inquadra quello di Estji ID.")}
      SC.tm=setTimeout(giro,160)})}
}
document.getElementById("scx").onclick=scanStop;
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&SC)scanStop()});
caricaLuoghi();carica();
</script></body></html>
