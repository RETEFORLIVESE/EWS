<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CTSU — Redazione</title>
  <meta name="description" content="Area di redazione per creare e modificare i progetti tecnici." />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="apple-touch-icon" href="CTSU.png">
  <link rel="icon" type="image/png" href="CTSU.png">

  <style>
  /* ---- Area di accesso ("Utenza") ---- */
  .login-wrap {
    max-width: 420px; margin: 56px auto 80px; padding: 2.2rem 2rem 1.8rem;
    background: #ffffff; border: 1px solid var(--bordo, #d6e2ed);
    border-radius: 14px; text-align: center;
    box-shadow: 0 18px 40px rgba(11,61,110,0.14);
    color: var(--inchiostro, #1f2a33);
  }
  .login-wrap__icona {
    width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 1.6rem;
    background: linear-gradient(135deg, var(--blu-700, #12508c), var(--blu-900, #0b1f38));
    box-shadow: 0 8px 18px rgba(11,61,110,0.3);
  }
  .login-wrap h2 { margin: 0 0 0.25rem; font-family: var(--font-chrome, "Titillium Web", sans-serif); letter-spacing: 0.02em; font-size: 1.3rem; color: var(--blu-900, #0b1f38); }
  .login-wrap p.sottotitolo { margin: 0 0 1.5rem; color: var(--inchiostro-tenue, #4b5866); font-size: 0.88rem; }
  .login-wrap .campo { text-align: left; margin-bottom: 1rem; }
  .login-wrap label { display: block; font-family: var(--font-chrome, "Titillium Web", sans-serif); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--blu-800, #0b3d6e); margin-bottom: 0.3rem; }
  .login-wrap input {
    width: 100%; padding: 0.75rem 0.9rem; background: #f5f9fd;
    border: 1.5px solid var(--bordo, #d6e2ed); color: var(--inchiostro, #1f2a33);
    border-radius: 8px; font-family: var(--font-chrome, "Titillium Web", sans-serif);
    font-size: 0.95rem; transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .login-wrap input:focus {
    outline: none; border-color: var(--blu-accento, #2e77c9); background: #fff;
    box-shadow: 0 0 0 4px rgba(46,119,201,0.15);
  }
  .login-wrap button {
    width: 100%; margin-top: 0.4rem; padding: 0.85rem; border: none; border-radius: 8px;
    background: linear-gradient(135deg, var(--blu-700, #12508c), var(--blu-800, #0b3d6e));
    color: #fff; cursor: pointer; font-family: var(--font-chrome, "Titillium Web", sans-serif);
    font-weight: 700; font-size: 0.95rem; letter-spacing: 0.03em;
    box-shadow: 0 8px 20px rgba(11,61,110,0.25);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .login-wrap button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(11,61,110,0.32); }
  .login-wrap button:active:not(:disabled) { transform: translateY(0); }
  .login-wrap button:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
  .login-error {
    color: #a72e23; background: #fdeceb; border: 1px solid rgba(205,33,42,0.25);
    border-radius: 8px; font-size: 0.85rem; min-height: 1.2em; margin: 0.9rem 0 0;
    padding: 0.5rem 0.7rem; text-align: center; display: none;
  }
  .login-error.show { display: block; }

  /* ---- Barra utente quando si è connessi ---- */
  .admin-topbar {
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    margin: 1.4rem 0 0.6rem; padding: 0.65rem 1rem 0.65rem 0.65rem;
    background: linear-gradient(90deg, #e7f1fa, #f3f8fd);
    border: 1px solid rgba(11,61,110,0.12); border-radius: 999px;
    font-family: var(--font-chrome, "Titillium Web", sans-serif); font-size: 0.88rem;
    color: var(--inchiostro, #1f2a33);
  }
  .admin-topbar__utente { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
  .admin-topbar__avatar {
    flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--blu-700, #12508c), var(--blu-900, #0b1f38));
    color: #fff; font-weight: 700; font-size: 0.9rem; text-transform: uppercase;
  }
  .admin-topbar__testo { display: flex; flex-direction: column; line-height: 1.2; overflow: hidden; }
  .admin-topbar__etichetta { font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--inchiostro-tenue, #4b5866); }
  .admin-topbar strong { color: var(--blu-900, #0b1f38); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .admin-topbar button {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
    background: #fff; border: 1px solid var(--blu-700, #12508c); color: var(--blu-700, #12508c);
    padding: 7px 16px; border-radius: 999px; cursor: pointer; font-family: inherit;
    font-size: 0.82rem; font-weight: 700; transition: background .15s ease, color .15s ease;
  }
  .admin-topbar button:hover { background: var(--blu-700, #12508c); color: #fff; }
  </style>
</head>
<body>
  <div id="testata-root"></div>

  <main class="container">
    <div id="login-area" style="display:none;">
      <div class="login-wrap">
        <div class="login-wrap__icona" aria-hidden="true">🔐</div>
        <h2>Accesso redazione CTSU</h2>
        <p class="sottotitolo">Inserisci le credenziali per modificare i progetti.</p>
        <div class="campo">
          <label for="adminUsername">Nome utente</label>
          <input type="text" id="adminUsername" placeholder="es. redazione" autocomplete="username" autocapitalize="off" spellcheck="false" />
        </div>
        <div class="campo">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button id="loginBtn" type="button">Accedi</button>
        <p class="login-error" id="loginError"></p>
      </div>
    </div>

    <div id="admin-content" style="display:none;">
      <div class="admin-topbar">
        <div class="admin-topbar__utente">
          <span class="admin-topbar__avatar" id="adminAvatar">?</span>
          <span class="admin-topbar__testo">
            <span class="admin-topbar__etichetta">Connesso come</span>
            <strong id="adminUsernameLabel">—</strong>
          </span>
        </div>
        <button id="logoutBtn" type="button">↩ Esci</button>
      </div>
      <div id="redazione-root"></div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="assets/js/ctsu-core.js"></script>
  <script src="assets/js/redazione-ctsu.js"></script>
</body>
</html>
