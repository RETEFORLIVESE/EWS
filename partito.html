<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASDDSA</title>
<style>
:root{--pc:#8e1b2e;--pc2:#b3263c;--bg:#faf6f6;--p:#fff;--ink:#2a1015;--mute:#6f5559;--line:#ead9db;--ok:#0b7a4b;--bad:#b3261e;--gold:#b8921f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme=light]){color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--pc:#e0687c;--pc2:#f08a9b;--bg:#190a0d;--p:#26121a;--ink:#f7e8ea;--mute:#c4a3a8;--line:#43252b}}
:root[data-theme=dark]{--pc:#e0687c;--pc2:#f08a9b;--bg:#190a0d;--p:#26121a;--ink:#f7e8ea;--mute:#c4a3a8;--line:#43252b}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Helvetica Neue",Helvetica,Arial,sans-serif}
a{color:var(--pc)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--p);border-bottom:1px solid var(--line)}
nav b{flex:1;display:flex;align-items:center;gap:8px;color:var(--pc)}nav a{text-decoration:none;font-size:.9rem;font-weight:600}
.hero{background:linear-gradient(135deg,#5e0f1e,#8e1b2e 55%,#b3263c);color:#fff;padding:56px 20px 64px;text-align:center;border-bottom:4px solid var(--gold)}
.hero h1{margin:0 0 10px;font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.15}.hero p{max-width:560px;margin:0 auto 22px;opacity:.92}
.btn{display:inline-block;padding:12px 22px;border-radius:8px;border:1px solid transparent;background:var(--pc);color:#fff;font:600 1rem inherit;text-decoration:none;cursor:pointer;min-height:44px}
.btn:hover{background:var(--pc2)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.w{background:#fff;color:#8e1b2e}.btn.alt{background:transparent;color:var(--pc);border-color:var(--pc)}
main{max-width:820px;margin:0 auto;padding:28px 16px 56px}section{margin-bottom:34px}h2{margin:0 0 12px;font-size:1.4rem}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.p{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:18px}.p h3{margin:0 0 6px;font-size:1.05rem;color:var(--pc)}.p p{margin:0}
.mute{color:var(--mute);font-size:.9rem}.m{margin:12px 0;padding:10px 12px;border-left:4px solid var(--pc);background:var(--bg);border-radius:6px;font-size:.92rem}.m.ok{border-color:var(--ok)}.m.bad{border-color:var(--bad)}
#estji-login{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin:14px 0}
#estji-login canvas,#estji-login img,#estji-login svg{display:block;margin:0 auto;max-width:100%;height:auto;background:#fff;padding:10px;border-radius:10px}
label.c{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:.92rem}label.c input{margin-top:4px;accent-color:var(--pc);transform:scale(1.2)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
/* tessera (stesso disegno che compare su id.html) */
.wal{container-type:inline-size;max-width:440px;margin:16px auto}
.wc{position:relative;height:63.05cqw;border-radius:3.6cqw;overflow:hidden;border:1px solid #e3b5bc;background:#fff6f7;color:#2a1015;box-shadow:0 .8cqw 2.4cqw rgba(90,10,25,.25);isolation:isolate}
.wc .h{height:11cqw;display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:0 4cqw;color:#fff;border-bottom:.7cqw solid #fff;background:linear-gradient(135deg,color-mix(in srgb,var(--cc,#8e1b2e) 65%,#000),var(--cc,#8e1b2e))}
.wc .h b{font-size:4.1cqw}.wc .h small{font-size:2.2cqw;opacity:.85}
.wc .bd{padding:4cqw;display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw 3cqw}.wc .bd small{display:block;font-size:2.2cqw;color:#6f5559}.wc .bd b{font-size:3.3cqw;line-height:1.25;overflow-wrap:anywhere}.wc .s2{grid-column:1/-1}
.wc .mrz{position:absolute;left:0;right:0;bottom:0;height:5.5cqw;display:flex;align-items:center;padding:0 3cqw;font:700 2.1cqw ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;background:#f6e1e4;border-top:1px dashed #dcaab2}
.wc.rev{filter:grayscale(1);opacity:.7}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<nav><b><svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M50 6l12.3 25.6 28 3.8-20.4 19.5 5.1 27.9L50 69l-25 13.8 5.1-27.9L9.7 35.4l28-3.8z"/></svg>DIOPUTTANAAAA!!!A</b><a href="#programma">S</a><a href="#tessera">S</a></nav>
<header class="hero"><h1>A</h1><p>P</p><a class="btn w" href="#tessera">tessera</a></header>
<main>
<section id="programma"><h2>I</h2><div class="g3">
<div class="p"><h3>A</h3><p>A</p></div>
<div class="p"><h3>S</h3><p>S</p></div>
<div class="p"><h3>E</h3><p>A</p></div></div></section>
<section id="tessera"><h2>Carta</h2><div class="p" id="box"><p class="mute">Caricamento…</p></div></section>
<p class="mute">Prototipo</p>
</main>
<script src="https://ews-rose.vercel.app/estji-login.js"></script>
<script>
var $=function(s){return document.querySelector(s)},esc=function(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var tok=null,U=null,CARTA=undefined,M=null;try{tok=sessionStorage.getItem("partito_tok");U=JSON.parse(sessionStorage.getItem("partito_u")||"null")}catch(e){}
function api(b){return fetch("/api/tessere",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},tok?{Authorization:"Bearer "+tok}:{}),body:JSON.stringify(b)}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok){var e=new Error(d.error||"Errore "+r.status);e.status=r.status;throw e}return d})})}
function fd(s){var p=String(s||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:"—"}
function fino(s){var d=new Date(s);if(isNaN(d))return"—";d.setDate(d.getDate()+365);return"Fino al "+("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear()}
function cl(t){return String(t==null?"":t).toUpperCase().replace(/[^A-Z0-9]+/g,"<")}
function tessera(c){var rev=c.stato==="revocata",col=/^#[0-9a-fA-F]{6}$/.test(c.colore)?c.colore:"#8e1b2e";
  return'<div class="wal"><div class="wc'+(rev?" rev":"")+'" style="--cc:'+col+'"><div class="h"><b>'+esc(c.emittente)+' · Tessera di partito</b><small>Union der Wohlfartsstaaten von Estji</small></div><div class="bd"><div class="s2"><small>Iscritto</small><b>'+esc(U&&U.nick)+'</b></div><div class="s2"><small>Partito</small><b>'+esc(c.nomeEmittente)+'</b></div><div><small>N. tessera</small><b>'+esc(c.numero)+'</b></div><div><small>Validità</small><b>'+esc(rev?"Revocata":fino(c.emessa))+'</b></div></div><div class="mrz">T&lt;'+esc(cl(c.emittente))+'&lt;'+esc(cl(U&&U.nick))+'&lt;&lt;'+esc(cl(c.numero))+'</div></div></div>'}
function msg(){return M?'<div class="m '+M[0]+'">'+esc(M[1])+'</div>':""}
function esci(){tok=null;U=null;CARTA=undefined;try{sessionStorage.removeItem("partito_tok");sessionStorage.removeItem("partito_u")}catch(e){}}
function carica(){if(!tok||CARTA!==undefined)return render();
  api({azione:"mia"}).then(function(d){CARTA=d.carta},function(e){if(e.status===401)esci();else M=["bad",e.message]}).then(render)}
var qrBox=null;
function render(){var b=$("#box"),h="";
  if(!tok){
    h='<p>Per fare la tessera accedi con la tua identità digitale <b>Estji ID</b>: sul telefono apri l\'app, premi <b>Scansiona</b>, inquadra il QR e scegli il numero che vedi qui.</p><div id="slot"></div><p class="mute">Non hai ancora un\'identità? <a href="id.html">Creala su Estji ID</a>. Serve un\'identità verificata dallo staff.</p>'+msg();
    b.innerHTML=h;var s=$("#slot");
    if(typeof EstjiLogin==="undefined"){s.innerHTML='<div class="m bad">Widget Estji ID non disponibile: riprova più tardi.</div>';return}
    if(!qrBox){qrBox=document.createElement("div");qrBox.id="estji-login";s.appendChild(qrBox);
      EstjiLogin.mount("#estji-login",{clientId:"partito",scopes:["profile.basic"],onLogin:function(r){qrBox=null;M=null;
        api({azione:"accedi",id_token:r&&r.id_token}).then(function(d){tok=d.token;U={id:d.id,nick:d.nick};try{sessionStorage.setItem("partito_tok",tok);sessionStorage.setItem("partito_u",JSON.stringify(U))}catch(e){}CARTA=undefined;carica()},function(e){M=["bad",e.message];render()})}})}
    s.appendChild(qrBox);return}
  h='<p>Ciao <b>'+esc(U&&U.nick)+'</b> <span class="mute">('+esc(U&&U.id)+')</span></p>';
  if(CARTA){h+=tessera(CARTA)+'<p class="mute" style="text-align:center">La tessera è ora anche su Estji ID, tra le tue carte.</p><div class="row" style="justify-content:center"><a class="btn" href="id.html">Apri Estji ID</a><button class="btn alt" id="out">Esci</button></div>'}
  else{h+='<p>Non hai ancora la tessera. La tessera è gratuita, vale 365 giorni e viene collegata al tuo account Estji ID.</p><label class="c"><input type="checkbox" id="st"><span>Ho letto e accetto lo statuto dell\'Alleanza Civica Estji.</span></label><div class="row"><button class="btn" id="ok">Richiedi la tessera</button><button class="btn alt" id="out">Esci</button></div>'}
  b.innerHTML=h+msg();
  if($("#out"))$("#out").onclick=function(){esci();M=null;render()};
  if($("#ok"))$("#ok").onclick=function(){M=null;$("#ok").disabled=true;
    api({azione:"iscrivi",statuto:$("#st").checked}).then(function(d){CARTA=d.carta},function(e){M=["bad",e.message];if(e.status===401)esci()}).then(render)}}
carica();
</script></body></html>
