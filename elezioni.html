<script>
        // Il tuo nuovo BIN ID
        const JSONBIN_BIN_ID = '6aac4927ac6210605ad9e183'; 
        
        // La tua API Key con la "O" maiuscola corretta
        const JSONBIN_API_KEY = '$2a$10$InOPQfdwzq5HcxsmtZlLHupGKdaNYPfZ63/FogO4CbqjwcRQLXqUS'; 
        const API_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

        document.getElementById('sel_date').addEventListener('change', async function() {
            const dataSelezionata = this.value;
            if(dataSelezionata === "0") return;

            document.getElementById('messaggio-iniziale').style.display = 'none';
            document.getElementById('dati-elettorali').style.display = 'none';
            document.getElementById('loading_screen').style.display = 'block';

            try {
                // IL FIX: Abbiamo rimesso X-Access-Key
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: { 'X-Access-Key': JSONBIN_API_KEY } 
                });

                if (!response.ok) throw new Error(`Errore Server (${response.status})`);

                const result = await response.json();
                const elezione = result.record.elezioni[0]; 
                const partiti = elezione.risultati_partiti;

                let righeTabella = '';
                partiti.forEach(partito => {
                    righeTabella += `
                        <tr>
                            <td><strong>${partito.nome}</strong></td>
                            <td>${partito.voti.toLocaleString('it-IT')}</td>
                            <td>${partito.percentuale}</td>
                            <td>${partito.seggi}</td>
                        </tr>
                    `;
                });

                const htmlRisultati = `
                    <hr>
                    <h3 style="color: #004d99; margin-top: 20px;">Risultati ${elezione.tipo} ${elezione.anno} - ${elezione.comune}</h3>
                    
                    <div class="row" style="margin-top: 30px;">
                        <div class="col-md-6">
                            <div class="panel panel-default">
                                <div class="panel-heading"><strong>Distribuzione Geografica</strong></div>
                                <div class="panel-body" style="padding: 0;">
                                    <div id="mappaElettorale" style="height: 220px; width: 100%;"></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="panel panel-default">
                                <div class="panel-heading"><strong>Scrutini / Esito (Simulazione SI e NO)</strong></div>
                                <div class="panel-body" style="height: 220px; display: flex; flex-direction: column; justify-content: center;">
                                    <div class="sino-container">
                                        <div style="color: #1976d2;">SI</div>
                                        <div class="sino-progress">
                                            <div class="sino-si" style="width: 46.25%;">46,25%</div>
                                            <div class="sino-no" style="width: 53.75%;">53,75%</div>
                                        </div>
                                        <div style="color: #d9534f;">NO</div>
                                    </div>
                                    <div class="sino-labels">
                                        <span>Voti: 12.447.077</span>
                                        <span>Voti: 14.462.758</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row" style="margin-top: 20px;">
                        <div class="col-md-5">
                            <div class="panel panel-default">
                                <div class="panel-heading"><strong>Formazione Parlamentare / Consiglio</strong></div>
                                <div class="panel-body" style="display: flex; justify-content: center; align-items: center;">
                                    <canvas id="graficoParlamento"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-7">
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered table-risultati" style="margin-bottom: 0;">
                                    <thead>
                                        <tr>
                                            <th>Lista / Partito</th>
                                            <th>Voti</th>
                                            <th>%</th>
                                            <th>Seggi</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${righeTabella}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="panel panel-info" style="margin-top: 20px;">
                        <div class="panel-heading"><strong>Riepilogo Dati</strong></div>
                        <div class="panel-body">
                            <ul style="list-style-type: none; padding-left: 0; margin-bottom: 0; line-height: 1.8;">
                                <li><strong>Totale voti candidati presidente:</strong> 1.255.258</li>
                                <li><strong>Totale voti liste:</strong> 1.201.785</li>
                                <li><strong>Schede bianche:</strong> 15.327 (1,17 %)</li>
                                <li><strong>Schede nulle:</strong> 34.145 (2,61 %)</li>
                                <li><strong>Schede contestate e non assegnate:</strong> 111 (0,00 %)</li>
                                <li><strong>Seggio al candidato presidente eletto consigliere:</strong> 1</li>
                                <li><strong>Totale seggi attribuiti alle liste:</strong> 48</li>
                            </ul>
                        </div>
                    </div>
                `;

                document.getElementById('loading_screen').style.display = 'none';
                document.getElementById('dati-elettorali').innerHTML = htmlRisultati;
                document.getElementById('dati-elettorali').style.display = 'block';

                const selComune = document.getElementById('sel_comune');
                selComune.innerHTML = `<option value="1">${elezione.comune}</option>`;
                selComune.disabled = false;

                var map = L.map('mappaElettorale').setView([44.2227, 12.0407], 10);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap'
                }).addTo(map);

                var ctx = document.getElementById('graficoParlamento').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: partiti.map(p => p.nome),
                        datasets: [{
                            data: partiti.map(p => p.seggi),
                            backgroundColor: ['#1976d2', '#d9534f', '#f0ad4e', '#5cb85c', '#5bc0de'],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        rotation: -90,
                        circumference: 180,
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });

            } catch (error) {
                console.error(error);
                document.getElementById('loading_screen').style.display = 'none';
                document.getElementById('dati-elettorali').innerHTML = `
                    <div class="alert alert-danger" style="margin-top: 20px;">
                        <strong>Errore di Connessione:</strong> <br>${error.message}
                    </div>`;
                document.getElementById('dati-elettorali').style.display = 'block';
            }
        });
    </script>
